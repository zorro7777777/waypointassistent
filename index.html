<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Wandel Tracker</title>

<style>
body { font-family: Arial; }

.controls {
    display: flex;
    gap: 10px;
    margin: 10px 0;
}

button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    height: 50px;
}

/* status UI */
#info {
    background: #111;
    color: #0f0;
    padding: 12px;
    border-radius: 8px;
    font-family: monospace;
}

.status-row {
    display: flex;
    justify-content: space-between;
    margin: 4px 0;
}

.label {
    font-size: 12px;
    opacity: 0.7;
}

.value {
    font-size: 20px;
    font-weight: bold;
}

.offroute {
    color: red;
    font-weight: bold;
}

.passed { background: #c8f7c5; }
.skipped { background: #ffd6d6; }
.current { background: #fff3b0; }

table { border-spacing: 3px; }
td, th { border: 2px double black; padding: 3px; }

</style>
</head>

<body>

<h1>GPX Wandel Tracker</h1>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
    <button id="startStopBtn">▶️ Start activiteit</button>
    <button id="pauseBtn" disabled>⏸️ Pauze</button>
</div>

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints</h2>
<table>
<thead>
<tr>
<th>Status</th><th>Naam</th><th>Lat</th><th>Lon</th>
</tr>
</thead>
<tbody id="waypointsList"></tbody>
</table>

<script>

// ================== DATA ==================
let trackpoints = [];
let waypoints = [];

let currentTrackIndex = 0;
let currentWaypointIndex = 0;

let lastPosition = null;
let tripDistance = 0;

let trackingActive = false;
let paused = false;

let watchId = null;

let offRoute = false;

const tolerance = 10;

// ================== DISTANCE ==================
function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI/180;
    const dLon = (lon2 - lon1) * Math.PI/180;

    const a = Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ================== GPX LOAD ==================
document.getElementById('gpxFile').addEventListener('change', e => {

    const reader = new FileReader();

    reader.onload = evt => {
        const xml = new DOMParser().parseFromString(evt.target.result, "text/xml");

        trackpoints = Array.from(xml.getElementsByTagName('trkpt')).map(p => ({
            lat: parseFloat(p.getAttribute('lat')),
            lon: parseFloat(p.getAttribute('lon'))
        }));

        const wpts = Array.from(xml.getElementsByTagName('wpt'));
        processWaypoints(wpts);
        updateWaypointsTable();
    };

    reader.readAsText(e.target.files[0]);
});

// ================== WAYPOINTS ==================
function processWaypoints(wpts) {

    let temp = [];

    wpts.forEach(wp => {
        temp.push({
            name: wp.getElementsByTagName('name')[0]?.textContent || "WP",
            lat: parseFloat(wp.getAttribute('lat')),
            lon: parseFloat(wp.getAttribute('lon'))
        });
    });

    temp.unshift({
        name: "Start",
        lat: trackpoints[0].lat,
        lon: trackpoints[0].lon
    });

    temp.push({
        name: "Einde",
        lat: trackpoints.at(-1).lat,
        lon: trackpoints.at(-1).lon
    });

    const withIndex = temp.map(wp => ({
        ...wp,
        rank: findClosestTrackpointIndex(wp.lat, wp.lon)
    }));

    withIndex.sort((a,b)=>a.rank - b.rank);

    waypoints = withIndex.map(wp => ({
        ...wp,
        status: "pending"
    }));
}

function findClosestTrackpointIndex(lat, lon) {
    let best = 0;
    let minDist = Infinity;

    for (let i = 0; i < trackpoints.length; i++) {
        const d = calculateDistance(lat, lon, trackpoints[i].lat, trackpoints[i].lon);
        if (d < minDist) {
            minDist = d;
            best = i;
        }
    }
    return best;
}

// ================== BUTTONS ==================
document.getElementById('startStopBtn').onclick = () => {

    if (!trackingActive) {
        startTracking();
        trackingActive = true;
        startStopBtn.textContent = "⏹️ Stop activiteit";
        pauseBtn.disabled = false;
    } else {
        stopTracking();
        trackingActive = false;
        startStopBtn.textContent = "▶️ Start activiteit";
        pauseBtn.disabled = true;
    }
};

document.getElementById('pauseBtn').onclick = () => {
    paused = !paused;
    pauseBtn.textContent = paused ? "▶️ Hervatten" : "⏸️ Pauze";
};

// ================== TRACKING ==================
function startTracking() {

watchId = navigator.geolocation.watchPosition(pos => {

    if (!trackingActive || paused) return;

    const { latitude, longitude } = pos.coords;

    if (lastPosition) {
        tripDistance += calculateDistance(
            lastPosition.lat,
            lastPosition.lon,
            latitude,
            longitude
        );
    }

    lastPosition = { lat: latitude, lon: longitude };

    checkOffRoute(latitude, longitude);

    updateInfo(latitude, longitude);
    updateWaypointsTable();

}, console.error, { enableHighAccuracy:true });

}

function stopTracking() {
    navigator.geolocation.clearWatch(watchId);

    tripDistance = 0;
    currentWaypointIndex = 0;
    lastPosition = null;
    offRoute = false;

    waypoints.forEach(wp => wp.status="pending");

    document.getElementById('info').innerHTML = "Gestopt";
}

// ================== OFF ROUTE ==================
function checkOffRoute(lat, lon) {

    const route = trackpoints;

    let min = Infinity;

    for (let i=0;i<route.length;i++) {
        const d = calculateDistance(lat, lon, route[i].lat, route[i].lon);
        if (d < min) min = d;
    }

    if (min > 50 && !offRoute) {
        offRoute = true;
    }

    if (min < 10 && offRoute) {
        offRoute = false;
    }
}

// ================== UI ==================
function updateInfo(lat, lon) {

    const next = waypoints[currentWaypointIndex];
    let dist = next ? calculateDistance(lat,lon,next.lat,next.lon).toFixed(1)+" m" : "-";

    const progress = ((currentTrackIndex / trackpoints.length) * 100).toFixed(1);

    document.getElementById('info').innerHTML = `
<div class="status-row"><div class="label">📍 LAT</div><div class="value">${lat.toFixed(6)}</div></div>
<div class="status-row"><div class="label">📍 LON</div><div class="value">${lon.toFixed(6)}</div></div>

<div class="status-row"><div class="label">📊 PROGRESS</div><div class="value">${progress}%</div></div>

<div class="status-row"><div class="label">➡️ NEXT WP</div><div class="value">${dist}</div></div>

<div class="status-row"><div class="label">🧭 TRIP</div><div class="value">${(tripDistance/1000).toFixed(2)} km</div></div>

<div class="status-row ${offRoute ? 'offroute' : ''}">
<div class="label">⚠️ ROUTE</div>
<div class="value">${offRoute ? "OFF ROUTE" : "ON ROUTE"}</div>
</div>

<div class="status-row"><div class="label">STATUS</div><div class="value">${paused ? "PAUSED" : "ACTIVE"}</div></div>
`;
}

// ================== TABLE ==================
function updateWaypointsTable() {

    const list = document.getElementById('waypointsList');
    list.innerHTML = '';

    waypoints.forEach((wp,i)=>{

        let sym="⏳", cls="";
        if (wp.status==="passed") { sym="✅"; cls="passed"; }
        if (wp.status==="skipped") { sym="⚠️"; cls="skipped"; }
        if (i===currentWaypointIndex) cls="current";

        const row=document.createElement('tr');
        row.className=cls;

        row.innerHTML=`
        <td>${sym}</td>
        <td>${wp.name}</td>
        <td>${wp.lat.toFixed(5)}</td>
        <td>${wp.lon.toFixed(5)}</td>
        `;

        list.appendChild(row);
    });
}

</script>

</body>
</html>
