<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Tracker V10.2</title>
<style>
body{font-family:Arial}
.version{color:#666;margin-bottom:10px}
table{border-spacing:3px}
td,th{border:2px double black;padding:6px}
.startName{color:green;font-weight:bold}
.endName{color:red;font-weight:bold}
</style>
</head>
<body>

<h1>GPX Wandel Tracker</h1>
<div class="version">Versie 10.2 (Stable Segment + Pure GPS Engine)</div>

<input type="file" id="gpxFile" accept=".gpx">

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints (segment test)</h2>
<table>
<thead>
<tr>
<th>Status</th>
<th>Naam</th>
<th>Segment (m)</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>

let track=[], cum=[], waypoints=[];
let gpsTrip=0;
let lastLat=null,lastLon=null,lastTime=null;
let watchId=null;

const MAX_SPEED_KMH=8;

function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function buildCum(){
cum=[0];
for(let i=0;i<track.length-1;i++){
cum[i+1]=cum[i]+dist(track[i].lat,track[i].lon,track[i+1].lat,track[i+1].lon);
}
}

function closestIndex(lat,lon){
let best=0,bestD=Infinity;
for(let i=0;i<track.length;i++){
const d=dist(lat,lon,track[i].lat,track[i].lon);
if(d<bestD){bestD=d;best=i;}
}
return best;
}

// LOAD GPX

document.getElementById('gpxFile').onchange=e=>{
const r=new FileReader();
r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

track=[...xml.getElementsByTagName('trkpt')].map(p=>({
lat:+p.getAttribute('lat'),
lon:+p.getAttribute('lon')
}));

buildCum();

const w=[...xml.getElementsByTagName('wpt')];
waypoints=w.map(x=>({
name:x.getElementsByTagName('name')[0]?.textContent||"WP",
lat:+x.getAttribute('lat'),
lon:+x.getAttribute('lon'),
index:0,
segment:0,
passed:false
}));

// start + end
waypoints.unshift({name:"Start",lat:track[0].lat,lon:track[0].lon,index:0,segment:0,passed:false});
waypoints.push({name:"Einde",lat:track.at(-1).lat,lon:track.at(-1).lon,index:track.length-1,segment:0,passed:false});

// index mapping
waypoints.forEach(w=>w.index=closestIndex(w.lat,w.lon));
waypoints.sort((a,b)=>a.index-b.index);

// SEGMENTEN (START = 0 FIX)
for(let i=0;i<waypoints.length;i++){
if(i===0){waypoints[i].segment=0;continue;}
const prev=waypoints[i-1];
const curr=waypoints[i];
const seg=cum[curr.index]-cum[prev.index];
waypoints[i].segment=Math.max(0,seg);
}

render();
startGPS();
};
r.readAsText(e.target.files[0]);
};

// GPS ENGINE

function startGPS(){
watchId=navigator.geolocation.watchPosition(p=>{

const lat=p.coords.latitude;
const lon=p.coords.longitude;
const acc=p.coords.accuracy||999;
const speed=p.coords.speed? p.coords.speed*3.6 : 0;

let d=0;
if(lastLat){d=dist(lastLat,lastLon,lat,lon);}

// PURE FILTER
if(d>1 && d<25 && acc<20 && speed<MAX_SPEED_KMH){
    gpsTrip+=d;
}

lastLat=lat;
lastLon=lon;
lastTime=Date.now();

update(lat,lon,speed);

},console.error,{enableHighAccuracy:true});
}

// UI

function render(){
const l=document.getElementById('list');
l.innerHTML="";
waypoints.forEach(w=>{
let c="";
if(w.name==="Start")c="startName";
if(w.name==="Einde")c="endName";

l.innerHTML+=`<tr>
<td>⏳</td>
<td class="${c}">${w.name}</td>
<td>${w.segment.toFixed(1)}</td>
</tr>`;
});
}

function update(lat,lon,speed){
document.getElementById('info').innerHTML=`
📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
🧭 Trip (GPS): ${(gpsTrip/1000).toFixed(3)} km<br>
🚶 Snelheid: ${speed.toFixed(2)} km/u
`;
}

</script>

</body>
</html>
