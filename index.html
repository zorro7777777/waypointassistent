<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO - V3.3</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #info { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; margin: 10px 0; min-height: 520px; border-left: 5px solid #27ae60; position: relative; overflow: hidden; }
        .gear-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; cursor: pointer; opacity: 0.7; z-index: 10; }
        .highlight { color: #fff; font-weight: bold; font-size: 1.2rem; }
        .field-yellow { color: #ffff00; font-weight: bold; display: block; }
        .field-green { color: #00ff00; font-weight: bold; }
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        button { padding: 14px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .start { background: #27ae60; flex: 2; } 
        .pause { background: #f39c12; flex: 2; } 
        #gpxInput { width:100%; margin-bottom:10px; border:2px dashed #ccc; padding:15px; border-radius:8px; box-sizing: border-box; background: #fafafa; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        td { padding: 10px 5px; border-bottom: 1px solid #f1f1f1; }
        hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.2rem; margin:0 0 10px 0;">WAYPOINTASSISTENT PRO</h1>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:8px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <input type="number" id="userWeight" style="width:50px;" value="92"> kg
        </div>
        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
            <input type="checkbox" id="audioToggle" checked> 🔊 Spraakassistent Actief
        </label>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    
    <div class="row">
        <button onclick="handleStartPause()" id="startBtn" class="start">▶ START SYSTEEM</button>
        <button onclick="toggleTable()" style="background: #3498db; flex: 0.5;">📑</button>
        <button onclick="location.reload()" id="resetBtn" style="background: #e74c3c; flex: 0.5; display: none;">🔄</button>
    </div>
    
    <div id="info">
        <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
        <div id="standby-msg" style="text-align:center; padding-top:150px;">SYSTEEM STATUS: STANDBY</div>
        <div id="live-ui" style="display:none;">
            <span style="color:#aaa; font-size:0.8rem;">VOLGEND PUNT:</span><br>
            <span id="ui-next-wp" class="highlight">---</span><br>
            <span id="ui-dist" class="highlight">0m</span>
            <hr>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 5px;">
                <div>TRIP: <span id="ui-trip" class="field-green">0.000 km</span></div>
                <div>ETA: <span id="ui-eta" class="field-green">--:--</span></div>
                <div>TIJD: <span id="ui-mov-time" class="field-green">00:00:00</span></div>
                <div>OFF: <span id="ui-off" style="color:#00ff00">0m</span></div>
                <div>MET: <span id="ui-met" class="field-green">1.0</span></div>
                <div>KM/U: <span id="ui-speed" class="field-green">0.0</span></div>
            </div>
            <hr>
            <span style="color:#aaa; font-size:0.8rem;" id="ui-unit-label">STAPPEN:</span> <span id="ui-steps" class="field-green">0</span>
            <hr>
            <span class="field-yellow">LAT: <span id="ui-lat">0.000000</span></span>
            <span class="field-yellow">LON: <span id="ui-lon">0.000000</span></span>
        </div>
    </div>

    <div id="tableCon" style="display:none;">
        <table><tbody id="list"></tbody></table>
    </div>
</div>

<script>
const PROFS = {
    wandelen: { ms: 1.3, max: 7, th: 0.67, radius: 15, unit: "Stappen" },
    fietsen:  { ms: 5.5, max: 45, th: 2.10, radius: 25, unit: "Omwentelingen" }
};

let CONFIG = { ...PROFS.wandelen };
let track = [], waypoints = [], cumDist = [];
let watchId = null, lastPos = null, maxRoutePos = 0, tripDist = 0, finished = false;
let sport = { steps: 0, movingTime: 0, lastTick: null };
let isPaused = false, isOffRoute = false, lastOffSpeech = 0;
let speechQueue = [], isSpeaking = false;
let lastTrackIndex = 0;

const DOM = {
    uiNextWp: document.getElementById('ui-next-wp'), uiDist: document.getElementById('ui-dist'),
    uiTrip: document.getElementById('ui-trip'), uiSteps: document.getElementById('ui-steps'),
    uiUnitLabel: document.getElementById('ui-unit-label'), uiMovTime: document.getElementById('ui-mov-time'),
    uiOff: document.getElementById('ui-off'), uiLat: document.getElementById('ui-lat'),
    uiLon: document.getElementById('ui-lon'), uiEta: document.getElementById('ui-eta'),
    uiMet: document.getElementById('ui-met'), uiSpeed: document.getElementById('ui-speed'),
    liveUi: document.getElementById('live-ui'), standbyMsg: document.getElementById('standby-msg'), 
    audioToggle: document.getElementById('audioToggle')
};

function speak(text) {
    if (!DOM.audioToggle.checked) return;
    speechQueue.push(text.replace("START", "Startpunt").replace("FINISH", "De Finish"));
    processQueue();
}

function processQueue() {
    if (isSpeaking || speechQueue.length === 0) return;
    isSpeaking = true;
    const msg = new SpeechSynthesisUtterance(speechQueue.shift());
    msg.lang = 'nl-NL';
    msg.onend = () => { setTimeout(() => { isSpeaking = false; processQueue(); }, 1000); };
    window.speechSynthesis.speak(msg);
}

function getDist(a, b, c, d) {
    const R = 6371000;
    const rL = (c - a) * Math.PI / 180, rO = (d - b) * Math.PI / 180;
    const x = Math.sin(rL / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(rO / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
}

function getRInfo(lat, lon) {
    let bD = Infinity, bP = 0, bestIdx = 0;
    let start = Math.max(0, lastTrackIndex - 50), end = Math.min(track.length, lastTrackIndex + 100);
    for (let i = start; i < end; i++) {
        const d = getDist(lat, lon, track[i].lat, track[i].lon);
        if (d < bD) { bD = d; bP = cumDist[i]; bestIdx = i; }
    }
    lastTrackIndex = bestIdx;
    return { pos: bP, off: bD };
}

function handleStartPause() {
    if (track.length === 0) {
        alert("Laad eerst een GPX bestand!");
        return;
    }
    if (!watchId) {
        startGPS();
        document.getElementById('startBtn').innerText = "⏸ PAUZEER SYSTEEM";
        document.getElementById('startBtn').className = "pause";
        DOM.standbyMsg.style.display = 'none'; DOM.liveUi.style.display = 'block';
        speak("Systeem gestart.");
    } else {
        isPaused = !isPaused;
        document.getElementById('startBtn').innerText = isPaused ? "▶ HERVAT SYSTEEM" : "⏸ PAUZEER SYSTEEM";
        document.getElementById('startBtn').className = isPaused ? "start" : "pause";
        speak(isPaused ? "Systeem gepauzeerd." : "Systeem hervat.");
    }
}

function getMet(skmh) {
    const p = document.getElementById('profile').value;
    if (skmh < 0.5) return 1.0;
    if (p === 'wandelen') {
        if (skmh < 3.2) return 2.8;
        if (skmh < 4.5) return 3.5;
        if (skmh < 5.6) return 4.3;
        return 5.0;
    } else {
        if (skmh < 16) return 4.0;
        if (skmh < 19) return 6.0;
        if (skmh < 22) return 8.0;
        return 10.0;
    }
}

function startGPS() {
    watchId = navigator.geolocation.watchPosition(p => {
        if (finished || isPaused) return;

        const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = p.coords;
        if (acc > 30) return;

        const now = Date.now();
        const R = getRInfo(lat, lon);
        const skmh = (s || 0) * 3.6;

        if (R.pos > maxRoutePos) maxRoutePos = R.pos;

        // --- OFF-ROUTE DETECTIE ---
        if (R.off > 40) {
            isOffRoute = true;
            if (now - lastOffSpeech > 30000) {
                speak(`Route alarm: ${Math.round(R.off)} meter afwijking.`);
                lastOffSpeech = now;
            }
        } else if (isOffRoute && R.off < 15) {
            isOffRoute = false;
            speak("Terug op de route.");
        }

        // --- STATS & ETA ---
        if (lastPos && skmh > 0.5) {
            const d = getDist(lastPos.lat, lastPos.lon, lat, lon);
            tripDist += d;
            sport.movingTime += (now - (sport.lastTick || now)) / 1000;
            sport.steps += (d / CONFIG.th);
        }
        
        const avgSpeedMS = sport.movingTime > 0 ? tripDist / sport.movingTime : CONFIG.ms;
        const remD = cumDist[cumDist.length - 1] - R.pos;
        const etaS = remD / (avgSpeedMS > 0.5 ? avgSpeedMS : CONFIG.ms);
        const etaDate = new Date(Date.now() + etaS * 1000);
        const etaStr = finished ? "FINISH" : etaDate.getHours().toString().padStart(2, '0') + ":" + etaDate.getMinutes().toString().padStart(2, '0');

        // --- WAYPOINT LOGICA ---
        waypoints.forEach((w, i) => {
            if (w.passed || w.missed) return;
            const dToWp = getDist(lat, lon, w.lat, w.lon);
            
            if (dToWp <= CONFIG.radius || (R.pos >= w.routePos && dToWp < 40)) {
                if (w.name === "FINISH" && R.pos < (cumDist.at(-1) * 0.95)) return;
                
                w.passed = true;
                speak(`Waypoint bereikt: ${w.name}`);

                const next = waypoints.find((nw, idx) => !nw.passed && !nw.missed && idx > i);
                if (next) {
                    const dNext = Math.round(next.routePos - w.routePos);
                    let msg;
                    if (dNext < 50) {
                        msg = `Bijna bij ${next.name}`;
                    } else {
                        const phrases = [
                            `Ga verder naar waypoint ${next.name}`,
                            `Op naar waypoint ${next.name}`,
                            `De volgende bestemming is ${next.name}`,
                            `Je volgende waypoint is ${next.name}`
                        ];
                        msg = phrases[Math.floor(Math.random() * phrases.length)];
                    }
                    setTimeout(() => speak(msg), 2000);
                }

                if (w.name === "FINISH") { 
                    finished = true; 
                    speak("Gefeliciteerd, de finish is bereikt."); 
                }
            } else if (R.pos > w.routePos + 100) {
                w.missed = true;
                speak(`Waypoint ${w.name} overgeslagen.`);
            }
        });

        lastPos = { lat, lon };
        sport.lastTick = now;
        updateUI(lat, lon, R, skmh, etaStr, getMet(skmh));

    }, err => console.error("GPS Fout:", err), { enableHighAccuracy: true });
}

function updateUI(lat, lon, R, skmh, eta, met) {
    const next = waypoints.find(w => !w.passed && !w.missed);
    DOM.uiNextWp.textContent = next ? next.name : (finished ? "FINISH" : "---");
    DOM.uiDist.textContent = next ? Math.round(next.routePos - R.pos) + "m" : "0m";
    DOM.uiTrip.textContent = (tripDist/1000).toFixed(3) + " km";
    DOM.uiSteps.textContent = Math.round(sport.steps);
    DOM.uiMovTime.textContent = new Date(sport.movingTime * 1000).toISOString().substr(11, 8);
    DOM.uiOff.textContent = Math.round(R.off) + "m";
    DOM.uiOff.style.color = R.off > 40 ? 'red' : '#00ff00';
    DOM.uiEta.textContent = eta;
    DOM.uiMet.textContent = met.toFixed(1);
    DOM.uiSpeed.textContent = skmh.toFixed(1);
    DOM.uiLat.textContent = lat.toFixed(6); DOM.uiLon.textContent = lon.toFixed(6);
    updateWPUI();
}

document.getElementById('gpxInput').onchange = e => {
    const file = e.target.files[0];
    const reader = new FileReader();
    reader.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        const pts = [...xml.getElementsByTagName('trkpt')];
        track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        cumDist = [0];
        for(let i=0; i < track.length-1; i++) cumDist[i+1] = cumDist[i] + getDist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
        
        waypoints = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "WPT",
            lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'), passed: false, missed: false
        }));
        waypoints.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, passed: false, missed: false
