<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strava Engine v27 FIELD</title>

<style>
body{font-family:Arial}
.version{color:#666;margin-bottom:10px}

table{border-spacing:3px}
td,th{border:2px double black;padding:6px}

.controls{display:flex;gap:10px;margin:10px 0}
button{flex:1;padding:12px;font-size:16px;border:none;border-radius:6px;color:white}

.startBtn{background:#2ecc71}
.resetBtn{background:#3498db}

.slow{
color:#e74c3c;
font-weight:bold;
margin-left:10px;
}
</style>
</head>

<body>

<h1>GPX STRAVA ENGINE v27 FIELD</h1>
<div class="version">TRUE PASS + ANTI-OMMETJE + STABLE GPS CORE</div>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
<button id="startBtn" class="startBtn">▶️ Start</button>
<button id="resetBtn" class="resetBtn">🔄 Reset</button>
</div>

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints</h2>
<table>
<thead>
<tr>
<th>Status</th>
<th>Naam</th>
<th>Segment (m)</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>

// ================= STATE =================
let track=[];
let waypoints=[];
let cumDist=[];

let watchId=null;
let active=false;

let gpsTrip=0;
let lastLat=null;
let lastLon=null;

let maxRoutePos=0;

// ================= CONFIG =================
const RADIUS=20;
const TRACK_TOL=10;
const MIN_SPEED=1;

// ================= DIST =================
function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ================= GPS QUALITY =================
function getGPSQuality(accuracy){

let status="";
let icon="";

if(accuracy<=5){
status="TOP";
icon="🟢";
}
else if(accuracy<=10){
status="GOED";
icon="🟡";
}
else if(accuracy<=20){
status="MATIG";
icon="🟠";
}
else{
status="SLECHT";
icon="🔴";
}

return `${icon} ${status} (${accuracy.toFixed(1)} m)`;
}

// ================= POLYLINE =================
function buildPolyline(){
cumDist=[0];
for(let i=0;i<track.length-1;i++){
cumDist[i+1]=cumDist[i]+dist(
track[i].lat,track[i].lon,
track[i+1].lat,track[i+1].lon
);
}
}

// ================= ROUTE POSITION =================
function projectOnRoute(lat,lon){
let best=Infinity;
let bestPos=0;

for(let i=0;i<track.length;i++){
const d=dist(lat,lon,track[i].lat,track[i].lon);
if(d<best){
best=d;
bestPos=cumDist[i];
}
}
return bestPos;
}

// ================= DIST TO TRACK =================
function pointToSegment(px,py,ax,ay,bx,by){
const A=px-ax,B=py-ay,C=bx-ax,D=by-ay;
const dot=A*C+B*D;
const len=C*C+D*D;

let t=len===0?0:dot/len;
t=Math.max(0,Math.min(1,t));

const x=ax+t*C;
const y=ay+t*D;

return dist(px,py,x,y);
}

function minDistToTrack(lat,lon){
let best=Infinity;
for(let i=0;i<track.length-1;i++){
const d=pointToSegment(lat,lon,track[i].lat,track[i].lon,track[i+1].lat,track[i+1].lon);
if(d<best) best=d;
}
return best;
}

// ================= RESET =================
function resetAll(){

if(watchId){
navigator.geolocation.clearWatch(watchId);
watchId=null;
}

track=[];
waypoints=[];
cumDist=[];

gpsTrip=0;
lastLat=null;
lastLon=null;
maxRoutePos=0;

active=false;

document.getElementById('info').innerHTML="🔄 Reset klaar";
document.getElementById('list').innerHTML="";
}

// ================= LOAD =================
document.getElementById('gpxFile').onchange=e=>{
const r=new FileReader();

r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

track=[...xml.getElementsByTagName('trkpt')]
.map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));

buildPolyline();

gpsTrip=0;
lastLat=null;
lastLon=null;
maxRoutePos=0;
active=false;

waypoints=[...xml.getElementsByTagName('wpt')]
.map(x=>({
name:x.getElementsByTagName('name')[0]?.textContent||"WP",
lat:+x.getAttribute('lat'),
lon:+x.getAttribute('lon'),
routePos:0,
passed:false,
missed:false,
segment:0,
touched:false,
minDist:Infinity
}));

waypoints.unshift({
name:"Start",
lat:track[0].lat,
lon:track[0].lon,
routePos:0,
passed:true,
missed:false,
segment:0,
touched:true,
minDist:0
});

waypoints.push({
name:"Einde",
lat:track.at(-1).lat,
lon:track.at(-1).lon,
routePos:0,
passed:false,
missed:false,
segment:0,
touched:false,
minDist:Infinity
});

waypoints.forEach(w=>{
w.routePos=projectOnRoute(w.lat,w.lon);
});

waypoints.sort((a,b)=>a.routePos-b.routePos);

for(let i=0;i<waypoints.length;i++){
if(i===0){
waypoints[i].segment=0;
continue;
}
waypoints[i].segment=waypoints[i].routePos-waypoints[i-1].routePos;
}

render();
};

r.readAsText(e.target.files[0]);
};

// ================= ENGINE =================
function process(lat,lon){

const pos=projectOnRoute(lat,lon);

if(pos>maxRoutePos){
maxRoutePos=pos;
}

for(let w of waypoints){

if(w.passed||w.missed) continue;

const onTrack=minDistToTrack(w.lat,w.lon)<=TRACK_TOL;
if(!onTrack) continue;

const d=dist(lat,lon,w.lat,w.lon);

if(d<w.minDist){
w.minDist=d;
}

if(d<=RADIUS){
w.touched=true;
}

const passedRoute=pos>=w.routePos-RADIUS;

if(passedRoute && w.touched){
w.passed=true;
continue;
}

if(maxRoutePos>w.routePos+RADIUS && !w.passed){
w.missed=true;
}
}
}

// ================= GPS =================
function startTracking(){

if(watchId) return;

active=true;

watchId=navigator.geolocation.watchPosition(p=>{

if(!active) return;

const lat=p.coords.latitude;
const lon=p.coords.longitude;
const speed=(p.coords.speed||0)*3.6;

// ⭐ GPS ACCURACY
const accuracy=p.coords.accuracy||0;
const gpsQuality=getGPSQuality(accuracy);

// distance
let d=0;
if(lastLat){
d=dist(lastLat,lastLon,lat,lon);
if(d>0.3 && d<25){
gpsTrip+=d;
}
}

process(lat,lon);

lastLat=lat;
lastLon=lon;

let slow="";
if(speed<MIN_SPEED){
slow="⏸ STILSTAND";
}

document.getElementById('info').innerHTML=`
📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
🚶 ${speed.toFixed(2)} km/u <span class="slow">${slow}</span><br>
🧭 ${(gpsTrip/1000).toFixed(3)} km<br>
🎯 GPS: ${gpsQuality}
`;

render();

},console.error,{enableHighAccuracy:true});
}

// ================= STOP =================
function stopTracking(){
navigator.geolocation.clearWatch(watchId);
watchId=null;
active=false;
}

// ================= UI =================
function render(){
const l=document.getElementById('list');
l.innerHTML="";

waypoints.forEach(w=>{
let s="⏳";
if(w.passed) s="✅";
else if(w.missed) s="❌";

l.innerHTML+=`
<tr>
<td>${s}</td>
<td>${w.name}</td>
<td>${w.segment.toFixed(1)} m</td>
</tr>`;
});
}

// ================= BUTTONS =================
document.getElementById('startBtn').onclick=()=>{
startTracking();
};

document.getElementById('resetBtn').onclick=()=>{
resetAll();
};

</script>

</body>
</html>
