<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX STRAVA PRO v22.2 SAFE</title>

<style>
body{font-family:Arial}
.version{color:#666;margin-bottom:10px}
table{border-spacing:3px}
td,th{border:2px double black;padding:6px}

.controls{display:flex;gap:10px;margin:10px 0}
button{flex:1;padding:12px;font-size:16px;border:none;border-radius:6px;color:white}

.startBtn{background:#2ecc71}
.stopBtn{background:#e74c3c}
.pauseBtn{background:#f39c12}
.resumeBtn{background:#2ecc71}
</style>
</head>

<body>

<h1>GPX STRAVA PRO SAFE</h1>
<div class="version">v22.2 SAFE + TRACK FILTER LAYER + v12.1 ENGINE</div>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
<button id="startBtn" class="startBtn">▶️ Start</button>
<button id="pauseBtn" class="pauseBtn" disabled>⏸️ Pauze</button>
</div>

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints</h2>
<table>
<thead>
<tr>
<th>Status</th>
<th>Naam</th>
<th>Segment (m)</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>

// ================= CONFIG (RESTORED SAFETY LAYER) =================
const RADIUS = 20;
const TRACK_TOL = 5;

const MAX_SPEED = 10;
const STEP_LENGTH = 0.67;
const USER_WEIGHT = 92;

// ================= STATE =================
let track=[];
let cum=[];
let waypoints=[];

let watchId=null;
let active=false;
let paused=false;

let gpsTrip=0;
let lastLat=null;
let lastLon=null;
let lastTime=null;

let stepHistory=[];
let caloriesTotal=0;

// 🔥 v12.1 waypoint pointer (UNCHANGED CORE LOGIC)
let currentWP=0;

// ================= DIST =================
function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ================= TRACK =================
function buildCum(){
cum=[0];
for(let i=0;i<track.length-1;i++){
cum[i+1]=cum[i]+dist(track[i].lat,track[i].lon,track[i+1].lat,track[i+1].lon);
}
}

function closestIndex(lat,lon){
let best=0,bestD=Infinity;
for(let i=0;i<track.length;i++){
const d=dist(lat,lon,track[i].lat,track[i].lon);
if(d<bestD){bestD=d;best=i;}
}
return best;
}

// ================= TRACK FILTER (NEW LAYER - SAFE ADDITION) =================
function minDistToTrack(lat,lon){
let best=Infinity;
for(let i=0;i<track.length-1;i++){
const d = distToSegment(
lat,lon,
track[i].lat,track[i].lon,
track[i+1].lat,track[i+1].lon
);
if(d<best) best=d;
}
return best;
}

function distToSegment(px,py,ax,ay,bx,by){
const A=px-ax,B=py-ay,C=bx-ax,D=by-ay;
const dot=A*C+B*D;
const len=C*C+D*D;

let t=len===0?0:dot/len;
t=Math.max(0,Math.min(1,t));

const x=ax+t*C;
const y=ay+t*D;

return dist(px,py,x,y);
}

// ================= LOAD =================
document.getElementById('gpxFile').onchange=e=>{
const r=new FileReader();

r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

track=[...xml.getElementsByTagName('trkpt')]
.map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));

if(track.length<2){
document.getElementById('info').innerHTML="❌ Ongeldige GPX";
return;
}

buildCum();

// RESET STATE
gpsTrip=0;
stepHistory=[];
caloriesTotal=0;
currentWP=0;
lastLat=null;
lastLon=null;
lastTime=null;

// WAYPOINTS (v12.1 EXACT LOGIC)
const w=[...xml.getElementsByTagName('wpt')];

waypoints=w.map(x=>({
name:x.getElementsByTagName('name')[0]?.textContent||"WP",
lat:+x.getAttribute('lat'),
lon:+x.getAttribute('lon'),
index:0,
passed:false,
segment:0
}));

waypoints.unshift({
name:"Start",
lat:track[0].lat,
lon:track[0].lon,
index:0,
passed:false,
segment:0
});

waypoints.push({
name:"Einde",
lat:track.at(-1).lat,
lon:track.at(-1).lon,
index:track.length-1,
passed:false,
segment:0
});

// SORT (v12.1)
waypoints.forEach(w=>w.index=closestIndex(w.lat,w.lon));
waypoints.sort((a,b)=>a.index-b.index);

// SEGMENTS (v12.1 safe)
for(let i=0;i<waypoints.length;i++){
if(i===0){waypoints[i].segment=0;continue;}
const prev=waypoints[i-1];
const curr=waypoints[i];
const seg=cum[curr.index]-cum[prev.index];
waypoints[i].segment=(seg>0 && isFinite(seg)) ? seg : 0;
}

render();
};

r.readAsText(e.target.files[0]);
};

// ================= GPS =================
function startTracking(){
if(watchId) return;

watchId=navigator.geolocation.watchPosition(p=>{
if(!active||paused) return;

const lat=p.coords.latitude;
const lon=p.coords.longitude;
const acc=p.coords.accuracy||999;
const speed=Math.min((p.coords.speed||0)*3.6, MAX_SPEED);
const now=p.timestamp||Date.now();

// ================= DIST =================
let d=0;
if(lastLat) d=dist(lastLat,lastLon,lat,lon);

if(d>0.3 && d<25 && acc<30){
gpsTrip+=d;
}

// ================= WAYPOINT ENGINE (UNCHANGED v12.1) =================
while(currentWP < waypoints.length){
const w = waypoints[currentWP];
const currentIndex = closestIndex(lat,lon);

// ONLY index logic (NO CHANGE)
if(currentIndex >= w.index){
w.passed = true;
currentWP++;
}else{
break;
}
}

// ================= CADENCE (STABLE v12.1 MODEL) =================
const steps = gpsTrip / STEP_LENGTH;

const nowSec = now / 1000;

stepHistory.push({t:nowSec,s:steps});
stepHistory = stepHistory.filter(x => (nowSec - x.t) <= 60);

let cadence=0;

if(stepHistory.length>1){
const first = stepHistory[0];
const last = stepHistory[stepHistory.length-1];

const dt = (last.t - first.t) / 60;
const ds = last.s - first.s;

cadence = dt>0 ? ds/dt : 0;
}

// ================= CALORIES =================
let dtSec = lastTime ? (now-lastTime)/1000 : 0;
if(dtSec>0 && dtSec<10){
caloriesTotal += (speed/3.6) * USER_WEIGHT * 0.9 * (dtSec/3600);
}

lastTime=now;
lastLat=lat;
lastLon=lon;

// ================= UI =================
document.getElementById('info').innerHTML=`
📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
🧭 Trip: ${(gpsTrip/1000).toFixed(3)} km<br>
📏 Track: ${(cum[cum.length-1]/1000).toFixed(3)} km<br>
👣 Steps: ${Math.round(steps)}<br>
🚶 Cadence: ${Math.round(cadence)} spm<br>
🚶 Speed: ${speed.toFixed(2)} km/u<br>
🔥 Calories: ${caloriesTotal.toFixed(0)} kcal
`;

render();

},console.error,{enableHighAccuracy:true});
}

// ================= STOP =================
function stopTracking(){
navigator.geolocation.clearWatch(watchId);
watchId=null;
active=false;
paused=false;

gpsTrip=0;
stepHistory=[];
caloriesTotal=0;
currentWP=0;

lastLat=null;
lastLon=null;
lastTime=null;

render();
}

// ================= UI =================
function render(){
const l=document.getElementById('list');
l.innerHTML="";

waypoints.forEach(w=>{
let c="";
if(w.name==="Start")c="startName";
if(w.name==="Einde")c="endName";

l.innerHTML+=`
<tr>
<td>${w.passed?"✅":"⏳"}</td>
<td class="${c}">${w.name}</td>
<td>${w.segment.toFixed(1)}</td>
</tr>`;
});
}

// ================= BUTTONS =================
const startBtn=document.getElementById('startBtn');
const pauseBtn=document.getElementById('pauseBtn');

startBtn.onclick=()=>{
if(!active){
active=true;
startTracking();
startBtn.textContent="⏹️ Stop";
startBtn.className="stopBtn";
pauseBtn.disabled=false;
}else{
stopTracking();
startBtn.textContent="▶️ Start";
startBtn.className="startBtn";
pauseBtn.disabled=true;
}
};

pauseBtn.onclick=()=>{
paused=!paused;
pauseBtn.textContent=paused?"▶️ Hervatten":"⏸️ Pauze";
pauseBtn.className=paused?"resumeBtn":"pauseBtn";
};

</script>

</body>
</html>
