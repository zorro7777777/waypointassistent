<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Engine v41 - Pro Activation</title>
    <style>
        body { font-family: sans-serif; line-height: 1.5; padding: 10px; background: #f0f3f5; color: #2c3e50; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 1rem; color: #e67e22; text-align: center; margin-bottom: 10px; text-transform: uppercase; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
        .stat-box { 
            background: #fff; border: 1px solid #ddd; padding: 8px 2px; border-radius: 8px; 
            display: flex; flex-direction: column; justify-content: space-between; align-items: center;
            min-height: 60px;
        }
        .stat-label { font-size: 0.55rem; color: #7f8c8d; text-transform: uppercase; text-align: center; line-height: 1.1; }
        .stat-val { font-weight: bold; font-size: 0.95rem; color: #2c3e50; margin-top: auto; }

        .config-section { background: #ecf0f1; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; }
        .config-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 5px; }
        
        #info { 
            background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; 
            font-family: 'Courier New', monospace; margin-bottom: 15px; min-height: 180px; 
            font-size: 0.95rem; line-height: 1.6; border-left: 5px solid #27ae60;
        }
        #info b { color: #55ff55; font-size: 0.95rem; } 
        #info .highlight { font-size: 1.15rem; font-weight: bold; color: #ffffff; }
        
        .controls { display: flex; gap: 8px; margin-bottom: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; }
        .startBtn { background: #27ae60; }
        .resetBtn { background: #e74c3c; }
        
        #tableContainer { display: block; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; font-size: 0.7rem; color: #95a5a6; border-bottom: 2px solid #eee; }
        td { padding: 8px 0; border-bottom: 1px solid #f1f1f1; font-size: 0.8rem; }
        .dist-col { text-align: right; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1>GPX ENGINE v41 PRO</h1>

    <div class="stats-grid">
        <div class="stat-box"><span class="stat-label">Stappen</span><span id="stat-steps" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Act. Cadans</span><span id="stat-cadence" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Kcal</span><span id="stat-kcal" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Afstand Km</span><span id="stat-trip" class="stat-val">0.00</span></div>
    </div>

    <div class="stats-grid" style="grid-template-columns: repeat(2, 1fr);">
        <div class="stat-box"><span class="stat-label">Bewogen Tijd</span><span id="stat-moving" class="stat-val">00:00:00</span></div>
        <div class="stat-box"><span class="stat-label">Pauze Tijd</span><span id="stat-idle" class="stat-val">00:00:00</span></div>
    </div>

    <div class="config-section">
        <div class="config-row">
            <label><input type="checkbox" id="showTable" checked onchange="toggleTable()"> Toon Lijst</label>
            <select id="profileSelect">
                <option value="wandelaar">🚶 Wandelaar</option>
                <option value="fietser">🚲 Fietser</option>
            </select>
        </div>
        <div class="config-row" style="margin-top:5px;">
            <label><input type="checkbox" id="audioToggle" checked> Audio</label>
            <div>
                <input type="radio" name="voiceType" value="vrouw" checked> Vrouw
                <input type="radio" name="voiceType" value="man"> Man
            </div>
        </div>
    </div>
    
    <input type="file" id="gpxFile" accept=".gpx" style="margin-bottom: 10px; width: 100%; font-size: 0.8rem;">

    <div class="controls">
        <button id="startBtn" class="startBtn">START GPS</button>
        <button id="resetBtn" class="resetBtn">RESET</button>
    </div>

    <div id="info">Systeem gereed...</div>

    <div id="tableContainer">
        <table>
            <thead>
                <tr><th width="30">ST</th><th>WAYPOINT</th><th class="dist-col">SEGMENT</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>
</div>

<script>
// ================= STATE & CONFIG =================
let CONFIG = { minSpeed: 0.35, radius: 10, maxD: 8.0, maxAcc: 10 };
const PROFILES = {
    wandelaar: { minSpeed: 0.35, radius: 10, maxD: 8.0, maxAcc: 10 },
    fietser:   { minSpeed: 5.0, radius: 15, maxD: 18.0, maxAcc: 10.0 }
};

let track = [], waypoints = [], cumDist = [];
let watchId = null, active = false, finished = false;
let gpsTrip = 0, lastLat = null, lastLon = null, maxRoutePos = 0;
let sportData = { weight: 92, stepLength: 0.67, totalSteps: 0, movingTime: 0, idleTime: 0, calories: 0, lastTick: null };

function toggleTable() {
    document.getElementById('tableContainer').style.display = document.getElementById('showTable').checked ? 'block' : 'none';
}

function speak(t) {
    if (!document.getElementById('audioToggle').checked) return;
    const m = new SpeechSynthesisUtterance(t);
    m.lang = 'nl-NL';
    const v = window.speechSynthesis.getVoices();
    const isM = document.querySelector('input[name="voiceType"]:checked').value === 'man';
    let found = v.find(x => x.lang.includes('nl') && (isM ? 
        (x.name.toLowerCase().includes('male') || x.name.toLowerCase().includes('bart') || x.name.toLowerCase().includes('david')) : 
        (x.name.toLowerCase().includes('female') || x.name.toLowerCase().includes('vrouw') || x.name.toLowerCase().includes('ellen'))));
    if (found) m.voice = found;
    window.speechSynthesis.speak(m);
}

function dist(a,b,c,d){
    const R=6371000;
    const dLat=(c-a)*Math.PI/180; const dLon=(d-b)*Math.PI/180;
    const x=Math.sin(dLat/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
    return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

function projectOnRoute(lat, lon) {
    let bestDist = Infinity, bestPos = 0;
    for (let i = 0; i < track.length; i++) {
        const d = dist(lat, lon, track[i].lat, track[i].lon);
        if (d < bestDist) { bestDist = d; bestPos = cumDist[i]; }
    }
    return bestPos;
}

document.getElementById('gpxFile').onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        track = [...xml.getElementsByTagName('trkpt')].map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        cumDist = [0];
        for (let i=0; i<track.length-1; i++) cumDist[i+1] = cumDist[i] + dist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
        
        let wpts = [...xml.getElementsByTagName('wpt')].map(x => ({
            name: x.getElementsByTagName('name')[0]?.textContent || "WP",
            lat: +x.getAttribute('lat'), lon: +x.getAttribute('lon'),
            passed: false, missed: false, touched: false
        }));
        
        wpts.unshift({ name: "START", lat: track[0].lat, lon: track[0].lon, passed: false, touched: false });
        wpts.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, passed: false, touched: false });
        
        wpts.forEach(w => w.routePos = projectOnRoute(w.lat, w.lon));
        waypoints = wpts.sort((a,b) => a.routePos - b.routePos);
        for(let i=1; i<waypoints.length; i++) waypoints[i].segment = waypoints[i].routePos - waypoints[i-1].routePos;
        waypoints[0].segment = 0;
        render();
    };
    reader.readAsText(e.target.files[0]);
};

function render() {
    document.getElementById('list').innerHTML = waypoints.map(w => `
        <tr style="${w.passed ? 'color:#27ae60;' : w.missed ? 'color:#e74c3c' : ''}">
            <td>${w.passed ? '✅' : w.missed ? '❌' : '⏳'}</td>
            <td>${w.name}</td>
            <td class="dist-col">${w.segment ? w.segment.toFixed(0) : 0} m</td>
        </tr>
    `).join('');
}

function stopTracking() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = null; active = false; finished = true;
    speak("Eindpunt bereikt. Systeem gestopt.");
}

function startTracking() {
    if (watchId || !track.length) return;
    active = true; finished = false; 
    speak("Systeem stand-by. Loop naar de start.");

    watchId = navigator.geolocation.watchPosition(p => {
        if (finished) return;

        const lat = p.coords.latitude, lon = p.coords.longitude, acc = p.coords.accuracy;
        const speed = (p.coords.speed || 0) * 3.6, now = Date.now();
        const curPos = projectOnRoute(lat, lon);
        if (curPos > maxRoutePos) maxRoutePos = curPos;

        // ACTIVATIE CHECK: Is de START al gepasseerd?
        if (!waypoints[0].passed) {
            const dStart = dist(lat, lon, waypoints[0].lat, waypoints[0].lon);
            document.getElementById('info').innerHTML = `
                <b style="color:#ffaa00;">GA NAAR START...</b><br>
                <b>AFSTAND:</b> <span class="highlight">${dStart.toFixed(0)}m</span><br>
                <br>
                <b>GPS:</b> ${acc.toFixed(1)}m | Stand-by
            `;
            if (dStart <= CONFIG.radius) {
                waypoints[0].passed = true;
                sportData.lastTick = now;
                speak("Start bereikt. Tracking geactiveerd.");
                render();
            }
            return; 
        }

        // BEREKENINGEN (alleen na start)
        const dt = (now - sportData.lastTick) / 1000;
        const isM = speed >= CONFIG.minSpeed;
        if (isM) {
            sportData.movingTime += dt;
            const m = (speed / 3.6) * dt;
            sportData.totalSteps += (m / sportData.stepLength);
            sportData.calories += (((speed > 5 ? 4.5 : 3.0) * 3.5 * sportData.weight) / 200 / 60) * dt;
            if (lastLat && acc <= CONFIG.maxAcc) {
                const d = dist(lastLat, lastLon, lat, lon);
                if (d < CONFIG.maxD) gpsTrip += d;
            }
        } else { sportData.idleTime += dt; }

        const avgCadence = (sportData.movingTime > 0) ? (sportData.totalSteps / (sportData.movingTime / 60)) : 0;

        // UI UPDATE
        document.getElementById('stat-steps').innerText = Math.round(sportData.totalSteps);
        document.getElementById('stat-cadence').innerText = Math.round(isM ? (speed/3.6/sportData.stepLength*60) : 0);
        document.getElementById('stat-kcal').innerText = Math.round(sportData.calories);
        document.getElementById('stat-trip').innerText = (gpsTrip/1000).toFixed(2);
        document.getElementById('stat-moving').innerText = new Date(sportData.movingTime * 1000).toISOString().substr(11, 8);
        document.getElementById('stat-idle').innerText = new Date(sportData.idleTime * 1000).toISOString().substr(11, 8);

        // WP LOGICA
        let nextIdx = waypoints.findIndex(w => !w.passed && !w.missed);
        let nextWP = waypoints[nextIdx];
        let followingWP = waypoints[nextIdx + 1];

        waypoints.forEach((w, i) => {
            if (w.passed || w.missed) return;
            const d = dist(lat, lon, w.lat, w.lon);
            if (d <= CONFIG.radius) w.touched = true;
            if (curPos >= w.routePos - CONFIG.radius && w.touched) {
                w.passed = true; speak(w.name + " bereikt");
                if (w.name.toUpperCase() === "FINISH" || i === waypoints.length - 1) stopTracking();
            }
            if (maxRoutePos > w.routePos + CONFIG.radius + acc + 10) {
                w.missed = true; speak(w.name + " gemist");
            }
        });

        // DASHBOARD
        const pCount = waypoints.filter(w => w.passed).length;
        const mCount = waypoints.filter(w => w.missed).length;
        const distNext = nextWP ? (nextWP.routePos - curPos) : 0;

        document.getElementById('info').innerHTML = `
            <b>WP:</b> <span class="highlight">${pCount+mCount+1}/${waypoints.length}</span> (OK:${pCount} MIS:${mCount})<br>
            <b>DOEL:</b> <span class="highlight">${nextWP ? nextWP.name : 'FINISH'}</span><br>
            <b>REST:</b> <span class="highlight">${Math.max(0, distNext).toFixed(0)}m</span><br>
            <b>GEM. CADANS:</b> <span class="highlight">${Math.round(avgCadence)} spm</span><br>
            <b>VOLGENDE:</b> ${followingWP ? followingWP.name : '-'}<br>
            <b>GPS:</b> ${acc.toFixed(1)}m | ${isM ? '🏃' : '⏸'}
        `;

        lastLat = lat; lastLon = lon; sportData.lastTick = now;
        render();
    }, null, { enableHighAccuracy: true });
}

document.getElementById('startBtn').onclick = startTracking;
document.getElementById('resetBtn').onclick = () => location.reload();
</script>
</body>
</html>
