<script>

// ================= STATE =================
let track=[];
let waypoints=[];
let cumDist=[];

let watchId=null;
let active=false;

let gpsTrip=0;
let lastLat=null;
let lastLon=null;

let maxRoutePos=0;

// ================= CONFIG =================
const RADIUS=20;
const TRACK_TOL=10;
const MIN_SPEED=1;

// ================= DIST =================
function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ================= GPS QUALITY =================
function getGPSQuality(accuracy){
if(accuracy<=5) return `🟢 TOP (${accuracy.toFixed(1)}m)`;
if(accuracy<=10) return `🟡 GOED (${accuracy.toFixed(1)}m)`;
if(accuracy<=20) return `🟠 MATIG (${accuracy.toFixed(1)}m)`;
return `🔴 SLECHT (${accuracy.toFixed(1)}m)`;
}

// ================= POLYLINE =================
function buildPolyline(){
cumDist=[0];
for(let i=0;i<track.length-1;i++){
cumDist[i+1]=cumDist[i]+dist(
track[i].lat,track[i].lon,
track[i+1].lat,track[i+1].lon
);
}
}

// ================= 🔥 TRUE SEGMENT PROJECTION =================
// project point onto segment (A->B)
function projectOnSegment(px,py,ax,ay,bx,by){

const A = px-ax;
const B = py-ay;
const C = bx-ax;
const D = by-ay;

const dot = A*C + B*D;
const len2 = C*C + D*D;

let t = len2 === 0 ? 0 : dot / len2;
t = Math.max(0, Math.min(1, t));

const projLat = ax + t*C;
const projLon = ay + t*D;

// distance from start of segment in meters (approx along polyline)
const segLen = dist(ax,ay,bx,by);
const offset = segLen * t;

return {offset, distToLine: dist(px,py,projLat,projLon)};
}

// ================= ROUTE POSITION (IMPROVED) =================
function projectOnRoute(lat,lon){

let best = Infinity;
let bestPos = 0;

for(let i=0;i<track.length-1;i++){

const a = track[i];
const b = track[i+1];

const p = projectOnSegment(lat,lon,a.lat,a.lon,b.lat,b.lon);

const globalPos = cumDist[i] + p.offset;

if(p.distToLine < best){
best = p.distToLine;
bestPos = globalPos;
}
}

return bestPos;
}

// ================= DIST TO TRACK =================
function minDistToTrack(lat,lon){
let best=Infinity;

for(let i=0;i<track.length-1;i++){
const d = dist(lat,lon,track[i].lat,track[i].lon);
if(d<best) best=d;
}
return best;
}

// ================= RESET =================
function resetAll(){

if(watchId){
navigator.geolocation.clearWatch(watchId);
watchId=null;
}

track=[];
waypoints=[];
cumDist=[];

gpsTrip=0;
lastLat=null;
lastLon=null;
maxRoutePos=0;

active=false;

document.getElementById('info').innerHTML="🔄 Reset klaar";
document.getElementById('list').innerHTML="";
}

// ================= LOAD =================
document.getElementById('gpxFile').onchange=e=>{
const r=new FileReader();

r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

track=[...xml.getElementsByTagName('trkpt')]
.map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));

buildPolyline();

gpsTrip=0;
lastLat=null;
lastLon=null;
maxRoutePos=0;
active=false;

waypoints=[...xml.getElementsByTagName('wpt')]
.map(x=>({
name:x.getElementsByTagName('name')[0]?.textContent||"WP",
lat:+x.getAttribute('lat'),
lon:+x.getAttribute('lon'),
routePos:0,
passed:false,
missed:false,
segment:0,
touched:false,
minDist:Infinity
}));

waypoints.unshift({
name:"Start",
lat:track[0].lat,
lon:track[0].lon,
routePos:0,
passed:true,
missed:false,
segment:0,
touched:true,
minDist:0
});

waypoints.push({
name:"Einde",
lat:track.at(-1).lat,
lon:track.at(-1).lon,
routePos:0,
passed:false,
missed:false,
segment:0,
touched:false,
minDist:Infinity
});

// routePos (NOW ACCURATE)
waypoints.forEach(w=>{
w.routePos = projectOnRoute(w.lat,w.lon);
});

// sort correct route order
waypoints.sort((a,b)=>a.routePos-b.routePos);

// segments in meters (TRUE DISTANCE ALONG ROUTE)
for(let i=0;i<waypoints.length;i++){
if(i===0){
waypoints[i].segment=0;
continue;
}
waypoints[i].segment = waypoints[i].routePos - waypoints[i-1].routePos;

if(waypoints[i].segment < 0) waypoints[i].segment = 0;
}

render();
};

r.readAsText(e.target.files[0]);
};

// ================= ENGINE =================
function process(lat,lon){

const pos=projectOnRoute(lat,lon);

if(pos>maxRoutePos){
maxRoutePos=pos;
}

for(let w of waypoints){

if(w.passed||w.missed) continue;

const d=dist(lat,lon,w.lat,w.lon);

if(d<w.minDist){
w.minDist=d;
}

if(d<=RADIUS){
w.touched=true;
}

const passedRoute=pos>=w.routePos-RADIUS;

if(passedRoute && w.touched){
w.passed=true;
continue;
}

if(maxRoutePos>w.routePos+RADIUS && !w.passed){
w.missed=true;
}
}
}

// ================= GPS =================
function startTracking(){

if(watchId) return;

active=true;

watchId=navigator.geolocation.watchPosition(p=>{

if(!active) return;

const lat=p.coords.latitude;
const lon=p.coords.longitude;
const speed=(p.coords.speed||0)*3.6;

const accuracy=p.coords.accuracy||0;
const gpsQuality=getGPSQuality(accuracy);

// distance
let d=0;
if(lastLat){
d=dist(lastLat,lastLon,lat,lon);
if(d>0.3 && d<25){
gpsTrip+=d;
}
}

process(lat,lon);

lastLat=lat;
lastLon=lon;

let slow="";
if(speed<MIN_SPEED) slow="⏸ STILSTAND";

document.getElementById('info').innerHTML=`
📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
🚶 ${speed.toFixed(2)} km/u <span class="slow">${slow}</span><br>
🧭 ${(gpsTrip/1000).toFixed(3)} km<br>
🎯 GPS: ${gpsQuality}
`;

render();

},console.error,{enableHighAccuracy:true});
}

// ================= STOP =================
function stopTracking(){
navigator.geolocation.clearWatch(watchId);
watchId=null;
active=false;
}

// ================= UI =================
function render(){
const l=document.getElementById('list');
l.innerHTML="";

waypoints.forEach(w=>{
let s="⏳";
if(w.passed) s="✅";
else if(w.missed) s="❌";

l.innerHTML+=`
<tr>
<td>${s}</td>
<td>${w.name}</td>
<td>${w.segment.toFixed(1)} m</td>
</tr>`;
});
}

// ================= BUTTONS =================
document.getElementById('startBtn').onclick=startTracking;
document.getElementById('resetBtn').onclick=resetAll;

</script>
