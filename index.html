<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO - V3.6</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 5px; background: #f0f3f5; color: #2c3e50; font-size: 13px; }
        .card { max-width: 500px; margin: auto; background: white; padding: 10px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #info { background: #1a1a1a; color: #00ff00; padding: 12px; border-radius: 8px; font-family: monospace; margin: 8px 0; border-left: 5px solid #27ae60; }
        .gear-icon { float: right; font-size: 1.2rem; cursor: pointer; opacity: 0.7; }
        .highlight { color: #fff; font-weight: bold; font-size: 1.1rem; }
        .field-yellow { color: #ffff00; font-weight: bold; }
        .field-green { color: #00ff00; font-weight: bold; }
        .config-section { background: #ecf0f1; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .start { background: #27ae60; flex: 2; } 
        .pause { background: #f39c12; flex: 2; } 
        #gpxInput { width:100%; margin-bottom:10px; border:1px dashed #ccc; padding:10px; border-radius:8px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        td { padding: 6px 4px; border-bottom: 1px solid #f1f1f1; }
        .strikethrough { text-decoration: line-through; opacity: 0.6; }
        .coord-container { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .copy-btn { background: #333; color: #00ff00; padding: 8px 12px; font-size: 0.7rem; border-radius: 6px; border: 1px solid #00ff00; cursor: pointer; pointer-events: auto; }
        .copy-btn:active { background: #00ff00; color: #000; }
    </style>
</head>
<body>

<div class="card">
    <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
    <h2 style="margin:0 0 10px 0; font-size:1rem;">WAYPOINTASSISTENT PRO</h2>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:5px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <input type="number" id="userWeight" style="width:45px;" value="92"> kg
        </div>
        <label><input type="checkbox" id="audioToggle" checked> Spraakassistent</label>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px 0; text-align: center;">
        <div style="flex: 1; text-align: left;">OFF-ROUTE:<br><span id="ui-off-big" style="color:#00bfff; font-weight: 900; font-size: 2rem;">0m</span></div>
        <div style="flex: 1;">KM/U:<br><span id="ui-speed-big" style="color:#00bfff; font-weight: 900; font-size: 2rem;">0.0</span></div>
        <div style="flex: 1; text-align: right;">GPS +/-:<br><span id="ui-acc-big" style="color:#00bfff; font-weight: 900; font-size: 2rem;">0m</span></div>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    
    <div class="row">
        <button onclick="handleStartPause()" id="startBtn" class="start">▶ START</button>
        <button onclick="toggleTable()" style="background: #3498db; flex: 0.4;">📑</button>
        <button onclick="location.reload()" id="resetBtn" style="background: #e74c3c; flex: 0.4; display: none;">🔄</button>
    </div>
    
    <div id="info">
        <div id="standby-msg" style="text-align:center; padding: 40px 0;">STANDBY - LADEN A.U.B.</div>
        <div id="live-ui" style="display:none;">
            <div>PUNT: <span id="ui-next-wp" class="highlight">---</span> (<span id="ui-dist">0m</span>)</div>
            <hr style="border:0; border-top:1px solid #333;">
            <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap: 4px;">
                <div>TRIP: <span id="ui-trip" class="field-green">0.000km</span></div>
                <div>ETA : <span id="ui-eta" class="field-green">--:--</span></div>
                <div>MOVE: <span id="ui-mov-time" class="field-green">00:00:00</span></div>
                <div>PAUZE: <span id="ui-pause-time" class="field-green">00:00:00</span></div>
                <div>AVG : <span id="ui-avg-speed" class="field-green">0.0 km/u</span></div>
                <div>KM/U: <span id="ui-speed" class="field-green">0.0</span></div>
                <div>MET : <span id="ui-met" class="field-green">1.0</span></div>
            </div>
            <hr style="border:0; border-top:1px solid #333;">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><span id="ui-unit-label">STAPPEN:</span> <span id="ui-steps" class="field-green">0</span></div>
                <div style="text-align: right;">KCAL: <span id="ui-kcal" class="field-green">0</span></div>
            </div>
            <hr style="border:0; border-top:1px solid #333;">
            <div class="coord-container">
                <div style="font-size: 0.8rem;">
                    <span class="field-yellow">LAT: <span id="ui-lat">0.000000</span></span><br>
                    <span class="field-yellow">LON: <span id="ui-lon">0.000000</span></span>
                </div>
                <div class="copy-btn" id="copyCoords" onclick="copyCoords()">📋 KOPIEER</div>
            </div>
            <div id="tableCon" style="display:none; margin-top:10px;"><table id="list"></table></div>
        </div>
    </div>
</div>

<script>
const PROFS = {
    wandelen: { ms: 0.36, max: 7, th: 0.67, radius: 15, unit: "STAPPEN" },
    fietsen:  { ms: 5.5, max: 45, th: 2.10, radius: 25, unit: "OMWENTELINGEN" }
};

let CONFIG = { ...PROFS.wandelen };
let track = [], waypoints = [], cumDist = [];
let watchId = null, lastPos = null, tripDist = 0, finished = false;
let sport = { steps: 0, kcal: 0, movingTime: 0, pauseTime: 0, lastTick: null };
let isPaused = false, lastOffSpeech = 0, lastTrackIndex = 0;
let speechQueue = [], isSpeaking = false, wakeLock = null, smoothSpeed = 0, isOffRoute = false;

const DOM = {
    uiNextWp: document.getElementById('ui-next-wp'), uiDist: document.getElementById('ui-dist'),
    uiTrip: document.getElementById('ui-trip'), uiSteps: document.getElementById('ui-steps'),
    uiKcal: document.getElementById('ui-kcal'), uiUnitLabel: document.getElementById('ui-unit-label'), 
    uiMovTime: document.getElementById('ui-mov-time'), uiPauseTime: document.getElementById('ui-pause-time'), 
    uiAvgSpeed: document.getElementById('ui-avg-speed'), uiOffBig: document.getElementById('ui-off-big'), 
    uiLat: document.getElementById('ui-lat'), uiLon: document.getElementById('ui-lon'), 
    uiEta: document.getElementById('ui-eta'), uiMet: document.getElementById('ui-met'), 
    uiSpeed: document.getElementById('ui-speed'), liveUi: document.getElementById('live-ui'), 
    standbyMsg: document.getElementById('standby-msg'), audioToggle: document.getElementById('audioToggle'), 
    startBtn: document.getElementById('startBtn'), resetBtn: document.getElementById('resetBtn'), 
    gpxInput: document.getElementById('gpxInput'), configArea: document.getElementById('configArea')
};

function speak(text) {
    if (!DOM.audioToggle.checked) return;
    speechQueue.push(text.replace("START", "Het Startpunt").replace("FINISH", "De Finish"));
    if (!isSpeaking) processQueue();
}

function processQueue() {
    if (speechQueue.length === 0) { isSpeaking = false; return; }
    isSpeaking = true;
    const msg = new SpeechSynthesisUtterance(speechQueue.shift());
    msg.lang = 'nl-NL';
    msg.onend = () => setTimeout(processQueue, 500);
    window.speechSynthesis.speak(msg);
}

function getDist(a, b, c, d) {
    const R = 6371000;
    const rL = (c - a) * Math.PI / 180, rO = (d - b) * Math.PI / 180;
    const x = Math.sin(rL / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(rO / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
}

function getRInfo(lat, lon) {
    if (track.length === 0) return { pos: 0, off: 0 };
    let bD = Infinity, bP = 0, bestIdx = 0;
    let start = Math.max(0, lastTrackIndex - 100), end = Math.min(track.length, lastTrackIndex + 200);
    for (let i = start; i < end; i++) {
        const d = getDist(lat, lon, track[i].lat, track[i].lon);
        if (d < bD) { bD = d; bP = cumDist[i]; bestIdx = i; }
    }
    lastTrackIndex = bestIdx;
    return { pos: bP, off: bD };
}

function startGPS() {
    watchId = navigator.geolocation.watchPosition(p => {
        const now = Date.now();
        const delta = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;
        sport.lastTick = now;

        if (isPaused || finished) return;

        const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = p.coords;
        const skmh = (s || 0) * 3.6;
        const R = getRInfo(lat, lon);
        let met = getMet(skmh);
        const avg = sport.movingTime > 2 ? (tripDist / sport.movingTime) * 3.6 : 0;

        let displayEta = "--:--";
        updateUI(lat, lon, R, skmh, displayEta, avg, met, acc);

        if (acc > 50) return;

        if (R.off > 40) {
            if (!isOffRoute) isOffRoute = true;
            if (now - lastOffSpeech > 20000) {
                speak(`Route alarm: ${Math.round(R.off)} meter`);
                lastOffSpeech = now;
            }
        } else {
            if (isOffRoute) { speak("Route hersteld"); isOffRoute = false; }
        }

        if (lastPos) {
            const d = getDist(lastPos.lat, lastPos.lon, lat, lon);
            const weight = parseFloat(document.getElementById('userWeight').value) || 92;
            if (skmh > 1.8 && !isPaused) {
                tripDist += d;
                sport.movingTime += delta;
                sport.steps += (d / CONFIG.th);
                sport.kcal += ((met * weight * 1.05) / 3600) * delta;
            } else {
                sport.pauseTime += delta;
                met = 1.0;
            }
        }

        const distLeft = (cumDist.at(-1) || 0) - R.pos;
        const speedForEta = skmh > 2 ? skmh : (avg > 2 ? avg : CONFIG.ms * 3.6);
        const etaS = distLeft / (speedForEta / 3.6);
        if (isFinite(etaS) && etaS > 0) {
            displayEta = new Date(Date.now() + etaS * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        waypoints.forEach(w => {
            if (w.passed || w.missed) return;
            const d = getDist(lat, lon, w.lat, w.lon);
            if (d <= CONFIG.radius || (R.pos >= w.routePos && d < 40)) {
                w.passed = true;
                speak(`Je nadert: ${w.name}`);
                if (w.name === "FINISH") {
                    finished = true;
                    if (watchId) navigator.geolocation.clearWatch(watchId);
                }
            }
        });

        lastPos = { lat, lon };
        updateUI(lat, lon, R, skmh, displayEta, avg, met, acc);

    }, err => console.error(err), { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 });
}

function updateUI(lat, lon, R, skmh, eta, avg, met, acc) {
    const next = waypoints.find(w => !w.passed && !w.missed);
    DOM.uiNextWp.innerText = next ? next.name : (finished ? "FINISH" : "---");
    DOM.uiDist.innerText = next ? Math.max(0, Math.round(next.routePos - R.pos)) + "m" : "0m";
    DOM.uiTrip.innerText = (tripDist / 1000).toFixed(3) + " km";
    DOM.uiSteps.innerText = Math.round(sport.steps);
    DOM.uiKcal.innerText = Math.round(sport.kcal);
    DOM.uiMovTime.innerText = fmt(sport.movingTime);
    DOM.uiPauseTime.innerText = fmt(sport.pauseTime);
    DOM.uiAvgSpeed.innerText = avg.toFixed(1) + " km/u";
    DOM.uiMet.innerText = met.toFixed(1);
    DOM.uiSpeed.innerText = skmh.toFixed(1);
    DOM.uiLat.innerText = lat.toFixed(6);
    DOM.uiLon.innerText = lon.toFixed(6);
    DOM.uiEta.innerText = eta;

    const speedBig = document.getElementById('ui-speed-big');
    if (speedBig) speedBig.innerText = skmh.toFixed(1);

    const off = Math.round(R.off);
    DOM.uiOffBig.innerText = off + "m";
    DOM.uiOffBig.style.color = off > 80 ? 'red' : (off > 40 ? 'orange' : '#00bfff');

    const accElement = document.getElementById('ui-acc-big');
    if (accElement) {
        accElement.innerText = Math.round(acc) + "m";
        accElement.style.color = acc > 30 ? 'red' : (acc > 15 ? 'orange' : '#00bfff');
    }
    updateWPUI();
}

function handleStartPause() {
    if (track.length === 0) return alert("Laad eerst een GPX!");
    if (!watchId) {
        startGPS();
        DOM.startBtn.innerText = "⏸ PAUZE"; DOM.startBtn.className = "pause";
        DOM.standbyMsg.style.display = 'none'; DOM.liveUi.style.display = 'block';
        speak("Gestart");
    } else {
        isPaused = !isPaused;
        DOM.startBtn.innerText = isPaused ? "▶ HERVAT" : "⏸ PAUZE";
        DOM.startBtn.className = isPaused ? "start" : "pause";
        speak(isPaused ? "Gepauzeerd" : "Hervat");
    }
    sport.lastTick = Date.now();
}

function fmt(s) { return new Date(s * 1000).toISOString().substr(11, 8); }
function getMet(s) { 
    const p = document.getElementById('profile').value;
    if (s < 1.0) return 1.0;
    if (p === 'wandelen') return s > 6 ? 5.0 : (s > 4 ? 3.5 : 2.5);
    return s > 25 ? 10.0 : (s > 15 ? 6.0 : 3.5);
}

DOM.gpxInput.onchange = e => {
    const r = new FileReader();
    r.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        const pts = [...xml.getElementsByTagName('trkpt')];
        track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        cumDist = [0];
        for(let i=0; i<track.length-1; i++) cumDist[i+1] = cumDist[i] + getDist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
        waypoints = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "WPT",
            lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'), passed: false, missed: false
        }));
        if (!waypoints.find(w => w.name === "START")) waypoints.push({ name: "START", lat: track[0].lat, lon: track[0].lon, passed: false, missed: false });
        waypoints.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, passed: false, missed: false });
        waypoints.forEach(w => {
            let bD = Infinity, bP = 0;
            track.forEach((t, i) => { const d = getDist(w.lat, w.lon, t.lat, t.lon); if(d<bD) { bD=d; bP=cumDist[i]; }});
            w.routePos = bP;
        });
        waypoints.sort((a,b) => a.routePos - b.routePos);
        DOM.standbyMsg.innerText = "GELADEN - DRUK START";
        DOM.gpxInput.style.display = 'none';
        updateWPUI();
    };
    r.readAsText(e.target.files[0]);
};

function updateWPUI() {
    document.getElementById('list').innerHTML = waypoints.map(w => `
        <tr class="${w.missed ? 'strikethrough' : ''}" style="color: ${w.passed ? '#27ae60' : (w.missed ? '#e74c3c' : '#2c3e50')}">
            <td>${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td>
            <td>${w.name}</td>
            <td style="text-align:right">${(w.routePos/1000).toFixed(2)}km</td>
        </tr>`).join('');
}

function toggleConfig() { 
    const v = DOM.configArea.style.display === 'block';
    DOM.configArea.style.display = v ? 'none' : 'block';
    DOM.resetBtn.style.display = DOM.gpxInput.style.display = v ? 'none' : 'block';
}
function toggleTable() { document.getElementById('tableCon').style.display = document.getElementById('tableCon').style.display==='none'?'block':'none'; }
function updateProfile() { CONFIG = { ...PROFS[document.getElementById('profile').value] }; DOM.uiUnitLabel.innerText = CONFIG.unit + ":"; }
function copyCoords() {
    const t = DOM.uiLat.innerText + ", " + DOM.uiLon.innerText;
    navigator.clipboard.writeText(t).then(() => {
        const b = document.getElementById('copyCoords'); b.innerText = "✅ OK";
        setTimeout(() => b.innerText = "📋 KOPIEER", 2000);
    });
}
</script>
</body>
</html>
