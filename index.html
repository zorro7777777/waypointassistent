<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Wandel Tracker V3.1</title>

<style>
body { font-family: Arial; }

h1 { margin-bottom: 5px; }

.version {
    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
}

.controls {
    display: flex;
    gap: 10px;
    margin: 10px 0;
}

button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    height: 50px;
    border: none;
    border-radius: 6px;
    color: white;
}

/* button states */
.start { background: #2ecc71; }   /* groen */
.stop { background: #e74c3c; }    /* rood */
.pause { background: #f39c12; }   /* oranje */
.resume { background: #2ecc71; }  /* groen */

.passed { background: #c8f7c5; }
.current { background: #fff3b0; }

/* waypoint name in blauw */
td.name {
    color: blue;
    font-weight: bold;
}

table { border-spacing: 3px; }
td, th { border: 2px double black; padding: 6px; }

</style>
</head>

<body>

<h1>GPX Wandel Tracker</h1>
<div class="version">Versie 3.1 (UI + resterende waypoints)</div>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
    <button id="startStopBtn" class="start">▶️ Start activiteit</button>
    <button id="pauseBtn" class="pause" disabled>⏸️ Pauze</button>
</div>

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints</h2>
<table>
<thead>
<tr>
<th>Status</th><th>Naam</th>
</tr>
</thead>
<tbody id="waypointsList"></tbody>
</table>

<script>

let trackpoints = [];
let waypoints = [];

let currentTrackIndex = 0;
let currentWaypointIndex = 0;

let lastPosition = null;
let tripDistance = 0;

let trackingActive = false;
let paused = false;

let watchId = null;

const tolerance = 10;

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI/180;
    const dLon = (lon2 - lon1) * Math.PI/180;

    const a = Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

document.getElementById('gpxFile').addEventListener('change', e => {

    const reader = new FileReader();

    reader.onload = evt => {
        const xml = new DOMParser().parseFromString(evt.target.result, "text/xml");

        trackpoints = Array.from(xml.getElementsByTagName('trkpt')).map(p => ({
            lat: parseFloat(p.getAttribute('lat')),
            lon: parseFloat(p.getAttribute('lon'))
        }));

        const wpts = Array.from(xml.getElementsByTagName('wpt'));
        processWaypoints(wpts);
        updateWaypointsTable();
    };

    reader.readAsText(e.target.files[0]);
});

function processWaypoints(wpts) {

    let temp = [];

    wpts.forEach(wp => {
        temp.push({
            name: wp.getElementsByTagName('name')[0]?.textContent || "WP",
            lat: parseFloat(wp.getAttribute('lat')),
            lon: parseFloat(wp.getAttribute('lon'))
        });
    });

    temp.unshift({
        name: "Start",
        lat: trackpoints[0].lat,
        lon: trackpoints[0].lon
    });

    temp.push({
        name: "Einde",
        lat: trackpoints.at(-1).lat,
        lon: trackpoints.at(-1).lon
    });

    const withIndex = temp.map(wp => ({
        ...wp,
        rank: findClosestTrackpointIndex(wp.lat, wp.lon)
    }));

    withIndex.sort((a,b)=>a.rank - b.rank);

    waypoints = withIndex.map(wp => ({
        ...wp,
        status: "pending"
    }));
}

function findClosestTrackpointIndex(lat, lon) {
    let best = 0;
    let minDist = Infinity;

    for (let i = 0; i < trackpoints.length; i++) {
        const d = calculateDistance(lat, lon, trackpoints[i].lat, trackpoints[i].lon);
        if (d < minDist) {
            minDist = d;
            best = i;
        }
    }
    return best;
}

const startStopBtn = document.getElementById('startStopBtn');
const pauseBtn = document.getElementById('pauseBtn');

startStopBtn.onclick = () => {

    if (!trackingActive) {
        startTracking();
        trackingActive = true;
        startStopBtn.textContent = "⏹️ Stop activiteit";
        setBtnState(startStopBtn, "stop");
        pauseBtn.disabled = false;
    } else {
        stopTracking();
        trackingActive = false;
        startStopBtn.textContent = "▶️ Start activiteit";
        setBtnState(startStopBtn, "start");
        pauseBtn.disabled = true;
    }
};

pauseBtn.onclick = () => {

    paused = !paused;

    if (paused) {
        pauseBtn.textContent = "▶️ Hervatten";
        setBtnState(pauseBtn, "resume");
    } else {
        pauseBtn.textContent = "⏸️ Pauze";
        setBtnState(pauseBtn, "pause");
        lastPosition = null;
    }
};

function setBtnState(btn, state) {
    btn.classList.remove("start","stop","pause","resume");
    btn.classList.add(state);
}

function startTracking() {

    watchId = navigator.geolocation.watchPosition(pos => {

        if (!trackingActive || paused) return;

        const { latitude, longitude } = pos.coords;

        if (lastPosition) {
            const d = calculateDistance(lastPosition.lat, lastPosition.lon, latitude, longitude);
            if (d > 3) tripDistance += d;
        }

        lastPosition = { lat: latitude, lon: longitude };

        currentTrackIndex = findClosestForward(latitude, longitude);

        processRealtimeWaypoints(latitude, longitude);

        updateWaypointsTable();
        updateInfo(latitude, longitude);

    }, console.error, { enableHighAccuracy:true });
}

function stopTracking() {
    navigator.geolocation.clearWatch(watchId);

    tripDistance = 0;
    currentTrackIndex = 0;
    currentWaypointIndex = 0;
    lastPosition = null;

    waypoints.forEach(wp => wp.status="pending");

    updateWaypointsTable();
    document.getElementById('info').innerHTML = "Gestopt";
}

function processRealtimeWaypoints(lat, lon) {

    while (currentWaypointIndex < waypoints.length) {

        const wp = waypoints[currentWaypointIndex];
        const dist = calculateDistance(lat, lon, wp.lat, wp.lon);

        if (dist <= tolerance) {
            wp.status = "passed";
            currentWaypointIndex++;
            continue;
        }

        break;
    }
}

function findClosestForward(lat, lon) {

    let best = currentTrackIndex;
    let bestDist = Infinity;

    for (let i=currentTrackIndex;i<Math.min(trackpoints.length, currentTrackIndex+50);i++) {
        const d = calculateDistance(lat, lon, trackpoints[i].lat, trackpoints[i].lon);
        if (d < bestDist) { bestDist=d; best=i; }
    }

    return best;
}

function updateWaypointsTable() {

    const list = document.getElementById('waypointsList');
    list.innerHTML = '';

    waypoints.forEach((wp,i)=>{

        let sym="⏳", cls="";
        if (wp.status==="passed") { sym="✅"; cls="passed"; }
        if (i===currentWaypointIndex) cls="current";

        const row=document.createElement('tr');
        row.className=cls;

        row.innerHTML=`
        <td>${sym}</td>
        <td class="name">${wp.name}</td>
        `;

        list.appendChild(row);
    });
}

function updateInfo(lat, lon) {

    const next = waypoints[currentWaypointIndex];

    const remaining = Math.max(0, waypoints.length - currentWaypointIndex);

    let dist = next ? calculateDistance(lat,lon,next.lat,next.lon).toFixed(1)+" m" : "-";

    document.getElementById('info').innerHTML = `
    📍 Positie: ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
    ➡️ Afstand volgende WP: ${dist}<br>
    🧭 Trip (GPS): ${(tripDistance/1000).toFixed(2)} km<br>
    📌 Resterende WP's: ${remaining}<br>
    Status: ${paused ? "⏸️ Pauze" : "▶️ Actief"}
    `;
}

</script>

</body>
</html>
