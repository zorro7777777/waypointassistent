<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO - V4.6</title>

    <style>
        :root {
            --bg-dark: #1a1a1a;
            --accent: #00bfff;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --text-main: #2c3e50;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            padding: 5px;
            background: #f0f3f5;
            color: var(--text-main);
            font-size: 13px;
            margin: 0;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        #console {
            background: var(--bg-dark);
            color: #00ff00;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            border-left: 5px solid var(--success);
            min-height: 100px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-value {
            color: var(--accent);
            font-weight: 900;
            font-size: 1.8rem;
            display: block;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .config-section {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            flex: 1;
        }

        .btn-start { background: var(--success); flex: 2; }
        .btn-blue { background: var(--accent); flex: 0.5; }
        .btn-red { background: var(--danger); flex: 0.5; }

        hr {
            border: 0;
            border-top: 1px solid #444;
            margin: 8px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        td {
            padding: 10px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .strikethrough {
            text-decoration: line-through;
            opacity: 0.5;
            color: var(--danger);
        }

        .info-badge {
            background: var(--accent);
            color: white;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 50%;
            margin-left: 5px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
        <h2 style="margin:0; font-size:1.1rem;">
            WAYPOINTASSISTENT <span style="color:var(--accent)">PRO V4.6</span>
        </h2>
        <span onclick="UI.toggleConfig()" style="cursor:pointer; font-size: 1.2rem;">⚙️</span>
    </div>

    <div id="configArea" class="config-section">

        <div class="row">
            <select id="profile" onchange="UI.updateProfile()" style="padding:8px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>

            <input type="number" id="userWeight" style="width:50px; padding:5px;" value="92"> kg
        </div>

        <label>
            <input type="checkbox" id="audioToggle" checked>
            Spraakassistent (NL)
        </label>

        <hr>

        <input type="file" id="gpxInput" accept=".gpx" style="width:100%;">
    </div>

    <div class="stat-grid">
        <div>
            <span class="stat-label">Off-Route</span>
            <span id="ui-off-big" class="stat-value">0m</span>
        </div>

        <div>
            <span class="stat-label">KM/U</span>
            <span id="ui-speed-big" class="stat-value">0.0</span>
        </div>

        <div>
            <span class="stat-label">GPS Acc</span>
            <span id="ui-acc-big" class="stat-value">0m</span>
        </div>
    </div>

    <div style="background:#e8f4fd; padding:10px; border-radius:8px; border-left:4px solid var(--accent); margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between;">
            <span class="stat-label">Traject:</span>
            <span id="ui-total-len" style="font-size:0.75rem; font-weight:bold; color:var(--success);">
                Afstand: --
            </span>
        </div>

        <span id="ui-segment" style="font-weight:bold; font-size:0.95rem;">
            Wacht op GPX...
        </span>
    </div>

    <div class="row">
        <button id="startBtn" onclick="APP.handleStartPause()" class="btn-start">▶ START</button>
        <button onclick="UI.toggleTable()" class="btn-blue">📑</button>
        <button id="stopBtn" onclick="APP.stop()" class="btn-red" style="display:none;">⏹ STOP</button>
        <button id="resetBtn" onclick="APP.reset()" class="btn-red" style="display:none;">🔄</button>
    </div>

    <div id="console">

        <div id="standby-msg" style="text-align:center; padding:20px;">
            Laad een GPX bestand om te beginnen.
        </div>

        <div id="live-ui" style="display:none;">

            <div style="display:flex; justify-content:space-between;">
                <span>WP: <span id="ui-next-wp">---</span></span>
                <span id="ui-dist" style="color:var(--accent); font-weight:bold;">0m</span>
            </div>

            <hr>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:0.8rem;">
                <div>TRIP: <span id="ui-trip">0.000 km</span></div>
                <div>ETA: <span id="ui-eta">--:--</span></div>
                <div>MOVE: <span id="ui-mov-time">00:00:00</span></div>
                <div>PAUZE: <span id="ui-pau-time">00:00:00</span></div>
                <div>KCAL: <span id="ui-kcal">0</span></div>
                <div>MET: <span id="ui-met">1.0</span></div>
                <div>AVG KM/U: <span id="ui-avg-speed">0.0</span></div>
                <div><span id="ui-count-label">STAPPEN</span>: <span id="ui-steps">0</span></div>
            </div>

        </div>
    </div>

    <div id="tableCon" style="display:none;">
        <table id="wpList"></table>
    </div>

</div>

<script>
const CORE = {
    settings: {
        wandelen: { ms: 0.36, th: 0.67, radius: 25, label: "STAPPEN" },
        fietsen:  { ms: 5.5, th: 2.10, radius: 40, label: "OMWENTELINGEN" }
    },

    met_table: {
        wandelen: [
            {max: 1.5, met: 1.0},
            {max: 4.0, met: 3.0},
            {max: 5.5, met: 3.5},
            {max: Infinity, met: 4.5}
        ],
        fietsen: [
            {max: 1.5, met: 1.0},
            {max: 15, met: 5.0},
            {max: 20, met: 6.5},
            {max: Infinity, met: 8.0}
        ]
    },

    route: { track: [], waypoints: [], cumDist: [], totalDist: 0 },

    session: {
        isStarted: false,
        isPaused: false,
        finished: false,
        watchId: null,
        tripDist: 0,
        movingTime: 0,
        pauseTime: 0,
        kcal: 0,
        steps: 0,
        lastTick: null,
        currentMet: 1.0
    },

    speech: { queue: [], isSpeaking: false }
};

// ---------------- LOGIC ----------------

const LOGIC = {
    getDist(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = Math.PI / 180;

        const dLat = (lat2 - lat1) * toRad;
        const dLon = (lon2 - lon1) * toRad;

        const a =
            Math.sin(dLat/2)**2 +
            Math.cos(lat1*toRad) * Math.cos(lat2*toRad) *
            Math.sin(dLon/2)**2;

        return 2 * R * Math.asin(Math.sqrt(a));
    }
};

// ---------------- NAV ENGINE ----------------

const NAV = {

    getNearestTrackIndex(lat, lon) {
        let min = Infinity;
        let idx = 0;

        for (let i = 0; i < CORE.route.track.length; i++) {
            const p = CORE.route.track[i];
            const d = LOGIC.getDist(lat, lon, p.lat, p.lon);
            if (d < min) {
                min = d;
                idx = i;
            }
        }

        return { idx, dist: min };
    },

    getRoutePosition(idx) {
        return CORE.route.cumDist[idx] || 0;
    },

    updateWaypoints(posOnRoute) {
        CORE.route.waypoints.forEach(wp => {

            if (wp.passed) return;

            if (posOnRoute >= wp.routePos - 25) {
                wp.passed = true;
                APP.speak(wp.name);
            }
        });
    }
};

// ---------------- UI ----------------

const UI = {
    update(lat=0, lon=0, acc=0, speed=0, offRoute=0, posOnRoute=0) {

        const nextWp = CORE.route.waypoints.find(w => !w.passed);

        const set = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.innerText = val;
        };

        set('ui-total-len', `Track: ${(CORE.route.totalDist/1000).toFixed(2)} km`);
        set('ui-off-big', Math.round(offRoute) + "m");
        set('ui-speed-big', speed.toFixed(1));
        set('ui-acc-big', Math.round(acc) + "m");

        set('ui-next-wp', nextWp ? nextWp.name : "FINISH");

        set('ui-dist',
            nextWp
                ? Math.max(0, Math.round(nextWp.routePos - posOnRoute)) + "m"
                : "0m"
        );
    }
};

// ---------------- APP ----------------

const APP = {

    init() {
        document.getElementById('gpxInput').onchange = e => this.loadGPX(e);
    },

    loadGPX(e) {
        const reader = new FileReader();

        reader.onload = ev => {

            const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
            const pts = [...xml.getElementsByTagName('trkpt')];

            CORE.route.track = pts.map(p => ({
                lat: +p.getAttribute('lat'),
                lon: +p.getAttribute('lon')
            }));

            CORE.route.cumDist = [0];

            for (let i=0;i<CORE.route.track.length-1;i++){
                CORE.route.cumDist[i+1] =
                    CORE.route.cumDist[i] +
                    LOGIC.getDist(
                        CORE.route.track[i].lat,
                        CORE.route.track[i].lon,
                        CORE.route.track[i+1].lat,
                        CORE.route.track[i+1].lon
                    );
            }

            CORE.route.totalDist = CORE.route.cumDist.at(-1);

            CORE.route.waypoints = [
                { name:"Start", routePos:0, passed:false },
                { name:"Midden", routePos:CORE.route.totalDist/2, passed:false },
                { name:"Einde", routePos:CORE.route.totalDist, passed:false }
            ];

            UI.update();

            document.getElementById('standby-msg').style.display='none';
            document.getElementById('live-ui').style.display='block';
        };

        reader.readAsText(e.target.files[0]);
    },

    handleStartPause() {
        CORE.session.watchId = navigator.geolocation.watchPosition(
            p => this.gpsHandler(p),
            e => alert(e.message),
            { enableHighAccuracy:true }
        );
    },

    gpsHandler(pos) {

        const { latitude:lat, longitude:lon, accuracy:acc, speed:s } = pos.coords;
        const speedKmh = (s||0)*3.6;

        const nearest = NAV.getNearestTrackIndex(lat, lon);

        const posOnRoute = NAV.getRoutePosition(nearest.idx);
        const offRoute = nearest.dist;

        NAV.updateWaypoints(posOnRoute);

        UI.update(lat, lon, acc, speedKmh, offRoute, posOnRoute);
    },

    speak(t) {
        if (!t) return;
        CORE.speech.queue.push(t);

        if (CORE.speech.isSpeaking) return;
        this.play();
    },

    play() {
        if (CORE.speech.queue.length === 0) {
            CORE.speech.isSpeaking = false;
            return;
        }

        CORE.speech.isSpeaking = true;

        const u = new SpeechSynthesisUtterance(CORE.speech.queue.shift());
        u.lang = "nl-NL";
        u.onend = () => this.play();

        speechSynthesis.speak(u);
    }
};

APP.init();
</script>
</body>
</html>
