<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strava Engine v25 FINAL HYBRID</title>

<style>
body{font-family:Arial}
.version{color:#666;margin-bottom:10px}
table{border-spacing:3px}
td,th{border:2px double black;padding:6px}

.controls{display:flex;gap:10px;margin:10px 0}
button{flex:1;padding:12px;font-size:16px;border:none;border-radius:6px;color:white}

.startBtn{background:#2ecc71}
.stopBtn{background:#e74c3c}
.pauseBtn{background:#f39c12}
.resumeBtn{background:#2ecc71}
</style>
</head>

<body>

<h1>GPX STRAVA ENGINE v25 FINAL</h1>
<div class="version">v18.1 CORE + PRO METRICS (SAFE HYBRID)</div>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
<button id="startBtn" class="startBtn">▶️ Start</button>
<button id="pauseBtn" class="pauseBtn" disabled>⏸️ Pauze</button>
</div>

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints</h2>
<table>
<thead>
<tr>
<th>Status</th>
<th>Naam</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>

// ================= STATE =================
let track=[];
let waypoints=[];
let simIndex=0;
let simInterval=null;

let maxRoutePos=0;

// ================= PRO METRICS =================
let gpsTrip=0;
let lastLat=null;
let lastLon=null;
let lastTime=null;

let stepHistory=[];
let caloriesTotal=0;

// ================= CONFIG =================
const RADIUS=20;
const TRACK_TOL=10;
const STEP_LENGTH=0.67;
const USER_WEIGHT=92;
const MAX_SPEED=10;

// ================= DIST =================
function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ================= POLYLINE =================
let cumDist=[];

function buildPolyline(){
cumDist=[0];
for(let i=0;i<track.length-1;i++){
cumDist[i+1]=cumDist[i]+dist(
track[i].lat,track[i].lon,
track[i+1].lat,track[i+1].lon
);
}
}

// ================= CORE v18.1 =================
function projectOnRoute(lat,lon){
let bestDist=Infinity;
let bestPos=0;

for(let i=0;i<track.length;i++){
const d=dist(lat,lon,track[i].lat,track[i].lon);
if(d<bestDist){
bestDist=d;
bestPos=cumDist[i];
}
}
return bestPos;
}

// ================= TRACK DIST =================
function pointToSegment(px,py,ax,ay,bx,by){
const A=px-ax,B=py-ay,C=bx-ax,D=by-ay;
const dot=A*C+B*D;
const len=C*C+D*D;

let t=len===0?0:dot/len;
t=Math.max(0,Math.min(1,t));

const x=ax+t*C;
const y=ay+t*D;

return dist(px,py,x,y);
}

function minDistToTrack(lat,lon){
let best=Infinity;
for(let i=0;i<track.length-1;i++){
const d=pointToSegment(lat,lon,track[i].lat,track[i].lon,track[i+1].lat,track[i+1].lon);
if(d<best) best=d;
}
return best;
}

// ================= LOAD =================
document.getElementById('gpxFile').onchange=e=>{
const r=new FileReader();

r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

track=[...xml.getElementsByTagName('trkpt')]
.map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));

buildPolyline();

// RESET
maxRoutePos=0;
gpsTrip=0;
stepHistory=[];
caloriesTotal=0;
lastLat=null;
lastLon=null;
lastTime=null;

// ================= WAYPOINTS (v18.1 CORE) =================
const w=[...xml.getElementsByTagName('wpt')];

waypoints=w.map(x=>({
name:x.getElementsByTagName('name')[0]?.textContent||"WP",
lat:+x.getAttribute('lat'),
lon:+x.getAttribute('lon'),
routePos:0,
passed:false,
missed:false
}));

// START + END
waypoints.unshift({
name:"Start",
lat:track[0].lat,
lon:track[0].lon,
routePos:0,
passed:true,
missed:false
});

waypoints.push({
name:"Einde",
lat:track.at(-1).lat,
lon:track.at(-1).lon,
routePos:0,
passed:false,
missed:false
});

// SORT (CRITICAL CORE RULE)
waypoints.forEach(w=>{
w.routePos=projectOnRoute(w.lat,w.lon);
});
waypoints.sort((a,b)=>a.routePos-b.routePos);

render();
};

r.readAsText(e.target.files[0]);
};

// ================= CORE ENGINE (v18.1 UNTOUCHED + SAFE EXTENSIONS) =================
function process(lat,lon){

const pos=projectOnRoute(lat,lon);

// CORE PROGRESS
if(pos>maxRoutePos){
maxRoutePos=pos;
}

for(let w of waypoints){

if(w.passed || w.missed) continue;

// ================= GEO LAYER =================
const onTrack=minDistToTrack(w.lat,w.lon)<=TRACK_TOL;

if(!onTrack){
w.missed=true;
continue;
}

// ================= PASS LAYER =================
if(pos>=w.routePos-RADIUS){
w.passed=true;
continue;
}

// ================= MISS LAYER =================
if(maxRoutePos>w.routePos+RADIUS){
w.missed=true;
}
}
}

// ================= SIM =================
function startSim(){
if(simInterval) return;

simIndex=0;
maxRoutePos=0;

simInterval=setInterval(()=>{

if(simIndex>=track.length){
clearInterval(simInterval);
return;
}

const p=track[simIndex++];
process(p.lat,p.lon);

// ================= PRO METRICS =================
const now=Date.now();
let speed=0;

if(lastLat){
speed=Math.min(dist(lastLat,lastLon,p.lat,p.lon)*3.6,MAX_SPEED);
gpsTrip+=dist(lastLat,lastLon,p.lat,p.lon);
}

const steps=gpsTrip/STEP_LENGTH;

stepHistory.push({t:now/1000,s:steps});
stepHistory=stepHistory.filter(x=>(now/1000-x.t)<=60);

let cadence=0;
if(stepHistory.length>1){
const f=stepHistory[0];
const l=stepHistory[stepHistory.length-1];
const dt=(l.t-f.t)/60;
const ds=l.s-f.s;
cadence=dt>0?ds/dt:0;
}

if(lastTime){
const dtSec=(now-lastTime)/1000;
if(dtSec>0 && dtSec<10){
caloriesTotal+=(speed/3.6)*USER_WEIGHT*0.9*(dtSec/3600);
}
}

lastTime=now;
lastLat=p.lat;
lastLon=p.lon;

// ================= UI =================
document.getElementById('info').innerHTML=`
📍 ${p.lat.toFixed(6)}, ${p.lon.toFixed(6)}<br>
🧭 ${(gpsTrip/1000).toFixed(3)} km<br>
👣 ${Math.round(steps)} steps<br>
🚶 ${Math.round(cadence)} spm<br>
🔥 ${caloriesTotal.toFixed(0)} kcal
`;

render();

},120);
}

// ================= RENDER =================
function render(){
const l=document.getElementById('list');
l.innerHTML="";

waypoints.forEach(w=>{
let s="⏳";
if(w.passed) s="✅";
else if(w.missed) s="❌";

l.innerHTML+=`
<tr>
<td>${s}</td>
<td>${w.name}</td>
</tr>`;
});
}

// ================= BUTTON =================
document.getElementById('startBtn').onclick=()=>{
startSim();
};

</script>

</body>
</html>
