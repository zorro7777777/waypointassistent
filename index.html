<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO v92</title>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #info { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; margin: 10px 0; min-height: 520px; line-height: 1.3; border-left: 5px solid #27ae60; font-size: 1.1rem; position: relative; }
        .gear-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; cursor: pointer; opacity: 0.7; z-index: 10; }
        .highlight { color: #fff; font-weight: bold; font-size: 1.3rem; }
        .field-yellow { color: #ffff00; font-weight: bold; font-size: 0.95rem; display: block; margin-top: 2px; }
        .field-green { color: #00ff00; font-weight: bold; }
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #dcdde1; display: none; }
        .row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .start { background: #27ae60; flex: 2; } 
        .pause { background: #f39c12; flex: 2; } 
        .toggle-list { background: #3498db; flex: 0.4; }
        #resetBtn { background: #e74c3c; flex: 0.4; display: none; }
        .copy-btn { background: #34495e; padding: 8px; font-size: 0.75rem; margin-top: 10px; border: 1px solid #5d6d7e; width: 100%; color: #bdc3c7; }
        #gpxInput { width:100%; margin-bottom:10px; border:1px solid #ccc; padding:5px; border-radius:5px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        td { padding: 8px 0; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.1rem; margin:0 0 5px 0; color:#2c3e50;">WAYPOINTASSISTENT PRO</h1>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:4px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <div style="font-size: 0.8rem;">Gewicht: <input type="number" id="userWeight" style="width:40px" value="92">kg</div>
        </div>
        <label><input type="checkbox" id="audioToggle" checked> 🔊 Spraak inschakelen</label>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    
    <div class="row">
        <button onclick="handleStartPause()" id="startBtn" class="start">▶ START</button>
        <button onclick="toggleTable()" class="toggle-list">📑</button>
        <button onclick="location.reload()" id="resetBtn">🔄</button>
    </div>
    
    <div id="info">
        <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
        <div id="display-content">Systeem gereed. Upload GPX.</div>
    </div>

    <div id="tableCon" style="display:none;">
        <div style="font-size:0.75rem; font-weight:bold; padding:8px; background:#dfe6e9; border-radius:5px; text-align:center;" id="wp-summary">Geen route</div>
        <table><tbody id="list"></tbody></table>
    </div>
</div>

<script>
const PROFS = {
    wandelen: { ms: 0.5, max: 7, th: 0.67, radius: 12, unit: "Stappen" },
    fietsen:  { ms: 1.95, max: 45, th: 2.10, radius: 25, unit: "Omwentelingen" }
};

let CONFIG = { ...PROFS.wandelen };
let track = [], waypoints = [], cumDist = [];
let watchId = null, lastPos = null, maxRoutePos = 0, tripDist = 0, finished = false;
let sport = { steps: 0, kcal: 0, movingTime: 0, idleTime: 0, lastTick: null };
let alertTime = 0, isOffRoute = false, isPaused = false;
let lastEtaUpdate = 0, cachedArrival = "--:--", lastTrackIndex = 0;
let smoothLat = null, smoothLon = null;
const SMOOTHING_FACTOR = 0.35, ACCURACY_LIMIT = 25;
let speechQueue = [], isSpeaking = false;

function speak(text) {
    if (!document.getElementById('audioToggle')?.checked) return;
    speechQueue.push(String(text).replaceAll("START", "Startpunt").replaceAll("FINISH", "De Finish"));
    processQueue();
}

function processQueue() {
    if (isSpeaking || speechQueue.length === 0) return;
    isSpeaking = true;
    const msg = new SpeechSynthesisUtterance(speechQueue.shift());
    msg.lang = 'nl-NL'; msg.rate = 0.95;
    msg.onend = () => setTimeout(() => { isSpeaking = false; processQueue(); }, 1200);
    window.speechSynthesis.speak(msg);
}

function fmtT(s) {
    if (!Number.isFinite(s) || s < 0) return "00:00:00";
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = Math.floor(s % 60);
    return String(h).padStart(2,'0')+":"+String(m).padStart(2,'0')+":"+String(sec).padStart(2,'0');
}

function getDist(a, b, c, d) {
    const R = 6371000;
    const dLat = (c - a) * Math.PI / 180, dLon = (d - b) * Math.PI / 180;
    const x = Math.sin(dLat / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
}

// v90 GEOMETRY ENGINE 
function getRInfo(pLat, pLon) {
    let minD = Infinity, bestP = 0, bestIdx = 0;
    let start = Math.max(0, lastTrackIndex - 10), end = Math.min(track.length - 1, lastTrackIndex + 50);
    for (let i = start; i < end; i++) {
        const A = track[i], B = track[i+1];
        const res = projectOnSegment(pLat, pLon, A, B);
        if (res.d < minD) { minD = res.d; bestP = cumDist[i] + res.projDist; bestIdx = i; }
    }
    lastTrackIndex = bestIdx;
    return { off: minD, pos: bestP };
}

function projectOnSegment(pLat, pLon, A, B) {
    const L2 = Math.pow(getDist(A.lat, A.lon, B.lat, B.lon), 2);
    if (L2 === 0) return { d: getDist(pLat, pLon, A.lat, A.lon), projDist: 0 };
    let t = ((pLat - A.lat) * (B.lat - A.lat) + (pLon - A.lon) * (B.lon - A.lon)) / L2;
    t = Math.max(0, Math.min(1, t));
    const pL = A.lat + t * (B.lat - A.lat), pO = A.lon + t * (B.lon - A.lon);
    return { d: getDist(pLat, pLon, pL, pO), projDist: t * Math.sqrt(L2) };
}

document.getElementById('gpxInput').onchange = e => {
    const file = e.target.files?.[0]; if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        const pts = [...xml.getElementsByTagName('trkpt')];
        track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        
        cumDist = [0];
        for (let i = 1; i < track.length; i++) {
            cumDist[i] = cumDist[i-1] + getDist(track[i-1].lat, track[i-1].lon, track[i].lat, track[i].lon);
        }

        // Haal waypoints op
        let rawWpts = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "Punt",
            lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'),
            passed: false, missed: false, touched: false
        }));

        // Wijs elk waypoint toe aan de routepositie
        waypoints = rawWpts.map(w => {
            const res = getRInfo(w.lat, w.lon);
            return { ...w, routePos: res.pos };
        });

        // SORTEER: Eerst op routePos, maar dwing START en FINISH
        waypoints.sort((a, b) => a.routePos - b.routePos);

        // Voeg START en FINISH handmatig toe op de juiste plek als ze er nog niet zijn
        if (!waypoints.find(w => w.name === "START")) {
            waypoints.unshift({ name: "START", lat: track[0].lat, lon: track[0].lon, routePos: 0, passed: false, missed: false, touched: false });
        }
        if (!waypoints.find(w => w.name === "FINISH")) {
            waypoints.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, routePos: cumDist.at(-1), passed: false, missed: false, touched: false });
        }

        // Extra check: zorg dat de lijst uniek blijft en de FINISH altijd onderaan staat
        waypoints = waypoints.filter((v, i, a) => a.findIndex(t => t.name === v.name) === i);
        waypoints.sort((a, b) => a.routePos - b.routePos);

        maxRoutePos = 0; lastTrackIndex = 0; lastPos = null;
        updateWPUI();
        speak(`Route geladen. ${waypoints.length} punten over ${(cumDist.at(-1)/1000).toFixed(1)} kilometer.`);
        document.getElementById('display-content').innerText = "Klik op START.";
    };
    r.readAsText(file);
};

function updateWPUI() {
    const p = waypoints.filter(w => w.passed).length, m = waypoints.filter(w => w.missed).length;
    document.getElementById('wp-summary').innerText = `✅ ${p} | ❌ ${m} | ⏳ ${waypoints.length - p - m}`;
    document.getElementById('list').innerHTML = waypoints.map(w => `<tr style="${w.passed ? 'color:#27ae60;font-weight:bold;' : (w.missed ? 'color:#e74c3c;text-decoration:line-through;' : '')}"><td style="width:25px">${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td><td>${w.name}</td><td style="text-align:right">${Math.round(w.routePos)}m</td></tr>`).join('');
}

function handleStartPause() {
    const btn = document.getElementById('startBtn');
    if (!watchId) {
        startGPS(); btn.innerText = "⏸ PAUZE"; btn.className = "pause";
        speak("Systeem actief.");
    } else {
        isPaused = !isPaused;
        btn.innerText = isPaused ? "▶ HERVAT" : "⏸ PAUZE";
        btn.className = isPaused ? "start" : "pause";
        sport.lastTick = isPaused ? null : Date.now();
        speak(isPaused ? "Pauze." : "Hervatting.");
    }
}

function startGPS() {
    if (watchId || !track.length) return;
    document.getElementById('gpxInput').style.display = 'none';
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});

    watchId = navigator.geolocation.watchPosition(p => {
        if (finished || isPaused) return;
        const { latitude: rLat, longitude: rLon, accuracy: acc, speed: s } = p.coords;
        const now = Date.now(), dt = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;
        if (acc > ACCURACY_LIMIT) return;

        if (smoothLat === null) { smoothLat = rLat; smoothLon = rLon; } else {
            const jump = getDist(smoothLat, smoothLon, rLat, rLon);
            if (dt > 0 && (jump / dt) > 15) return;
            smoothLat = rLat * SMOOTHING_FACTOR + smoothLat * (1 - SMOOTHING_FACTOR);
            smoothLon = rLon * SMOOTHING_FACTOR + smoothLon * (1 - SMOOTHING_FACTOR);
        }

        const R = getRInfo(smoothLat, smoothLon);
        if (R.pos > maxRoutePos) maxRoutePos = R.pos;

        // Off-route check
        if (R.off > 45 && now - alertTime > 25000) {
            speak(`Je bent ${Math.round(R.off)} meter van de route.`);
            alertTime = now; isOffRoute = true;
        } else if (isOffRoute && R.off < 10) {
            speak("Terug op de route."); isOffRoute = false;
        }

        const skmh = (s && s > 0.2) ? s * 3.6 : (lastPos && dt > 0 ? (getDist(lastPos.lat, lastPos.lon, smoothLat, smoothLon)/dt)*3.6 : 0);
        const isM = skmh >= (CONFIG.ms * 3.6) && skmh <= CONFIG.max;
        const weight = parseFloat(document.getElementById('userWeight').value) || 92;
        const metVal = document.getElementById('profile').value === 'wandelen' ? (0.75 * skmh + 0.5) : (0.4 * skmh);

        if (lastPos && dt > 0) {
            const d = getDist(lastPos.lat, lastPos.lon, smoothLat, smoothLon);
            if (d > 0.6 && d < 35) tripDist += d;
        }
        lastPos = { lat: smoothLat, lon: smoothLon };

        if (isM) {
            sport.movingTime += dt;
            sport.steps += ((skmh / 3.6) * dt) / CONFIG.th;
            sport.kcal += (metVal * 3.5 * weight / 200) * (dt / 60);
        } else if (dt > 0) sport.idleTime += dt;

        // Waypoints loop
        waypoints.forEach((w, i) => {
            if (w.passed || w.missed) return;
            const d = getDist(smoothLat, smoothLon, w.lat, w.lon);
            const dynRad = Math.max(CONFIG.radius, Math.min(CONFIG.radius * 2.5, acc * 1.2));
            if (d <= dynRad) w.touched = true;
            if (w.touched && R.pos >= w.routePos - CONFIG.radius) {
                w.passed = true;
                if (i === waypoints.length - 1) {
                    finished = true; speak("Bestemming bereikt."); navigator.geolocation.clearWatch(watchId);
                } else {
                    speak(w.name);
                    const nxt = waypoints.find(nw => !nw.passed && !nw.missed);
                    if (nxt) speak("Volgend punt " + nxt.name);
                }
                updateWPUI();
            } else if (maxRoutePos > w.routePos + CONFIG.radius + acc + 12 && d > dynRad) {
                w.missed = true; speak("Waypoint gemist " + w.name); updateWPUI();
            }
        });

        const next = waypoints.find(w => !w.passed && !w.missed);
        const avgV = R.pos > 20 ? (R.pos / 1000) / (sport.movingTime / 3600) : 0;
        if (now - lastEtaUpdate > 60000 || cachedArrival === "--:--") {
            const rem = cumDist.at(-1) - R.pos;
            if (avgV > 0.5) {
                const arr = new Date(now + (rem / (avgV / 3.6)) * 1000);
                cachedArrival = arr.getHours().toString().padStart(2,'0') + ":" + arr.getMinutes().toString().padStart(2,'0');
            }
            lastEtaUpdate = now;
        }

        // --- DASHBOARD UI UPDATE ---
        const cadans = Math.round(isM ? ((skmh/3.6)/CONFIG.th*60) : 0);
        document.getElementById('display-content').innerHTML = `
            <b style="color:#ffff00">VOLGEND:</b><br>
            <span class="highlight" style="color:#00ff00;">${finished ? 'FINISH' : (next ? next.name : '---')}</span><br>
            <b>AFSTAND:</b> <span class="highlight">${(next && !finished) ? Math.max(0, Math.round(next.routePos - R.pos)) : 0}m</span><br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>${CONFIG.unit.toUpperCase()}:</b> <span class="field-green">${Math.round(sport.steps)}</span><br>
            <b>CADANS:</b> <span class="field-green">${cadans}</span><br>
            <b>TRIP:</b> <span class="field-green">${(tripDist/1000).toFixed(3)} km</span><br>
            <b>BEWOGEN TIJD:</b> <span class="field-green">${fmtT(sport.movingTime)}</span><br>
            <b>PAUZE TIJD:</b> <span class="field-green">${fmtT(sport.idleTime)}</span><br>
            <b>AANKOMST:</b> <span class="field-green">${finished ? 'BEREIKT' : cachedArrival}</span><br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>SPEED:</b> ${skmh.toFixed(1)} km/u<br>
            <b>AVG SPEED:</b> ${avgV.toFixed(2)} km/u<br>
            <b>ENERGIE:</b> ${Math.round(sport.kcal)} kcal<br>
            <b>POWER:</b> ${metVal.toFixed(1)} MET<br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>OFF-TRACK:</b> <span style="color:${R.off > 50 ? '#e74c3c' : '#00ff00'}">${Math.round(R.off)}m</span><br>
            <b>ACCURACY:</b> ${acc.toFixed(0)}m<br>
            <span class="field-yellow">LAT: ${smoothLat.toFixed(6)}</span>
            <span class="field-yellow">LON: ${smoothLon.toFixed(6)}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${smoothLat.toFixed(6)},${smoothLon.toFixed(6)}')">📍 KOPIEER COÖRDINATEN</button>
        `;
        sport.lastTick = now;
    }, err => console.error(err), { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
}

function toggleTable() { 
    const el = document.getElementById('tableCon');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
}
function updateProfile() { 
    const val = document.getElementById('profile').value;
    CONFIG = { ...PROFS[val] };
    speak(`Profiel ingesteld op ${val}.`);
}
</script>
</body>
</html>
