<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO - V3.8</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #info { 
            background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; 
            font-family: 'Cascadia Code', monospace; margin: 10px 0; 
            min-height: 580px; line-height: 1.5; border-left: 5px solid #27ae60; position: relative;
        }
        .gear-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; cursor: pointer; z-index: 10; padding: 5px; }
        .highlight { color: #fff; font-weight: bold; font-size: 1.2rem; }
        .field-green { color: #00ff00; font-weight: bold; }
        .dashboard-label { color: #aaa; font-size: 0.75rem; text-transform: uppercase; display: block; margin-top: 4px; }
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        button { padding: 14px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .start { background: #27ae60; flex: 2; } 
        .copy-btn { background: #34495e; padding: 8px; font-size: 0.75rem; margin-top: 10px; width: 100%; border-radius: 5px; color: #bdc3c7; }
        #gpxInput { width:100%; margin-bottom:10px; border:2px dashed #ccc; padding:15px; border-radius:8px; box-sizing: border-box; }
        hr { border: 0; border-top: 1px solid #333; margin: 10px 0; }
        #tableCon { margin-top: 15px; background: white; border-radius: 8px; padding: 10px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        td { padding: 8px 4px; border-bottom: 1px solid #eee; }
        .stat-bar { display: flex; justify-content: space-around; padding: 10px; background: #2d3436; color: white; border-radius: 5px; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.1rem; margin:0 0 10px 0;">WAYPOINTASSISTENT PRO V3.8</h1>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:8px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <input type="number" id="userWeight" style="width:55px;" value="92"> kg
        </div>
        <label><input type="checkbox" id="audioToggle" checked> 🔊 Spraak Actief</label>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    
    <div class="row">
        <button onclick="handleStartPause()" id="startBtn" class="start">▶ START</button>
        <button onclick="toggleTable()" style="background:#3498db; flex:0.4;">📑</button>
        <button onclick="location.reload()" id="resetBtn" style="background:#e74c3c; display:none; flex:0.4;">🔄</button>
    </div>
    
    <div id="info">
        <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
        <div id="standby-msg" style="text-align:center; padding-top:150px; color:#888;"><b>WACHT OP GPX...</b></div>

        <div id="live-ui" style="display:none; padding:5px;">
            <span class="dashboard-label">Bestemming:</span>
            <span id="ui-next-wp" class="highlight">---</span>
            <span class="dashboard-label">Afstand:</span>
            <span id="ui-dist" class="highlight">0m</span>
            <hr>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div><span class="dashboard-label">Trip:</span><span id="ui-trip" class="field-green">0.000 km</span></div>
                <div><span class="dashboard-label" id="ui-unit-label">Stappen:</span><span id="ui-steps" class="field-green">0</span></div>
                <div><span class="dashboard-label">Bewogen:</span><span id="ui-mov-time" class="field-green">00:00:00</span></div>
                <div><span class="dashboard-label">Snelheid:</span><span class="field-green"><span id="ui-speed">0.0</span> km/u</span></div>
            </div>
            <hr>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <div><span class="dashboard-label">Belasting:</span><span id="ui-power" class="field-green">0.0</span> <small>MET</small></div>
                <div><span class="dashboard-label">Verbruik:</span><span id="ui-kcal" class="field-green">0</span> <small>kcal</small></div>
            </div>
            <hr>
            <span class="dashboard-label">Route Info:</span>
            Totaal: <span id="ui-track-len" style="color:#fff;">0.00 km</span> | Off-track: <span id="ui-off" style="color:#e74c3c;">0m</span>
            
            <hr>
            <span class="dashboard-label">GPS STATUS (Acc: <span id="ui-acc">0m</span>):</span>
            <div style="color: #3498db; font-size: 0.85rem;">
                Lat: <span id="ui-lat">0.000000</span><br>
                Lon: <span id="ui-lon">0.000000</span>
            </div>
            <button class="copy-btn" onclick="copyCoords()">📍 KOPIEER COÖRDINATEN</button>
        </div>
    </div>

    <div id="tableCon" style="display:none;">
        <div class="stat-bar" id="statBar">
            <span style="color:#2ecc71">✅ 0</span>
            <span style="color:#e74c3c">❌ 0</span>
            <span style="color:#3498db">⏳ 0</span>
        </div>
        <table><tbody id="list"></tbody></table>
    </div>
</div>

<script>
const PROFS = {
    wandelen: { radius: 12, th: 0.72, unit: "Stappen", minJump: 2.0 },
    fietsen:  { radius: 25, th: 2.10, unit: "Cadans", minJump: 4.0 }
};

let CONFIG = { ...PROFS.wandelen };
let track = [], waypoints = [], cumDist = [];
let watchId = null, maxRoutePos = 0, tripDist = 0;
let sport = { steps: 0, movingTime: 0, lastTick: null, kcal: 0 };
let isPaused = false, lastTrackIndex = 0, lastAnnouncedWp = -1;
let smoothLat = null, smoothLon = null;

function fmtT(s) {
    const h = Math.floor(s / 3600).toString().padStart(2, '0');
    const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${h}:${m}:${sec}`;
}

function getDist(a, b, c, d) {
    const R = 6371000;
    const rL = (c - a) * Math.PI / 180;
    const rO = (d - b) * Math.PI / 180;
    const x = Math.sin(rL / 2) ** 2 + Math.cos(a * Math.PI / 180) * Math.cos(c * Math.PI / 180) * Math.sin(rO / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(x));
}

function getRInfo(lat, lon) {
    let bD = Infinity, bP = 0, bestIdx = 0;
    let start = Math.max(0, lastTrackIndex - 100), end = Math.min(track.length, lastTrackIndex + 200);
    for (let i = start; i < end; i++) {
        const d = getDist(lat, lon, track[i].lat, track[i].lon);
        if (d < bD) { bD = d; bP = cumDist[i]; bestIdx = i; }
    }
    lastTrackIndex = bestIdx;
    return { pos: bP, off: bD };
}

function speak(text) {
    if (!document.getElementById('audioToggle').checked) return;
    const msg = new SpeechSynthesisUtterance(text.replace("START", "Startpunt").replace("FINISH", "De Finish"));
    msg.lang = 'nl-NL';
    window.speechSynthesis.speak(msg);
}

document.getElementById('gpxInput').onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        const pts = [...xml.getElementsByTagName('trkpt')];
        track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        cumDist = [0];
        for(let i=0; i<track.length-1; i++) cumDist[i+1] = cumDist[i] + getDist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
        
        waypoints = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "Punt",
            lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'),
            passed: false, missed: false, routePos: 0, touched: false
        }));
        
        waypoints.push({ name: "START", lat: track[0].lat, lon: track[0].lon, passed: false });
        waypoints.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, passed: false });

        waypoints.forEach(w => {
            let bD = Infinity, bP = 0;
            track.forEach((t, i) => { 
                const d = getDist(w.lat, w.lon, t.lat, t.lon); 
                if(d < bD) { bD = d; bP = cumDist[i]; } 
            });
            w.routePos = bP;
        });
        waypoints.sort((a,b) => a.routePos - b.routePos);
        
        const totalLen = (cumDist.at(-1)/1000).toFixed(2);
        document.getElementById('ui-track-len').innerText = totalLen + " km";
        document.getElementById('standby-msg').innerHTML = `<b style="color:#27ae60">GPX KLAAR</b><br>${totalLen} km<br>Druk op START`;
        updateTable();
        speak("Route geladen.");
    };
    reader.readAsText(e.target.files[0]);
};

function handleStartPause() {
    if (!track.length) return alert("Upload GPX!");
    if (!watchId) {
        startGPS();
        document.getElementById('startBtn').innerText = "⏸ PAUZE";
        document.getElementById('live-ui').style.display = 'block';
        document.getElementById('standby-msg').style.display = 'none';
        speak("Systeem gestart.");
    } else {
        isPaused = !isPaused;
        document.getElementById('startBtn').innerText = isPaused ? "▶ HERVAT" : "⏸ PAUZE";
    }
}

function startGPS() {
    watchId = navigator.geolocation.watchPosition(p => {
        if (isPaused) return;
        const { latitude: rLat, longitude: rLon, accuracy: acc, speed: s } = p.coords;
        const now = Date.now();
        const dt = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;
        const weight = parseFloat(document.getElementById('userWeight').value) || 92;

        document.getElementById('ui-lat').innerText = rLat.toFixed(6);
        document.getElementById('ui-lon').innerText = rLon.toFixed(6);
        document.getElementById('ui-acc').innerText = Math.round(acc) + "m";

        if (acc > 25) return;

        let curKmh = (s && s > 0.4) ? s * 3.6 : 0;

        if (smoothLat !== null) {
            const jump = getDist(smoothLat, smoothLon, rLat, rLon);
            if (jump > CONFIG.minJump && curKmh > 1.2) {
                tripDist += jump;
                sport.movingTime += dt;
                sport.steps += (jump / CONFIG.th);
                // Calorieën: MET * gewicht * tijd(uur)
                let met = (document.getElementById('profile').value === 'wandelen') ? (0.75 * curKmh + 0.5) : (0.4 * curKmh);
                sport.kcal += (met * weight * (dt / 3600));
                
                smoothLat = rLat; smoothLon = rLon;
            } else if (dt > 0) {
                curKmh = 0;
            }
        } else { smoothLat = rLat; smoothLon = rLon; }

        const R = getRInfo(rLat, rLon);
        if (R.pos > maxRoutePos) maxRoutePos = R.pos;

        waypoints.forEach(w => {
            if (w.passed || w.missed) return;
            const d = getDist(rLat, rLon, w.lat, w.lon);
            if (d < CONFIG.radius) w.touched = true;
            if (d < 10 || (R.pos >= w.routePos && w.touched)) {
                w.passed = true;
                speak(w.name);
                updateTable();
            } else if (maxRoutePos > w.routePos + 60) {
                w.missed = true;
                updateTable();
            }
        });

        const nextIdx = waypoints.findIndex(w => !w.passed && !w.missed);
        if (nextIdx !== -1 && nextIdx !== lastAnnouncedWp) {
            speak("Volgend punt: " + waypoints[nextIdx].name);
            lastAnnouncedWp = nextIdx;
        }

        const next = waypoints[nextIdx];
        const avgS = sport.movingTime > 5 ? (tripDist/1000) / (sport.movingTime/3600) : 0;
        const metDisplay = curKmh > 1.2 ? ((document.getElementById('profile').value === 'wandelen') ? (0.75 * curKmh + 0.5) : (0.4 * curKmh)) : 0;

        document.getElementById('ui-next-wp').innerText = next ? next.name : "FINISH";
        document.getElementById('ui-dist').innerText = next ? Math.round(next.routePos - R.pos) + "m" : "0m";
        document.getElementById('ui-trip').innerText = (tripDist/1000).toFixed(3) + " km";
        document.getElementById('ui-steps').innerText = Math.round(sport.steps);
        document.getElementById('ui-mov-time').innerText = fmtT(sport.movingTime);
        document.getElementById('ui-speed').innerText = curKmh.toFixed(1);
        document.getElementById('ui-avg-speed').innerText = avgS.toFixed(1);
        document.getElementById('ui-power').innerText = metDisplay.toFixed(1);
        document.getElementById('ui-kcal').innerText = Math.round(sport.kcal);
        document.getElementById('ui-off').innerText = Math.round(R.off) + "m";

        sport.lastTick = now;
    }, null, { enableHighAccuracy: true });
}

function updateTable() {
    const p = waypoints.filter(w => w.passed).length;
    const m = waypoints.filter(w => w.missed).length;
    const t = waypoints.length - p - m;
    
    document.getElementById('statBar').innerHTML = `
        <span style="color:#2ecc71">✅ ${p}</span>
        <span style="color:#e74c3c">❌ ${m}</span>
        <span style="color:#3498db">⏳ ${t}</span>
    `;

    document.getElementById('list').innerHTML = waypoints.map(w => `
        <tr style="color: ${w.passed ? '#27ae60' : (w.missed ? '#e74c3c' : '#2c3e50')}">
            <td>${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td>
            <td>${w.name}</td>
            <td style="text-align:right">${(w.routePos/1000).toFixed(2)} km</td>
        </tr>`).join('');
}

function toggleTable() { 
    const el = document.getElementById('tableCon');
    el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function toggleConfig() { 
    const el = document.getElementById('configArea');
    const rb = document.getElementById('resetBtn');
    const isV = el.style.display === 'block';
    el.style.display = isV ? 'none' : 'block';
    rb.style.display = isV ? 'none' : 'block';
}

function updateProfile() { 
    CONFIG = { ...PROFS[document.getElementById('profile').value] }; 
    document.getElementById('ui-unit-label').innerText = CONFIG.unit + ":"; 
}

function copyCoords() {
    const lat = document.getElementById('ui-lat').innerText;
    const lon = document.getElementById('ui-lon').innerText;
    navigator.clipboard.writeText(`${lat}, ${lon}`).then(() => alert("Gekopieerd: " + lat + ", " + lon));
}
</script>
</body>
</html>
