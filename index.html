<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAYPOINTASSISTENT PRO - V5</title>

<style>
:root {
    --bg-dark: #1a1a1a;
    --accent: #00bfff;
    --success: #27ae60;
    --warning: #f39c12;
    --danger: #e74c3c;
}
body { font-family: system-ui; margin:0; background:#f0f3f5; }
.card { max-width:500px; margin:auto; padding:12px; background:white; border-radius:15px; }
.stat-grid { display:grid; grid-template-columns:repeat(3,1fr); text-align:center; }
.stat-value { font-size:1.8rem; font-weight:900; color:var(--accent); }
#console { background:var(--bg-dark); color:#0f0; padding:10px; border-radius:10px; }
button { padding:10px; border:none; border-radius:8px; color:white; }
.btn-start{ background:var(--success);}
.btn-blue{ background:var(--accent);}
.btn-red{ background:var(--danger);}
.strikethrough{ text-decoration:line-through; color:var(--danger);}
</style>
</head>

<body>
<div class="card">

<h3>WAYPOINTASSISTENT PRO V5</h3>

<input type="file" id="gpxInput">

<div class="stat-grid">
<div><div>OFF</div><div id="ui-off" class="stat-value">0m</div></div>
<div><div>KM/U</div><div id="ui-speed" class="stat-value">0</div></div>
<div><div>ACC</div><div id="ui-acc" class="stat-value">0m</div></div>
</div>

<button id="startBtn" class="btn-start">START</button>

<div id="console">
<div id="ui-next">---</div>
<div id="ui-dist">0m</div>
<div id="ui-trip">0 km</div>
<div id="ui-time">00:00:00</div>
<div id="ui-kcal">0 kcal</div>
</div>

<table id="wpList"></table>

</div>

<script>
const TO_RAD = Math.PI/180;

const CORE = {
settings:{
    wandelen:{th:0.67, radius:20},
    fietsen:{th:2.1, radius:35}
},
route:{track:[], cumDist:[], totalDist:0, waypoints:[]},
session:{
    watchId:null, lastPos:null, lastTick:null,
    trip:0, time:0, kcal:0,
    lastIdx:0, off:false, lastSpeak:0
},
speech:{queue:[], speaking:false, lastMsg:"", lastTime:0}
};

const LOGIC = {

dist(a,b,c,d){
    const dLat=(c-a)*TO_RAD, dLon=(d-b)*TO_RAD;
    const x=Math.sin(dLat/2)**2 + Math.cos(a*TO_RAD)*Math.cos(c*TO_RAD)*Math.sin(dLon/2)**2;
    return 6371000*2*Math.asin(Math.sqrt(x));
},

getRouteInfo(lat,lon){
    let best=Infinity,pos=0,idx=0;

    const s=Math.max(0,CORE.session.lastIdx-50);
    const e=Math.min(CORE.route.track.length,CORE.session.lastIdx+150);

    for(let i=s;i<e;i++){
        const t=CORE.route.track[i];
        if(!t) continue;

        const d=this.dist(lat,lon,t.lat,t.lon);
        if(!isFinite(d)) continue;

        if(d<best){
            best=d;
            pos=CORE.route.cumDist[i];
            idx=i;
        }
    }

    CORE.session.lastIdx=idx;

    return {off:isFinite(best)?best:0,pos};
}

};

const UI = {
update(lat,lon,acc,speed,R){

    document.getElementById('ui-off').innerText=Math.round(R.off)+"m";
    document.getElementById('ui-speed').innerText=speed.toFixed(1);
    document.getElementById('ui-acc').innerText=Math.round(acc)+"m";

    document.getElementById('ui-trip').innerText=(CORE.session.trip/1000).toFixed(2)+" km";
    document.getElementById('ui-time').innerText=new Date(CORE.session.time*1000).toISOString().substr(11,8);

    const next=CORE.route.waypoints.find(w=>!w.passed);

    document.getElementById('ui-next').innerText=next?next.name:"FINISH";
    document.getElementById('ui-dist').innerText=next?Math.round(next.routePos-R.pos)+"m":"0m";
},

table(){
    document.getElementById('wpList').innerHTML=CORE.route.waypoints.map(w=>`
    <tr class="${w.missed?'strikethrough':''}">
        <td>${w.passed?'✅':(w.missed?'❌':'⏳')}</td>
        <td>${w.name}</td>
        <td>${(w.routePos/1000).toFixed(2)}km</td>
    </tr>`).join('');
}
};

const APP = {

init(){
document.getElementById('gpxInput').onchange=e=>this.load(e);
document.getElementById('startBtn').onclick=()=>this.start();
},

load(e){

const r=new FileReader();
r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

const pts=[...xml.getElementsByTagName('trkpt')];

CORE.route.track=pts.map(p=>({
    lat:+p.getAttribute('lat'),
    lon:+p.getAttribute('lon')
}));

CORE.route.cumDist=[0];
for(let i=0;i<CORE.route.track.length-1;i++){
    CORE.route.cumDist[i+1]=CORE.route.cumDist[i]+
        LOGIC.dist(
            CORE.route.track[i].lat,
            CORE.route.track[i].lon,
            CORE.route.track[i+1].lat,
            CORE.route.track[i+1].lon
        );
}
CORE.route.totalDist=CORE.route.cumDist.at(-1);

// WAYPOINTS
let wpts=[...xml.getElementsByTagName('wpt')].map(w=>{
    const lat=+w.getAttribute('lat'), lon=+w.getAttribute('lon');

    let bD=Infinity,bP=0;
    CORE.route.track.forEach((t,i)=>{
        const d=LOGIC.dist(lat,lon,t.lat,t.lon);
        if(d<bD){bD=d;bP=CORE.route.cumDist[i];}
    });

    return {name:"WP",lat,lon,routePos:bP,passed:false,missed:false};
});

// ✅ START FIX
if(!wpts.some(w=>w.name==="START")){
    wpts.push({
        name:"START",
        lat:CORE.route.track[0].lat,
        lon:CORE.route.track[0].lon,
        routePos:0,
        passed:true
    });
}

// ✅ FINISH FIX
if(!wpts.some(w=>w.name==="FINISH")){
    wpts.push({
        name:"FINISH",
        lat:CORE.route.track.at(-1).lat,
        lon:CORE.route.track.at(-1).lon,
        routePos:CORE.route.totalDist,
        passed:false
    });
}

CORE.route.waypoints=wpts.sort((a,b)=>a.routePos-b.routePos);

UI.table();
};
r.readAsText(e.target.files[0]);
},

start(){

if(CORE.session.watchId) return;

CORE.session.watchId=navigator.geolocation.watchPosition(p=>this.tick(p));

},

tick(p){

const now=Date.now();
const dt=CORE.session.lastTick?(now-CORE.session.lastTick)/1000:0;
CORE.session.lastTick=now;

const {latitude:lat,longitude:lon,accuracy:acc}=p.coords;

if(acc>40) return;

const R=LOGIC.getRouteInfo(lat,lon);

// ✅ BETERE AFSTAND (geen GPS speed)
if(CORE.session.lastPos){
    const d=LOGIC.dist(CORE.session.lastPos.lat,CORE.session.lastPos.lon,lat,lon);
    if(d<20){
        CORE.session.trip+=d;
        CORE.session.time+=dt;
    }
}

CORE.session.lastPos={lat,lon};

// OFF ROUTE
if(R.off>50 && acc<30){
    if(!CORE.session.off){
        this.speak("Afwijking van de route");
        CORE.session.off=true;
    }
}else if(R.off<20 && CORE.session.off){
    this.speak("Terug op de route");
    CORE.session.off=false;
}

// WAYPOINTS
CORE.route.waypoints.forEach(w=>{
    if(w.passed||w.missed) return;

    const d=LOGIC.dist(lat,lon,w.lat,w.lon);

    if(d<20){
        w.passed=true;
        this.speak("Waypoint "+w.name);
        UI.table();
    }
});

UI.update(lat,lon,acc,0,R);

},

speak(t){

const now=Date.now();
if(CORE.speech.lastMsg===t && now-CORE.speech.lastTime<5000) return;

CORE.speech.lastMsg=t;
CORE.speech.lastTime=now;

CORE.speech.queue.push(t);
if(!CORE.speech.speaking) this.play();

},

play(){
if(CORE.speech.queue.length===0){CORE.speech.speaking=false;return;}

CORE.speech.speaking=true;

const u=new SpeechSynthesisUtterance(CORE.speech.queue.shift());
u.lang="nl-NL";
u.onend=()=>setTimeout(()=>this.play(),400);

speechSynthesis.speak(u);
}

};

APP.init();
</script>
</body>
</html>
