<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Engine v9.5</title>
<style>
body { font-family:sans-serif; padding:10px; background:#f0f3f5; }
.card { max-width:600px; margin:auto; background:white; padding:15px; border-radius:12px; }
#info { background:#111; color:#0f0; padding:15px; border-radius:8px; font-family:monospace; min-height:300px; }
button { padding:12px; margin:5px 0; width:100%; }
</style>
</head>
<body>

<div class="card">
<h3>🚀 PLATINA ENGINE v9.5</h3>

<input type="file" id="gpxInput" accept=".gpx">
<button onclick="startGPS()">START</button>

<div id="info">Klaar...</div>
</div>

<script>
let track=[], cumDist=[], waypoints=[];
let lastPos=null, lastIndex=0, watchId=null;

let sport = { kcal:0, steps:0, movingTime:0, lastTick:null };
let speedBuffer=[];

// --- DIST ---
function getDist(a,b,c,d){
 const R=6371000;
 const dLat=(c-a)*Math.PI/180;
 const dLon=(d-b)*Math.PI/180;
 return 2*R*Math.asin(Math.sqrt(
  Math.sin(dLat/2)**2 +
  Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2
 ));
}

// --- SEGMENT PROJECTIE ---
function project(p,a,b){
 const t = ((p.lat-a.lat)*(b.lat-a.lat)+(p.lon-a.lon)*(b.lon-a.lon)) /
           ((b.lat-a.lat)**2+(b.lon-a.lon)**2);
 return Math.max(0,Math.min(1,t));
}

function getRInfo(lat,lon){
 let bestDist=Infinity, bestPos=0;

 let start=Math.max(0,lastIndex-10);
 let end=Math.min(track.length-2,lastIndex+20);

 for(let i=start;i<=end;i++){
  const a=track[i], b=track[i+1];
  const t=project({lat,lon},a,b);

  const pLat=a.lat+(b.lat-a.lat)*t;
  const pLon=a.lon+(b.lon-a.lon)*t;

  const d=getDist(lat,lon,pLat,pLon);

  if(d<bestDist){
    bestDist=d;
    bestPos=cumDist[i]+getDist(a.lat,a.lon,pLat,pLon);
    lastIndex=i;
  }
 }
 return {pos:bestPos, off:bestDist};
}

// --- GPX ---
document.getElementById('gpxInput').onchange=e=>{
 const r=new FileReader();
 r.onload=ev=>{
  const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

  const pts=[...xml.getElementsByTagName('trkpt')];
  track=pts.map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));

  cumDist=[0];
  for(let i=0;i<track.length-1;i++){
    cumDist[i+1]=cumDist[i]+getDist(
      track[i].lat,track[i].lon,
      track[i+1].lat,track[i+1].lon
    );
  }

  document.getElementById('info').innerText="Route geladen";
 };
 r.readAsText(e.target.files[0]);
};

// --- START ---
function startGPS(){
 if(!track.length) return alert("Laad GPX");

 if('wakeLock' in navigator){
  try{ navigator.wakeLock.request('screen'); }catch(e){}
 }

 watchId=navigator.geolocation.watchPosition(p=>{
  const {latitude:lat, longitude:lon, accuracy:acc}=p.coords;

  const now=Date.now();
  const dt=sport.lastTick?(now-sport.lastTick)/1000:0;

  const R=getRInfo(lat,lon);

  // snelheid via afstand
  let speed=0;
  if(lastPos && dt>0){
    const d=getDist(lastPos.lat,lastPos.lon,lat,lon);
    speed=(d/dt)*3.6;
  }

  // smoothing
  speedBuffer.push(speed);
  if(speedBuffer.length>5) speedBuffer.shift();
  speed=speedBuffer.reduce((a,b)=>a+b,0)/speedBuffer.length;

  // MET
  let met=1.5+(0.9*speed);
  const weight=92;

  if(speed>1){
    sport.movingTime+=dt;
    sport.kcal+=(met*3.5*weight/200)*(dt/60);
  }

  lastPos={lat,lon};
  sport.lastTick=now;

  const avgV = sport.movingTime>30 ?
    (R.pos/1000)/(sport.movingTime/3600) : 0;

  const remain=cumDist.at(-1)-R.pos;
  const eta=avgV>0.5 ? remain/(avgV/3.6) : 0;

  document.getElementById('info').innerHTML=`
  POS: ${Math.round(R.pos)} m<br>
  OFF: ${Math.round(R.off)} m<br>
  SPEED: ${speed.toFixed(2)} km/u<br>
  AVG: ${avgV.toFixed(2)} km/u<br>
  KCAL: ${Math.round(sport.kcal)}<br>
  ETA: ${eta>0?Math.round(eta/60)+" min":"--"}<br>
  ACC: ${acc}m
  `;

 },null,{enableHighAccuracy:true});
}
</script>

</body>
</html>
