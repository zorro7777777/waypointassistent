<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platina Engine v110 - Field Test Ready</title>
    <style>
        :root { --bg: #f4f7f6; --dark: #101010; --accent: #00ff00; --green: #00b894; --red: #d63031; --white: #ffffff; --panel: #2d3436; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #2d3436; }
        .card { max-width: 500px; margin: auto; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); color: white; padding: 12px 5px; gap: 5px; }
        .stat { text-align: center; }
        .stat-l { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; display: block; }
        .stat-v { font-weight: bold; font-size: 1.1rem; }

        #console { background: var(--dark); color: var(--white); padding: 25px 20px; font-family: 'Courier New', monospace; min-height: 240px; position: relative; border-bottom: 5px solid var(--green); }
        .gear { position: absolute; top: 12px; right: 12px; cursor: pointer; font-size: 1.6rem; z-index: 100; }
        .next-label { color: var(--accent); font-size: 1rem; font-weight: bold; }
        .main-val { font-size: 1.8rem; font-weight: bold; margin: 8px 0; line-height: 1.2; }
        .status-line { margin-top: 25px; font-size: 1.1rem; border-top: 1px solid #333; padding-top: 15px; font-weight: bold; }
        
        .p10 { padding: 15px; }
        button { padding: 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; margin-bottom: 10px; }
        .btn-main { background: var(--green); color: white; }
        .btn-stop { background: var(--red); color: white; display: none; }
        .btn-stats { background: #0984e3; color: white; display: none; }

        #config { background: #dfe6e9; padding: 15px; display: none; border-radius: 10px; margin-bottom: 15px; }
        #wp-list { margin-top: 20px; border-radius: 10px; overflow: hidden; border: 1px solid #eee; }
        .wp-item { display: flex; justify-content: space-between; padding: 14px 12px; border-bottom: 1px solid #eee; background: #fff; }
        .passed { color: var(--green); background: #e6fffb !important; }
        .missed { color: var(--red); text-decoration: line-through; }

        #stats-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 1000; color: white; padding: 30px 20px; box-sizing: border-box; overflow-y: auto; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .stat-box { background: #2d3436; padding: 15px; border-radius: 10px; border-left: 4px solid var(--accent); }
        .stat-box label { font-size: 0.65rem; text-transform: uppercase; color: #aaa; display: block; }
        .stat-box span { font-size: 1.2rem; font-weight: bold; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="stats-modal">
    <h2 style="color:var(--accent); margin:0;">🏁 Eindrapport</h2>
    <div class="stat-grid" id="final-stats"></div>
    <button class="btn-main" style="margin-top:30px;" onclick="location.reload()">NIEUWE ROUTE</button>
</div>

<div class="card">
    <div class="stats-bar">
        <div class="stat"><span class="stat-l">Stappen</span><span class="stat-v" id="v-steps">0</span></div>
        <div class="stat"><span class="stat-l">KM/U</span><span class="stat-v" id="v-speed">0.0</span></div>
        <div class="stat"><span class="stat-l">KCAL</span><span class="stat-v" id="v-kcal">0</span></div>
        <div class="stat"><span class="stat-l">TRIP</span><span class="stat-v" id="v-trip">0.00</span></div>
    </div>

    <div id="console">
        <div class="gear" onclick="UI.toggleConfig()">⚙️</div>
        <div id="display">Selecteer GPX...</div>
    </div>

    <div class="p10">
        <div id="config">
            <select id="p-select" style="width:100%; padding:10px; margin-bottom:10px;">
                <option value="wandelen">🚶 Wandelen </option>
                <option value="fietsen">🚲 Fietsen </option>
            </select>
            <label style="display:block; margin-bottom:10px;"><input type="checkbox" id="audio-on" checked> Audio Feedback</label>
            <button onclick="location.reload()" style="background:#636e72; color:white; padding:8px;">RESET</button>
        </div>

        <input type="file" id="file-in" accept=".gpx">
        <button class="btn-main" id="btn-start" onclick="Controller.start()">▶ START TEST RUN</button>
        <button class="btn-stop" id="btn-stop" onclick="Controller.stop()">🛑 STOP</button>
        <button class="btn-stats" id="btn-show-stats" onclick="UI.showFinalStats()">📊 BEKIJK RESULTAAT</button>
        
        <div id="wp-list"></div>
    </div>
</div>

<script>
/**
 * FIELD READY LOGICA v110
 */
const USER = { weight: 92, stride: 0.67 };
const PROFILES = {
    wandelen: { met: 3.5, tolerance: 50, interval: 20000, minS: 0.35, maxS: 6.5 },
    fietsen: { met: 8.0, tolerance: 100, interval: 15000, minS: 4.5, maxS: 45 }
};

const AudioService = {
    speak(text, priority = false) {
        if (!document.getElementById('audio-on').checked) return;
        if (priority) window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'nl-NL';
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
    }
};

const UI = {
    dom: {},
    init() {
        const ids = ['v-steps','v-speed','v-kcal','v-trip','display','wp-list','p-select','btn-start','btn-stop','file-in','config','btn-show-stats','final-stats','stats-modal'];
        ids.forEach(id => this.dom[id] = document.getElementById(id));
    },
    updateLive(s) {
        this.dom['v-steps'].innerText = Math.round(s.steps);
        this.dom['v-speed'].innerText = s.speed.toFixed(1);
        this.dom['v-trip'].innerText = (s.trip/1000).toFixed(2);
        this.dom['v-kcal'].innerText = Math.round(s.kcal);
    },
    renderConsole(nextWp, dist, offRoute, acc) {
        const p = PROFILES[this.dom['p-select'].value];
        const accColor = acc > 40 ? '#fab1a0' : '#00ff00';
        this.dom['display'].innerHTML = `
            <div class="next-label">DOEL: ${nextWp ? nextWp.name : 'FINISH'}</div>
            <div class="main-val">${nextWp ? Math.round(dist) + 'm' : 'Bereikt'}</div>
            <div class="status-line">
                AFW: <span style="color:${offRoute > p.tolerance ? '#ff4757' : '#00ff00'}">${Math.round(offRoute)}m</span><br>
                GPS Nauwkeurigheid: <span style="color:${accColor}">${Math.round(acc)}m</span>
            </div>
        `;
    },
    showFinalStats() {
        const s = Controller.state;
        const fmt = (sec) => `${Math.floor(sec/60)}m ${Math.floor(sec%60)}s`;
        this.dom['final-stats'].innerHTML = `
            <div class="stat-box"><label>Afstand</label><span>${(s.trip/1000).toFixed(2)} km</span></div>
            <div class="stat-box"><label>Stappen</label><span>${Math.round(s.steps)}</span></div>
            <div class="stat-box"><label>Verbruik</label><span>${Math.round(s.kcal)} kcal</span></div>
            <div class="stat-box"><label>Gem. Snelheid</label><span>${((s.trip/s.movingTime)*3.6 || 0).toFixed(1)} km/u</span></div>
            <div class="stat-box"><label>Tijd Bewogen</label><span>${fmt(s.movingTime)}</span></div>
            <div class="stat-box"><label>Tijd Stilstand</label><span>${fmt(s.idleTime)}</span></div>
        `;
        this.dom['stats-modal'].style.display = 'block';
    },
    toggleConfig() { this.dom['config'].style.display = this.dom['config'].style.display === 'block' ? 'none' : 'block'; }
};

const Controller = {
    data: { track: [], waypoints: [], cumDist: [] },
    state: { 
        active: false, watchId: null, lastTrackIdx: 0, currentWpIdx: 0, maxDist: 0,
        steps: 0, speed: 0, kcal: 0, trip: 0, movingTime: 0.1, idleTime: 0,
        lastTick: null, lastOffRouteTime: 0, isOnRoute: true, totalRouteLen: 0,
        prevPos: null
    },

    init() {
        UI.init();
        UI.dom['file-in'].onchange = (e) => this.handleFile(e);
        window.addEventListener('beforeunload', () => this.stop());
    },

    handleFile(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
            const pts = [...xml.getElementsByTagName('trkpt')].map(p => ({lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon')}));
            this.data.track = pts;
            this.data.cumDist = [0];
            for(let i=0; i<pts.length-1; i++) this.data.cumDist[i+1] = this.data.cumDist[i] + this.getDist(pts[i], pts[i+1]);
            this.state.totalRouteLen = this.data.cumDist.at(-1);

            const wpts = [...xml.getElementsByTagName('wpt')].map(w => ({
                name: w.getElementsByTagName('name')[0]?.textContent || "WP",
                lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'), status: 'pending'
            })).map(w => {
                w.routePos = this.findNear(w, 0).pos;
                return w;
            });
            this.data.waypoints = [{name: "START", routePos: 0, status: 'pending'}].concat(wpts).sort((a,b) => a.routePos - b.routePos);
            this.data.waypoints.push({name: "FINISH", routePos: this.state.totalRouteLen, status: 'pending'});
            this.renderWpList();
            UI.dom['display'].innerText = "GPX ingeladen.";
        };
        reader.readAsText(e.target.files[0]);
    },

    getDist(p1, p2) {
        const R = 6371000;
        const dLat = (p2.lat - p1.lat) * Math.PI / 180;
        const dLon = (p2.lon - p1.lon) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(p1.lat*Math.PI/180)*Math.cos(p2.lat*Math.PI/180)*Math.sin(dLon/2)**2;
        return 2 * R * Math.asin(Math.sqrt(a));
    },

    findNear(pos, lastIdx) {
        let best = { dist: Infinity, idx: lastIdx };
        const windowSize = 150;
        const start = Math.max(0, lastIdx - 50);
        for (let i = start; i < Math.min(this.data.track.length, start + windowSize); i++) {
            const d = this.getDist(pos, this.data.track[i]);
            if (d < best.dist) best = { dist: d, idx: i };
        }
        // Fallback: als we "verloren" zijn, scan de hele track
        if (best.dist > 150) {
            for (let i = 0; i < this.data.track.length; i++) {
                const d = this.getDist(pos, this.data.track[i]);
                if (d < best.dist) best = { dist: d, idx: i };
            }
        }
        return { ...best, pos: this.data.cumDist[best.idx] };
    },

    start() {
        if (!this.data.track.length) return;
        this.state.active = true;
        this.state.lastTick = Date.now();
        UI.dom['btn-start'].classList.add('hidden');
        UI.dom['btn-stop'].style.display = 'block';
        this.state.watchId = navigator.geolocation.watchPosition((p) => this.tick(p), 
            (err) => console.error(err), {enableHighAccuracy:true, timeout: 5000});
        AudioService.speak("Systeem gereed. Start de wandeling.");
    },

    stop() {
        this.state.active = false;
        if (this.state.watchId) navigator.geolocation.clearWatch(this.state.watchId);
        UI.dom['btn-stop'].style.display = 'none';
        UI.dom['btn-start'].classList.remove('hidden');
    },

    tick(p) {
        if (!this.state.active) return;
        const now = Date.now();
        const dt = (now - this.state.lastTick) / 1000;
        if (dt < 0.5) return; 
        this.state.lastTick = now;

        const { latitude: lat, longitude: lon, accuracy: acc, speed: rawSpeed } = p.coords;
        const prof = PROFILES[UI.dom['p-select'].value];

        // ❗ FIX 1: GPS Filter
        if (acc > 45) {
            this.state.idleTime += dt;
            return; 
        }

        // ❗ FIX 2: Speed Fallback
        let speedKmu = (rawSpeed !== null) ? rawSpeed * 3.6 : 0;
        if (rawSpeed === null && this.state.prevPos) {
            const dCheck = this.getDist(this.state.prevPos, {lat, lon});
            speedKmu = (dCheck / dt) * 3.6;
        }
        this.state.prevPos = {lat, lon};

        const R = this.findNear({lat, lon}, this.state.lastTrackIdx);
        this.state.lastTrackIdx = R.idx;
        if (R.pos > this.state.maxDist) this.state.maxDist = R.pos;

        // Stats logica met speed filters
        const isMoving = speedKmu >= prof.minS && speedKmu <= prof.maxS;
        if (isMoving) {
            this.state.movingTime += dt;
            const distInTick = (speedKmu / 3.6) * dt;
            this.state.trip += distInTick;
            this.state.steps += distInTick / USER.stride;
            this.state.kcal += ((prof.met * 3.5 * USER.weight) / 12000) * dt;
        } else {
            this.state.idleTime += dt;
        }
        this.state.speed = speedKmu;

        // Afwijking
        if (R.dist > prof.tolerance) {
            this.state.isOnRoute = false;
            if (now - this.state.lastOffRouteTime > prof.interval) {
                AudioService.speak(`Check route. ${Math.round(R.dist)} meter afwijking.`);
                this.state.lastOffRouteTime = now;
            }
        } else if (!this.state.isOnRoute && R.dist < 8) {
            AudioService.speak("Terug op route.");
            this.state.isOnRoute = true;
        }

        // ❗ FIX 3: Waypoint Sanity Check
        const next = this.data.waypoints[this.state.currentWpIdx];
        if (next) {
            const dToWp = this.getDist({lat, lon}, next);
            const isFin = next.name === "FINISH";
            
            // Alleen triggeren als afstand klein is EN we logischerwijs bij dat punt in de route zijn
            const routeMatch = Math.abs(this.state.maxDist - next.routePos) < 60;

            if (dToWp < 25 && routeMatch) {
                this.passWp(next);
            } else if (this.state.maxDist > next.routePos + 50 && !isFin) {
                this.passWp(next, true);
            }
        }

        UI.updateLive(this.state);
        UI.renderConsole(next, next ? next.routePos - R.pos : 0, R.dist, acc);
    },

    passWp(wp, missed = false) {
        wp.status = missed ? 'missed' : 'passed';
        this.state.currentWpIdx++;
        this.renderWpList();
        if (wp.name === "FINISH") {
            this.stop();
            AudioService.speak("Finish bereikt. Test voltooid.", true);
            UI.dom['btn-show-stats'].style.display = 'block';
        } else {
            AudioService.speak(missed ? wp.name + " overgeslagen." : wp.name + " bereikt.");
        }
    },

    renderWpList() {
        UI.dom['wp-list'].innerHTML = this.data.waypoints.map(w => `
            <div class="wp-item ${w.status}">
                <span>${w.status === 'passed' ? '✅' : (w.status === 'missed' ? '❌' : '⏳')} ${w.name}</span>
                <span>${Math.round(w.routePos)}m</span>
            </div>
        `).join('');
    }
};

Controller.init();
</script>
</body>
</html>
