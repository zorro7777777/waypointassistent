<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO - V4.0</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --accent: #00bfff;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --text-main: #2c3e50;
        }
        body { font-family: -apple-system, system-ui, sans-serif; padding: 5px; background: #f0f3f5; color: var(--text-main); font-size: 13px; margin: 0; }
        .card { max-width: 500px; margin: auto; background: white; padding: 12px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        
        /* Dashboard Styles */
        #console { background: var(--bg-dark); color: #00ff00; padding: 12px; border-radius: 10px; font-family: 'Courier New', monospace; margin: 10px 0; border-left: 5px solid var(--success); }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 10px; margin-bottom: 15px; }
        .stat-value { color: var(--accent); font-weight: 900; font-size: 1.8rem; display: block; }
        .stat-label { font-size: 0.7rem; color: #7f8c8d; text-transform: uppercase; }

        /* UI Elements */
        .config-section { background: #ecf0f1; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; transition: opacity 0.2s; }
        button:active { opacity: 0.7; }
        .btn-start { background: var(--success); flex: 2; }
        .btn-pause { background: var(--warning); flex: 2; }
        .btn-blue { background: var(--accent); }
        .btn-red { background: var(--danger); }

        hr { border: 0; border-top: 1px solid #333; margin: 8px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        td { padding: 8px 4px; border-bottom: 1px solid #eee; }
        .strikethrough { text-decoration: line-through; opacity: 0.5; color: var(--danger); }
        
        .coord-box { display: flex; justify-content: space-between; align-items: center; background: #222; padding: 8px; border-radius: 6px; margin-top: 10px; }
        .copy-btn { background: transparent; border: 1px solid #00ff00; color: #00ff00; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; }
    </style>
</head>
<body>

<div class="card">
    <div style="display:flex; justify-content: space-between; align-items: center;">
        <h2 style="margin:0; font-size:1.1rem;">WAYPOINTASSISTENT <span style="color:var(--accent)">PRO</span></h2>
        <span onclick="UI.toggleConfig()" style="cursor:pointer; font-size: 1.2rem;">⚙️</span>
    </div>

    <div id="configArea" class="config-section">
        <div class="row">
            <select id="profile" onchange="UI.updateProfile()" style="padding:8px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <input type="number" id="userWeight" style="width:50px; padding:5px;" value="92"> kg
        </div>
        <label><input type="checkbox" id="audioToggle" checked> Spraakassistent (NL)</label>
    </div>

    <div class="stat-grid">
        <div><span class="stat-label">Off-Route</span><span id="ui-off-big" class="stat-value">0m</span></div>
        <div><span class="stat-label">KM/U</span><span id="ui-speed-big" class="stat-value">0.0</span></div>
        <div><span class="stat-label">GPS Acc</span><span id="ui-acc-big" class="stat-value">0m</span></div>
    </div>

    <div style="background: #e8f4fd; padding: 10px; border-radius: 8px; border-left: 4px solid var(--accent); margin-bottom: 10px;">
        <span class="stat-label" style="color:var(--text-main)">Huidig Traject:</span><br>
        <span id="ui-segment" style="font-weight:bold; font-size: 1rem;">Laden...</span>
    </div>

    <input type="file" id="gpxInput" accept=".gpx" style="width:100%; margin-bottom:10px;">

    <div class="row">
        <button id="startBtn" onclick="APP.handleStartPause()" class="btn-start">▶ START</button>
        <button onclick="UI.toggleTable()" class="btn-blue">📑</button>
        <button id="resetBtn" onclick="location.reload()" class="btn-red" style="display:none;">🔄</button>
    </div>

    <div id="console">
        <div id="standby-msg" style="text-align:center; padding: 20px;">Wacht op GPX bestand...</div>
        
        <div id="live-ui" style="display:none;">
            <div>WP: <span id="ui-next-wp" style="color:#fff; font-weight:bold;">---</span> (<span id="ui-dist">0m</span>)</div>
            <hr>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 0.8rem;">
                <div>TRIP: <span id="ui-trip" style="color:#00ff00">0.000 km</span></div>
                <div>ETA: <span id="ui-eta" style="color:#00ff00">--:--</span></div>
                <div>MOVE: <span id="ui-mov-time" style="color:#00ff00">00:00:00</span></div>
                <div>AVG: <span id="ui-avg-speed" style="color:#00ff00">0.0 km/u</span></div>
                <div>KCAL: <span id="ui-kcal" style="color:#00ff00">0</span></div>
                <div>MET: <span id="ui-met" style="color:#00ff00">1.0</span></div>
            </div>
            
            <div class="coord-box">
                <div style="font-size: 0.7rem; color: #ffff00;">
                    LAT: <span id="ui-lat">0.000000</span><br>LON: <span id="ui-lon">0.000000</span>
                </div>
                <button class="copy-btn" onclick="UI.copyCoords()">📋 KOPIEER</button>
            </div>
        </div>
    </div>

    <div id="tableCon" style="display:none;"><table id="wpList"></table></div>
</div>

<script>
/** * 1. CORE DATA & STATE
 * Centraal object voor alle variabelen 
 */
const CORE = {
    settings: {
        wandelen: { ms: 0.36, th: 0.67, radius: 15, unit: "STAPPEN" },
        fietsen:  { ms: 5.5, th: 2.10, radius: 25, unit: "OMWENTELINGEN" }
    },
    activeConfig: {},
    route: { track: [], waypoints: [], cumDist: [], totalDist: 0 },
    session: {
        isStarted: false,
        isPaused: false,
        isOffRoute: false,
        finished: false,
        lastTrackIdx: 0,
        tripDist: 0,
        movingTime: 0,
        pauseTime: 0,
        kcal: 0,
        steps: 0,
        lastTick: null,
        smoothSpeed: 0,
        watchId: null,
        wakeLock: null
    },
    speech: { queue: [], isSpeaking: false, lastOffSpeech: 0 }
};

/**
 * 2. LOGIC & MATH
 * Alleen berekeningen, geen UI manipulatie
 */
const LOGIC = {
    getDist(aLat, aLon, bLat, bLon) {
        const R = 6371000, dLat = (bLat - aLat) * Math.PI / 180, dLon = (bLon - aLon) * Math.PI / 180;
        const a = Math.sin(dLat/2) ** 2 + Math.cos(aLat * Math.PI/180) * Math.cos(bLat * Math.PI/180) * Math.sin(dLon/2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
    },

    getRouteInfo(lat, lon) {
        let bestDist = Infinity, bestPos = 0, bestIdx = 0;
        const start = Math.max(0, CORE.session.lastTrackIdx - 50);
        const end = Math.min(CORE.route.track.length, CORE.session.lastTrackIdx + 150);

        for (let i = start; i < end; i++) {
            const d = this.getDist(lat, lon, CORE.route.track[i].lat, CORE.route.track[i].lon);
            if (d < bestDist) { bestDist = d; bestPos = CORE.route.cumDist[i]; bestIdx = i; }
        }
        CORE.session.lastTrackIdx = bestIdx;
        return { offRoute: bestDist, posOnRoute: bestPos };
    },

    getMET(speedkmh, profile) {
        if (speedkmh < 1.5) return 1.0;
        if (profile === 'wandelen') return speedkmh > 5.5 ? 4.0 : (speedkmh > 4.0 ? 3.2 : 2.5);
        return speedkmh > 25 ? 9.0 : (speedkmh > 15 ? 5.5 : 3.5);
    }
};

/**
 * 3. UI & VIEW
 * Verantwoordelijk voor alles wat de gebruiker ziet
 */
const UI = {
    update(lat, lon, acc, speed, RInfo) {
        const nextWp = CORE.route.waypoints.find(w => !w.passed && !w.missed);
        const avg = CORE.session.movingTime > 5 ? (CORE.session.tripDist / CORE.session.movingTime) * 3.6 : 0;
        
        // Hoofd stats
        document.getElementById('ui-off-big').innerText = Math.round(RInfo.offRoute) + "m";
        document.getElementById('ui-off-big').style.color = RInfo.offRoute > 40 ? 'var(--danger)' : 'var(--accent)';
        document.getElementById('ui-speed-big').innerText = speed.toFixed(1);
        document.getElementById('ui-acc-big').innerText = Math.round(acc) + "m";
        
        // Console stats
        document.getElementById('ui-next-wp').innerText = nextWp ? nextWp.name : "FINISH";
        document.getElementById('ui-dist').innerText = nextWp ? Math.round(nextWp.routePos - RInfo.posOnRoute) + "m" : "0m";
        document.getElementById('ui-trip').innerText = (CORE.session.tripDist / 1000).toFixed(3) + " km";
        document.getElementById('ui-mov-time').innerText = this.fmtTime(CORE.session.movingTime);
        document.getElementById('ui-avg-speed').innerText = avg.toFixed(1) + " km/u";
        document.getElementById('ui-kcal').innerText = Math.round(CORE.session.kcal);
        document.getElementById('ui-lat').innerText = lat.toFixed(6);
        document.getElementById('ui-lon').innerText = lon.toFixed(6);

        // Traject tekst
        const prevWp = [...CORE.route.waypoints].reverse().find(w => w.passed);
        document.getElementById('ui-segment').innerText = (prevWp && nextWp) 
            ? `${prevWp.name} ➔ ${nextWp.name}` 
            : (nextWp ? `Naar ${nextWp.name}` : "Finish bereikt");
            
        this.updateTable();
    },

    fmtTime(s) { return new Date(s * 1000).toISOString().substr(11, 8); },
    
    toggleConfig() {
        const area = document.getElementById('configArea');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
        document.getElementById('resetBtn').style.display = area.style.display;
    },

    toggleTable() {
        const t = document.getElementById('tableCon');
        t.style.display = t.style.display === 'none' ? 'block' : 'none';
    },

    updateTable() {
        const list = document.getElementById('wpList');
        list.innerHTML = CORE.route.waypoints.map(w => `
            <tr class="${w.missed ? 'strikethrough' : ''}" style="color:${w.passed ? 'var(--success)' : 'inherit'}">
                <td>${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td>
                <td><b>${w.name}</b></td>
                <td align="right">${(w.routePos/1000).toFixed(2)}km</td>
            </tr>
        `).join('');
    },

    copyCoords() {
        const text = `Locatie: ${document.getElementById('ui-lat').innerText}, ${document.getElementById('ui-lon').innerText}\nTraject: ${document.getElementById('ui-segment').innerText}\nMaps: https://www.google.com/maps?q=${document.getElementById('ui-lat').innerText},${document.getElementById('ui-lon').innerText}`;
        navigator.clipboard.writeText(text).then(() => alert("Gekopieerd!"));
    }
};

/**
 * 4. APP CONTROLLER
 * De "motor" die alles verbindt
 */
const APP = {
    init() {
        CORE.activeConfig = CORE.settings.wandelen;
        document.getElementById('gpxInput').onchange = (e) => this.loadGPX(e);
    },

    loadGPX(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
            const pts = [...xml.getElementsByTagName('trkpt')];
            
            CORE.route.track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
            CORE.route.cumDist = [0];
            for(let i=0; i<CORE.route.track.length-1; i++) {
                CORE.route.cumDist[i+1] = CORE.route.cumDist[i] + LOGIC.getDist(CORE.route.track[i].lat, CORE.route.track[i].lon, CORE.route.track[i+1].lat, CORE.route.track[i+1].lon);
            }
            CORE.route.totalDist = CORE.route.cumDist.at(-1);

            CORE.route.waypoints = [...xml.getElementsByTagName('wpt')].map(w => {
                const lat = +w.getAttribute('lat'), lon = +w.getAttribute('lon');
                let bD = Infinity, bP = 0;
                CORE.route.track.forEach((t, i) => {
                    const d = LOGIC.getDist(lat, lon, t.lat, t.lon);
                    if(d < bD) { bD = d; bP = CORE.route.cumDist[i]; }
                });
                return { name: w.getElementsByTagName('name')[0]?.textContent || "Punt", lat, lon, routePos: bP, passed: false, missed: false };
            }).sort((a,b) => a.routePos - b.routePos);

            document.getElementById('standby-msg').innerText = "GPX GELADEN. DRUK START.";
            UI.updateTable();
        };
        reader.readAsText(e.target.files[0]);
    },

    handleStartPause() {
        if (CORE.route.track.length === 0) return alert("Laad eerst een GPX!");
        
        if (!CORE.session.watchId) {
            this.startGPS();
            CORE.session.isStarted = true;
            document.getElementById('startBtn').innerText = "⏸ PAUZE";
            document.getElementById('startBtn').className = "btn-pause";
            document.getElementById('standby-msg').style.display = 'none';
            document.getElementById('live-ui').style.display = 'block';
            this.speak("Systeem gestart");
        } else {
            CORE.session.isPaused = !CORE.session.isPaused;
            document.getElementById('startBtn').innerText = CORE.session.isPaused ? "▶ HERVAT" : "⏸ PAUZE";
            this.speak(CORE.session.isPaused ? "Gepauzeerd" : "Hervat");
        }
        CORE.session.lastTick = Date.now();
    },

    startGPS() {
        CORE.session.watchId = navigator.geolocation.watchPosition(pos => {
            const now = Date.now();
            const delta = CORE.session.lastTick ? (now - CORE.session.lastTick) / 1000 : 0;
            CORE.session.lastTick = now;

            if (CORE.session.isPaused || CORE.session.finished) return;

            const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = pos.coords;
            if (acc > 45) return;

            const R = LOGIC.getRouteInfo(lat, lon);
            const speedKmh = (s || 0) * 3.6;

            // Bewegingsdetectie & Auto-pauze
            if (speedKmh > 1.8) {
                CORE.session.movingTime += delta;
                CORE.session.tripDist += (s || 0) * delta;
                const met = LOGIC.getMET(speedKmh, document.getElementById('profile').value);
                CORE.session.kcal += (met * parseFloat(document.getElementById('userWeight').value) * 1.05) / 3600 * delta;
            } else {
                CORE.session.pauseTime += delta;
            }

            // Route Alarm
            if (R.offRoute > 50 && (now - CORE.speech.lastOffSpeech > 30000)) {
                this.speak(`Route alarm: ${Math.round(R.offRoute)} meter`);
                CORE.speech.lastOffSpeech = now;
            }

            // Waypoint logica
            CORE.route.waypoints.forEach(w => {
                if (w.passed || w.missed) return;
                const d = LOGIC.getDist(lat, lon, w.lat, w.lon);
                if (d < CORE.activeConfig.radius || (R.posOnRoute > w.routePos && d < 40)) {
                    w.passed = true;
                    this.speak(`Waypoint bereikt: ${w.name}`);
                } else if (R.posOnRoute > w.routePos + 50) {
                    w.missed = true;
                }
            });

            UI.update(lat, lon, acc, speedKmh, R);
        }, err => console.error(err), { enableHighAccuracy: true });
    },

    speak(txt) {
        if (!document.getElementById('audioToggle').checked) return;
        const msg = new SpeechSynthesisUtterance(txt);
        msg.lang = 'nl-NL';
        window.speechSynthesis.speak(msg);
    }
};

// Start de applicatie
APP.init();
</script>

</body>
</html>
