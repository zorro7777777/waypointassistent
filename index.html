<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Engine v64 - Final Edition</title>
    <style>
        body { font-family: sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
        .stat-box { background: #fff; border: 1px solid #ddd; padding: 8px 2px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 0.55rem; color: #7f8c8d; text-transform: uppercase; display: block; }
        .stat-val { font-weight: bold; font-size: 0.95rem; }
        #info { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; margin: 10px 0; min-height: 160px; line-height: 1.5; border-left: 5px solid #27ae60; font-size: 0.85rem; }
        .highlight { color: #fff; font-weight: bold; font-size: 1rem; }
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #dcdde1; }
        .summary-bar { font-size: 0.75rem; font-weight: bold; padding: 10px; background: #dfe6e9; border-radius: 5px; margin-top: 10px; display: flex; justify-content: space-around; border: 1px solid #bdc3c7; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; }
        .start { background: #27ae60; width: 65%; } .reset { background: #e74c3c; width: 30%; }
        .test-audio { background: #3498db; width: 100%; margin-bottom: 10px; font-size: 0.8rem; padding: 8px; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.8rem; }
        th { text-align: left; color: #95a5a6; border-bottom: 2px solid #eee; padding: 5px 0; }
        td { padding: 10px 0; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.1rem; margin:0 0 10px 0;">GPX ENGINE v64 PRO</h1>
    
    <div class="stats-grid">
        <div class="stat-box"><span id="unit-label" class="stat-label">Stappen</span><span id="stat-steps" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Cadans/m</span><span id="stat-cadence" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Kcal</span><span id="stat-kcal" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Trip Km</span><span id="stat-trip" class="stat-val">0.00</span></div>
    </div>

    <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="stat-box"><span class="stat-label">Bewogen Tijd</span><span id="stat-moving" class="stat-val">00:00:00</span></div>
        <div class="stat-box"><span class="stat-label">Pauze Tijd</span><span id="stat-idle" class="stat-val">00:00:00</span></div>
    </div>

    <div class="config-section">
        <div class="row">
            <label><b>Profiel:</b></label>
            <select id="profile" onchange="updateProfile()" style="padding:4px; border-radius:4px;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
        </div>
        <div class="row">
            <label><input type="checkbox" id="audioToggle" checked> 🔊 Audio</label>
            <div>
                <input type="radio" name="voiceType" value="vrouw" checked> Vrouw 
                <input type="radio" name="voiceType" value="man"> Man
            </div>
        </div>
        <div class="row">
            <label><input type="checkbox" id="showTable" checked onchange="toggleTable()"> 📑 Toon Lijst</label>
        </div>
    </div>

    <button onclick="testVoice()" class="test-audio">TEST AUDIO</button>
    <input type="file" id="gpxInput" accept=".gpx" style="width:100%; margin-bottom:10px; border:1px solid #ccc; padding:5px; border-radius:5px;">
    
    <div class="row">
        <button onclick="startGPS()" class="start">START GPS TRACKING</button>
        <button onclick="location.reload()" class="reset">RESET</button>
    </div>
    
    <div id="info">Systeem gereed. Upload een route.</div>

    <div id="tableCon">
        <div class="summary-bar" id="wp-summary">Punten: 0 | ✅ 0 | ❌ 0 | ⏳ 0</div>
        <table>
            <thead><tr><th>ST</th><th>WAYPOINT</th><th style="text-align:right">SEGMENT</th></tr></thead>
            <tbody id="list"></tbody>
        </table>
    </div>
</div>

<script>
let CONFIG = { ms: 0.35, th: 0.67, radius: 12, met: 3.5 };
const PROFS = {
    wandelen: { ms: 0.35, th: 0.67, radius: 12, met: 3.5, unit: "Stappen" },
    fietsen: { ms: 1.95, th: 2.10, radius: 20, met: 8.0, unit: "Omwentelingen" }
};

let track = [], waypoints = [], cumDist = [];
let watchId = null, lastPos = null, maxRoutePos = 0, tripDist = 0, finished = false;
let sport = { steps: 0, kcal: 0, movingTime: 0, idleTime: 0, lastTick: null };

function speak(t) {
    if (!document.getElementById('audioToggle').checked) return;
    const m = new SpeechSynthesisUtterance(t);
    m.lang = 'nl-NL';
    const voices = window.speechSynthesis.getVoices();
    const isMan = document.querySelector('input[name="voiceType"]:checked').value === 'man';
    const v = voices.find(v => v.lang.includes('NL') && (isMan ? (v.name.includes('Male') || v.name.includes('David')) : (v.name.includes('Female') || v.name.includes('vrouw'))));
    if (v) m.voice = v;
    window.speechSynthesis.speak(m);
}
window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();

function getDist(a,b,c,d){
    const R=6371000, rL=(c-a)*Math.PI/180, rO=(d-b)*Math.PI/180;
    const x = Math.sin(rL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(rO/2)**2;
    return 2*R*Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
}

function projectOnRoute(lat, lon) {
    let bD = Infinity, bP = 0;
    track.forEach((t, i) => {
        const d = getDist(lat, lon, t.lat, t.lon);
        if (d < bD) { bD = d; bP = cumDist[i]; }
    });
    return bP;
}

document.getElementById('gpxInput').onchange = e => {
    const r = new FileReader();
    r.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        const pts = [...xml.getElementsByTagName('trkpt')];
        if(!pts.length) return;
        track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        cumDist = [0]; 
        for(let i=0; i<track.length-1; i++) cumDist[i+1] = cumDist[i] + getDist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
        
        let wpts = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "WP",
            lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'),
            passed: false, missed: false, touched: false
        }));

        wpts.push({ name: "START", lat: track[0].lat, lon: track[0].lon, passed: false, missed: false, touched: false });
        wpts.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, passed: false, missed: false, touched: false });

        waypoints = wpts.map(w => { w.routePos = projectOnRoute(w.lat, w.lon); return w; }).sort((a,b) => a.routePos - b.routePos);
        for(let i=0; i<waypoints.length; i++) waypoints[i].segment = i === 0 ? 0 : waypoints[i].routePos - waypoints[i-1].routePos;
        updateWPUI();
    };
    r.readAsText(e.target.files[0]);
};

function updateWPUI() {
    const p = waypoints.filter(w => w.passed).length, m = waypoints.filter(w => w.missed).length, t = waypoints.length;
    document.getElementById('wp-summary').innerText = `Punten: ${t} | ✅ ${p} | ❌ ${m} | ⏳ ${t-p-m}`;
    document.getElementById('list').innerHTML = waypoints.map(w => `
        <tr style="${w.passed ? 'color:#27ae60; font-weight:bold;' : (w.missed ? 'color:#e74c3c;text-decoration:line-through;' : '')}">
            <td>${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td>
            <td>${w.name}</td>
            <td style="text-align:right">${Math.round(w.segment)}m</td>
        </tr>`).join('');
}

function startGPS() {
    if (watchId || !track.length) return;
    speak("Systeem gestart. Volg de route.");
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen');
    
    watchId = navigator.geolocation.watchPosition(p => {
        if (finished) return; // STOP ALLE BEREKENINGEN

        const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = p.coords;
        const skmh = (s || 0) * 3.6, now = Date.now();
        const dt = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;
        const curPos = projectOnRoute(lat, lon);
        if (curPos > maxRoutePos) maxRoutePos = curPos;

        const isM = skmh >= (CONFIG.ms * 3.6);
        if (isM) {
            sport.movingTime += dt;
            const stepInc = ((skmh/3.6 * dt) / CONFIG.th);
            sport.steps += stepInc;
            sport.kcal += ((CONFIG.met * 3.5 * 92) / 12000) * dt;
            if (lastPos && acc < 20) tripDist += getDist(lastPos.lat, lastPos.lon, lat, lon);
            lastPos = { lat, lon };
        } else if (sport.lastTick) { sport.idleTime += dt; }

     waypoints.forEach((w, i) => {
            if (w.passed || w.missed) return;
            const d = getDist(lat, lon, w.lat, w.lon);
            if (d <= CONFIG.radius) w.touched = true;

            const isFinish = (i === waypoints.length - 1);

            // BEREIKT (✅)
            if (curPos >= w.routePos - CONFIG.radius && w.touched) {
                w.passed = true;
                if (isFinish) {
                    finished = true; // STOP tellers: Doel gehaald
                    speak("Gefeliciteerd, je hebt de finish bereikt.");
                } else {
                    speak("Je hebt " + w.name + " bereikt.");
                }
                updateWPUI();
            }
            // GEMIST (❌)
            else if (maxRoutePos > w.routePos + CONFIG.radius + acc + 10) {
                w.missed = true;
                speak("Je hebt " + w.name + " overgeslagen.");
                
                if (isFinish) {
                    finished = true; // STOP tellers: Je bent de finish voorbij gelopen
                }
                // Als het GEEN finish is, gebeurt er niets met 'finished' en loopt alles door!
                updateWPUI();
            }
        });

        // UI RENDER
        const fT = (sec) => new Date(sec * 1000).toISOString().substr(11, 8);
        const avgS = (sport.movingTime > 0) ? (tripDist / 1000) / (sport.movingTime / 3600) : 0;
        const avgC = (sport.movingTime > 0) ? (sport.steps / (sport.movingTime / 60)) : 0;

        document.getElementById('stat-steps').innerText = Math.round(sport.steps);
        document.getElementById('stat-trip').innerText = (tripDist/1000).toFixed(2);
        document.getElementById('stat-kcal').innerText = Math.round(sport.kcal);
        document.getElementById('stat-moving').innerText = fT(sport.movingTime);
        document.getElementById('stat-idle').innerText = fT(sport.idleTime);
        document.getElementById('stat-cadence').innerText = Math.round(isM ? ((skmh/3.6)/CONFIG.th*60) : 0);
        
        const next = waypoints.find(w => !w.passed && !w.missed);
        document.getElementById('info').innerHTML = `
            <b style="color:#00ff00">DOEL:</b> <span class="highlight">${next ? next.name : 'FINISH'}</span><br>
            <b>AFSTAND:</b> <span class="highlight">${next ? Math.max(0, Math.round(next.routePos - curPos)) : 0}m</span><br>
            <hr style="border:0; border-top:1px solid #444; margin:8px 0;">
            <b>GEM. SNELHEID:</b> ${avgS.toFixed(2)} km/u<br>
            <b>GEM. CADANS:</b> ${Math.round(avgC)} st/min<br>
            <b>GPS NAUWKEURIGHEID:</b> ${acc.toFixed(0)}m
        `;
        sport.lastTick = now;
    }, null, { enableHighAccuracy: true });
}

function updateProfile() {
    CONFIG = PROFS[document.getElementById('profile').value];
    document.getElementById('unit-label').innerText = CONFIG.unit;
    speak("Profiel gewijzigd.");
}
function testVoice() { speak("Stemtest voltooid."); }
function toggleTable() { document.getElementById('tableCon').style.display = document.getElementById('showTable').checked ? 'block' : 'none'; }
</script>
</body>
</html>
