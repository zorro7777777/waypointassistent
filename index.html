<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO - V4.6</title>
    <style>
        :root {
            --bg-dark: #1a1a1a;
            --accent: #00bfff;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --text-main: #2c3e50;
        }
        body { font-family: -apple-system, system-ui, sans-serif; padding: 5px; background: #f0f3f5; color: var(--text-main); font-size: 13px; margin: 0; }
        .card { max-width: 500px; margin: auto; background: white; padding: 12px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        #console { background: var(--bg-dark); color: #00ff00; padding: 12px; border-radius: 10px; font-family: 'Courier New', monospace; margin: 10px 0; border-left: 5px solid var(--success); min-height: 100px; }
        .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; gap: 10px; margin-bottom: 15px; }
        .stat-value { color: var(--accent); font-weight: 900; font-size: 1.8rem; display: block; }
        .stat-label { font-size: 0.7rem; color: #7f8c8d; text-transform: uppercase; }
        .config-section { background: #ecf0f1; padding: 10px; border-radius: 8px; margin-bottom: 10px; display: none; }
        .row { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .btn-start { background: var(--success); flex: 2; }
        .btn-blue { background: var(--accent); flex: 0.5; }
        .btn-red { background: var(--danger); flex: 0.5; }
        hr { border: 0; border-top: 1px solid #444; margin: 8px 0; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        td { padding: 10px 4px; border-bottom: 1px solid #eee; cursor: pointer; }
        .strikethrough { text-decoration: line-through; opacity: 0.5; color: var(--danger); }
        .info-badge { background: var(--accent); color: white; font-size: 0.6rem; padding: 2px 5px; border-radius: 50%; margin-left: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
        <h2 style="margin:0; font-size:1.1rem;">WAYPOINTASSISTENT <span style="color:var(--accent)">PRO V4.6</span></h2>
        <span onclick="UI.toggleConfig()" style="cursor:pointer; font-size: 1.2rem;">⚙️</span>
    </div>

    <div id="configArea" class="config-section">
        <div class="row">
            <select id="profile" onchange="UI.updateProfile()" style="padding:8px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <input type="number" id="userWeight" style="width:50px; padding:5px;" value="92"> kg
        </div>
        <label><input type="checkbox" id="audioToggle" checked> Spraakassistent (NL)</label>
        <hr>
        <input type="file" id="gpxInput" accept=".gpx" style="width:100%;">
    </div>

    <div class="stat-grid">
        <div><span class="stat-label">Off-Route</span><span id="ui-off-big" class="stat-value">0m</span></div>
        <div><span class="stat-label">KM/U</span><span id="ui-speed-big" class="stat-value">0.0</span></div>
        <div><span class="stat-label">GPS Acc</span><span id="ui-acc-big" class="stat-value">0m</span></div>
    </div>

    <div style="background: #e8f4fd; padding: 10px; border-radius: 8px; border-left: 4px solid var(--accent); margin-bottom: 10px;">
        <div style="display:flex; justify-content:space-between; align-items: baseline;">
            <span class="stat-label">Traject:</span>
            <span id="ui-total-len" style="font-size:0.75rem; font-weight:bold; color:var(--success);">Afstand: --</span>
        </div>
        <span id="ui-segment" style="font-weight:bold; font-size: 0.95rem;">Wacht op GPX...</span>
    </div>

<div class="row">
    <button id="startBtn" onclick="APP.handleStartPause()" class="btn-start">▶ START</button>
    <button onclick="UI.toggleTable()" class="btn-blue">📑</button>
    <button id="stopBtn" onclick="APP.handleStop()" class="btn-red" style="display:none;">⏹ STOP</button>
    <button id="resetBtn" onclick="APP.handleReset()" class="btn-red" style="display:none;">🔄</button>
</div>

    <div id="console">
        <div id="standby-msg" style="text-align:center; padding: 20px;">Laad een GPX bestand om te beginnen.</div>
        <div id="live-ui" style="display:none;">
           <div style="display:flex; justify-content:space-between; align-items: center;">
              <span>WP: <span id="ui-next-wp" style="color:#fff; font-weight:bold;">---</span></span>
              <span id="ui-dist" style="color:var(--accent); font-size: 1.2rem; font-weight: bold;">0m</span>
          </div>
            <hr>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.8rem;">
                <div>TRIP: <span id="ui-trip" style="color:#00ff00">0.000 km</span></div>
                <div>ETA: <span id="ui-eta" style="color:#00ff00">--:--</span></div>
                <div>MOVE: <span id="ui-mov-time" style="color:#00ff00">00:00:00</span></div>
                <div>PAUZE: <span id="ui-pau-time" style="color:#00ff00">00:00:00</span></div>
                <div>KCAL: <span id="ui-kcal" style="color:#00ff00">0</span></div>
                <div>MET: <span id="ui-met" style="color:#00ff00">1.0</span></div>
                <div>AVG KM/U: <span id="ui-avg-speed" style="color:#00ff00">0.0</span></div>
                <div><span id="ui-count-label">STAPPEN</span>: <span id="ui-steps" style="color:#00ff00">0</span></div>
            </div>
        </div>
    </div>
    <div id="tableCon" style="display:none;"><table id="wpList"></table></div>
</div>

<script>
// --- CONFIGURATIE & STATE ---
const STATES = { IDLE: 'IDLE', RUNNING: 'RUNNING', PAUSED: 'PAUSED', FINISHED: 'FINISHED' };

const CORE = {
    settings: {
        wandelen: { ms: 0.36, th: 0.67, radius: 20, label: "STAPPEN" },
        fietsen:  { ms: 5.5, th: 2.10, radius: 35, label: "OMWENTELINGEN" }
    },
    met_table: {
        wandelen: [{max: 1.5, met: 1.0}, {max: 4.0, met: 3.0}, {max: 5.5, met: 3.5}, {max: Infinity, met: 4.5}],
        fietsen:  [{max: 1.5, met: 1.0}, {max: 15, met: 5.0}, {max: 20, met: 6.5}, {max: Infinity, met: 8.0}]
    },
    route: { track: [], waypoints: [], cumDist: [], totalDist: 0 },
    session: {
        state: STATES.IDLE,
        isOffRoute: false,
        lastTrackIdx: 0,
        lastRoutePos: 0,
        tripDist: 0,
        movingTime: 0,
        pauseTime: 0,
        kcal: 0,
        steps: 0,
        lastTick: null,
        watchId: null,
        currentMet: 1.0,
        lastOffRouteSpeakDist: 0,
        moveSeconds: 0,
        lastLat: 0,
        lastLon: 0
    },
    speech: { queue: [], isSpeaking: false, lastMsg: "" }
};

// --- LOGICA & WISKUNDE ---
const LOGIC = {
    getDist(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = Math.PI / 180;
        const dLat = (lat2 - lat1) * toRad;
        const dLon = (lon2 - lon1) * toRad;
        const lat1r = lat1 * toRad;
        const lat2r = lat2 * toRad;
        const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1r) * Math.cos(lat2r) * Math.sin(dLon / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(a));
    },

    getMET(speed, profile) {
        const table = CORE.met_table[profile];
        for (const entry of table) { if (speed <= entry.max) return entry.met; }
        return 1.0;
    },

    getLineProj(p, a, b) {
        const l2 = ((a.lat - b.lat) ** 2 + (a.lon - b.lon) ** 2);
        if (l2 === 0) return a;
        let t = ((p.lat - a.lat) * (b.lat - a.lat) + (p.lon - a.lon) * (b.lon - a.lon)) / l2;
        t = Math.max(0, Math.min(1, t));
        return { lat: a.lat + t * (b.lat - a.lat), lon: a.lon + t * (b.lon - a.lon), t: t };
    },

    formatVoiceDist(meters) {
        return meters < 1000 ? `${Math.round(meters)} meter` : `${(meters / 1000).toFixed(1)} kilometer`.replace('.', ',');
    }
};

// --- GEBRUIKERSINTERFACE ---
const UI = {
    toggleConfig() {
        const el = document.getElementById('configArea');
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    },

    toggleTable() {
        const s = document.getElementById('tableCon').style;
        s.display = (s.display === 'none' ? 'block' : 'none');
    },

    updateProfile() {
        UI.update(CORE.session.lastLat, CORE.session.lastLon, 0, 0, 0, CORE.session.lastRoutePos);
        UI.updateTable();
    },

    update(lat=0, lon=0, acc=0, speed=0, offRoute=0, posOnRoute=0) {
        if (!CORE.route.track.length) return;

        const nextWp = CORE.route.waypoints.find(w => !w.passed && !w.missed);
        const avgSpeed = CORE.session.movingTime > 2 ? (CORE.session.tripDist / CORE.session.movingTime) * 3.6 : 0;
        const profile = document.getElementById('profile').value;
        const config = CORE.settings[profile];

        document.getElementById('ui-total-len').innerText = `Track: ${(CORE.route.totalDist/1000).toFixed(2)} km`;
        document.getElementById('ui-off-big').innerText = Math.round(offRoute) + "m";
        document.getElementById('ui-off-big').style.color = offRoute > 45 ? 'var(--danger)' : 'var(--accent)';
        document.getElementById('ui-speed-big').innerText = speed.toFixed(1);
        document.getElementById('ui-acc-big').innerText = Math.round(acc) + "m";

        document.getElementById('ui-next-wp').innerText = nextWp ? nextWp.name : "FINISH";
        document.getElementById('ui-dist').innerText = nextWp ? Math.max(0, Math.round(nextWp.routePos - posOnRoute)) + "m" : "0m";
        document.getElementById('ui-trip').innerText = (CORE.session.tripDist / 1000).toFixed(3) + " km";
        
        document.getElementById('ui-mov-time').innerText = this.fmt(CORE.session.movingTime);
        document.getElementById('ui-pau-time').innerText = this.fmt(CORE.session.pauseTime);
        document.getElementById('ui-kcal').innerText = Math.round(CORE.session.kcal);
        document.getElementById('ui-met').innerText = CORE.session.currentMet.toFixed(1);
        document.getElementById('ui-avg-speed').innerText = avgSpeed.toFixed(1);
        document.getElementById('ui-steps').innerText = Math.floor(CORE.session.steps);
        document.getElementById('ui-count-label').innerText = config.label;

        let etaStr = "--:--";
        if (speed > 2.0 && nextWp) {
            const sec = (CORE.route.totalDist - posOnRoute) / (speed / 3.6);
            if (isFinite(sec)) {
                const arrival = new Date(Date.now() + sec * 1000);
                etaStr = arrival.getHours().toString().padStart(2,'0') + ":" + arrival.getMinutes().toString().padStart(2,'0');
            }
        }
        document.getElementById('ui-eta').innerText = etaStr;

        const prev = [...CORE.route.waypoints].reverse().find(w => w.passed);
        document.getElementById('ui-segment').innerText = (prev && nextWp) ? `${prev.name} ➔ ${nextWp.name}` : (nextWp ? `Naar ${nextWp.name}` : "🏁 Bestemming bereikt");
    },

    fmt(s) { return new Date(s * 1000).toISOString().substr(11, 8); },

    updateTable() {
        document.getElementById('wpList').innerHTML = CORE.route.waypoints.map((w,i) => `
            <tr onclick="APP.readWp(${i})" class="${w.missed?'strikethrough':''}" style="color:${w.passed?'var(--success)':'#333'}">
                <td style="width:30px">${w.passed?'✅':(w.missed?'❌':'⏳')}</td>
                <td><b>${w.name}</b>${w.desc?' <span class="info-badge">i</span>':''}</td>
                <td align="right">${(w.routePos/1000).toFixed(2)}km</td>
            </tr>`).join('');
    }
};

// --- HOOFD APPLICATIE ---
const APP = {
    init() {
        document.getElementById('gpxInput').onchange = (e) => this.loadGPX(e);
    },

    loadGPX(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
            const pts = [...xml.getElementsByTagName('trkpt')];
            if (pts.length < 2) return alert("GPX te kort.");

            CORE.route.track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
            CORE.route.cumDist = [0];
            for (let i=0; i<CORE.route.track.length-1; i++) {
                CORE.route.cumDist[i+1] = CORE.route.cumDist[i] + LOGIC.getDist(CORE.route.track[i].lat, CORE.route.track[i].lon, CORE.route.track[i+1].lat, CORE.route.track[i+1].lon);
            }
            CORE.route.totalDist = CORE.route.cumDist.at(-1);

            let wpts = [...xml.getElementsByTagName('wpt')].map(w => {
                const lat = +w.getAttribute('lat'), lon = +w.getAttribute('lon');
                let bD = Infinity, bP = 0;
                CORE.route.track.forEach((t, idx) => {
                    const d = LOGIC.getDist(lat, lon, t.lat, t.lon);
                    if (d < bD) { bD = d; bP = CORE.route.cumDist[idx]; }
                });
                return { name: w.getElementsByTagName('name')[0]?.textContent || "WP", desc: w.getElementsByTagName('desc')[0]?.textContent || "", lat, lon, routePos: bP, passed: false, missed: false };
            });

            if (!wpts.find(w => w.name === "FINISH")) {
                wpts.push({ name: "FINISH", desc: "Einde", lat: CORE.route.track.at(-1).lat, lon: CORE.route.track.at(-1).lon, routePos: CORE.route.totalDist, passed: false, missed: false });
            }
            CORE.route.waypoints = wpts.sort((a,b) => a.routePos - b.routePos);

            document.getElementById('standby-msg').style.display = 'none';
            document.getElementById('live-ui').style.display = 'block';
            document.getElementById('gpxInput').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'inline-block';
            UI.updateTable();
            UI.update();
        };
        reader.readAsText(e.target.files[0]);
    },

    handleStartPause() {
        if (CORE.session.state === STATES.IDLE) {
            CORE.session.watchId = navigator.geolocation.watchPosition(p => this.gpsHandler(p), e => alert(e.message), { enableHighAccuracy: true });
            CORE.session.state = STATES.RUNNING;
            CORE.session.lastTick = Date.now();
            this.speak("Tracker gestart.");
        } else if (CORE.session.state === STATES.RUNNING) {
            CORE.session.state = STATES.PAUSED;
            this.speak("Pauze.");
        } else if (CORE.session.state === STATES.PAUSED) {
            CORE.session.state = STATES.RUNNING;
            CORE.session.lastTick = Date.now();
            this.speak("Hervat.");
        }
        this.updateButtonUI();
    },

    updateButtonUI() {
        const btn = document.getElementById('startBtn');
        if (CORE.session.state === STATES.RUNNING) {
            btn.innerText = "⏸ PAUZE";
            btn.style.background = "var(--warning)";
        } else {
            btn.innerText = (CORE.session.state === STATES.PAUSED) ? "▶ HERVAT" : "▶ START";
            btn.style.background = "var(--success)";
        }
    },

    handleStop() {
        if (CORE.session.watchId) navigator.geolocation.clearWatch(CORE.session.watchId);
        CORE.session.state = STATES.FINISHED;
        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('resetBtn').style.display = 'inline-block';
        this.speak("Tracker gestopt.");
    },

    handleReset() {
        location.reload(); // De meest veilige reset voor een webapp
    },

    gpsHandler(pos) {
        const now = Date.now();
        let delta = CORE.session.lastTick ? (now - CORE.session.lastTick) / 1000 : 0;
        if (delta > 5) delta = 0;
        CORE.session.lastTick = now;

        const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = pos.coords;
        CORE.session.lastLat = lat; CORE.session.lastLon = lon;

        if (CORE.session.state !== STATES.RUNNING) {
            UI.update(lat, lon, acc, 0, 0, CORE.session.lastRoutePos);
            return;
        }

        const speedKmh = (s || 0) * 3.6;
        const profile = document.getElementById('profile').value;
        const config = CORE.settings[profile];

        // Bewegingsdetectie
        if (speedKmh > 2.5 && acc < 30) {
            CORE.session.moveSeconds += delta;
            if (CORE.session.moveSeconds > 2) {
                CORE.session.movingTime += delta;
                CORE.session.tripDist += (s || 0) * delta;
                CORE.session.steps += (s / config.th) * delta;
                CORE.session.currentMet = LOGIC.getMET(speedKmh, profile);
                CORE.session.kcal += (CORE.session.currentMet * parseFloat(document.getElementById('userWeight').value) * 1.05) / 3600 * delta;
            }
        } else {
            CORE.session.moveSeconds = 0;
            CORE.session.pauseTime += delta;
            CORE.session.currentMet = 1.0;
        }

        // --- LINE PROJECTION ENGINE ---
        let bD = Infinity, bP = 0, bIdx = 0;
        const searchRange = 50;
        const startIdx = Math.max(0, CORE.session.lastTrackIdx - searchRange);
        const endIdx = Math.min(CORE.route.track.length - 1, CORE.session.lastTrackIdx + searchRange);

        for (let i = startIdx; i < endIdx; i++) {
            const proj = LOGIC.getLineProj({lat, lon}, CORE.route.track[i], CORE.route.track[i+1]);
            const d = LOGIC.getDist(lat, lon, proj.lat, proj.lon);
            if (d < bD) {
                bD = d;
                const segLen = CORE.route.cumDist[i+1] - CORE.route.cumDist[i];
                bP = CORE.route.cumDist[i] + (proj.t * segLen);
                bIdx = i;
            }
        }
        CORE.session.lastTrackIdx = bIdx;
        CORE.session.lastRoutePos = bP;

        // Off-route check
        if (bD > 50 && CORE.session.moveSeconds > 2) {
            if (!CORE.session.isOffRoute) {
                CORE.session.isOffRoute = true;
                this.speak("Route afwijking.");
                CORE.session.lastOffRouteSpeakDist = 50;
            }
            let step = Math.floor(bD / 50) * 50;
            if (step > CORE.session.lastOffRouteSpeakDist) {
                this.speak(`${step} meter.`);
                CORE.session.lastOffRouteSpeakDist = step;
            }
        } else if (CORE.session.isOffRoute && bD < 20) {
            CORE.session.isOffRoute = false;
            this.speak("Terug op route.");
        }

        // Waypoints
        CORE.route.waypoints.forEach((w, i) => {
            if (w.passed || w.missed) return;
            const d = LOGIC.getDist(lat, lon, w.lat, w.lon);
            if (d < config.radius || (bP > w.routePos && d < 35)) {
                if (w.name === "FINISH" && bP < CORE.route.totalDist * 0.9) return;
                w.passed = true;
                this.speak(`Punt ${w.name}.`);
                const next = CORE.route.waypoints[i+1];
                if (next) this.speak(`Volgende over ${LOGIC.formatVoiceDist(next.routePos - bP)}.`);
                UI.updateTable();
            } else if (bP > w.routePos + 100) {
                w.missed = true;
                UI.updateTable();
            }
        });

        requestAnimationFrame(() => UI.update(lat, lon, acc, speedKmh, bD, bP));
    },

    readWp(i) {
        const w = CORE.route.waypoints[i];
        this.speak(w.desc ? `Info ${w.name}: ${w.desc}` : `Checkpoint ${w.name}`);
    },

    speak(t) {
        if (!document.getElementById('audioToggle').checked || !t) return;
        if (CORE.speech.lastMsg === t && CORE.speech.queue.length > 0) return;
        CORE.speech.lastMsg = t;
        CORE.speech.queue.push(t);
        if (!CORE.speech.isSpeaking) this.play();
    },

    play() {
        if (CORE.speech.queue.length === 0) { CORE.speech.isSpeaking = false; return; }
        CORE.speech.isSpeaking = true;
        const u = new SpeechSynthesisUtterance(CORE.speech.queue.shift());
        u.lang = 'nl-NL';
        u.onend = () => setTimeout(() => this.play(), 400);
        window.speechSynthesis.speak(u);
    }
};

APP.init();
</script>
</body>
</html>
