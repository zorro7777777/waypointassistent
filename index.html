<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garmin-Style GPX Engine v1</title>
<style>
body{font-family:sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:10px}
.card{max-width:650px;margin:auto;background:#111827;padding:15px;border-radius:14px}
button{padding:12px;width:100%;margin:6px 0;border:0;border-radius:10px;font-weight:bold}
.start{background:#22c55e}
.pause{background:#f59e0b}
.info{background:#000;padding:12px;border-radius:10px;font-family:monospace;min-height:320px}
.small{font-size:12px;color:#94a3b8}
input{width:100%;padding:8px;margin:6px 0}
</style>
</head>
<body>
<div class="card">
<h3>🛰 Garmin-Style Engine v1</h3>

<input type="file" id="gpx" accept=".gpx">
<button class="start" onclick="start()">START GPS</button>
<button class="pause" onclick="pauseToggle()">PAUSE</button>

<div class="info" id="out">Laad GPX...</div>
<div class="small">Segment projection + smoothing + anti-jitter</div>
</div>

<script>
let track=[],cum=[],watch=null;
let last=null,lastT=0;
let speedBuf=[];
let paused=false;

let sport={kcal:0,time:0,last:0};

function dist(a,b,c,d){
const R=6371000;
let x=(c-a)*Math.PI/180;
let y=(d-b)*Math.PI/180;
return 2*R*Math.asin(Math.sqrt(Math.sin(x/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(y/2)**2));
}

function project(p,a,b){
let A=p.lat-a.lat,B=p.lon-a.lon,C=b.lat-a.lat,D=b.lon-a.lon;
let t=(A*C+B*D)/(C*C+D*D);
return Math.max(0,Math.min(1,t));
}

let lastIndex=0;
function getR(lat,lon){
let best=1e9,pos=0;
let s=Math.max(0,lastIndex-10);
let e=Math.min(track.length-2,lastIndex+20);

for(let i=s;i<=e;i++){
let a=track[i],b=track[i+1];
let t=project({lat,lon},a,b);
let pLat=a.lat+(b.lat-a.lat)*t;
let pLon=a.lon+(b.lon-a.lon)*t;
let d=dist(lat,lon,pLat,pLon);
if(d<best){best=d;pos=cum[i]+dist(a.lat,a.lon,pLat,pLon);lastIndex=i;}
}
return {pos,off:best};
}

document.getElementById('gpx').onchange=e=>{
let r=new FileReader();
r.onload=ev=>{
let xml=new DOMParser().parseFromString(ev.target.result,'text/xml');
let pts=[...xml.getElementsByTagName('trkpt')];
track=pts.map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));

cum=[0];
for(let i=0;i<track.length-1;i++){
cum[i+1]=cum[i]+dist(track[i].lat,track[i].lon,track[i+1].lat,track[i+1].lon);
}

document.getElementById('out').innerText='GPX geladen';
};
r.readAsText(e.target.files[0]);
};

function pauseToggle(){paused=!paused;}

function start(){
if(watch||!track.length)return;

watch=navigator.geolocation.watchPosition(p=>{
if(paused)return;

let {latitude:lat,longitude:lon,accuracy:acc}=p.coords;
let now=Date.now();
let dt=lastT?(now-lastT)/1000:0;

let R=getR(lat,lon);

let speed=0;
if(last&&dt>0){
let d=dist(last.lat,last.lon,lat,lon);
if(d<5)d=0; // anti jitter
speed=(d/dt)*3.6;
}

speedBuf.push(speed);
if(speedBuf.length>6)speedBuf.shift();
speed=speedBuf.reduce((a,b)=>a+b,0)/speedBuf.length;

let met=1.6+0.8*speed;
let weight=92;

if(speed>0.8){
sport.time+=dt;
sport.kcal+=(met*3.5*weight/200)*(dt/60);
}

let avg=(R.pos/1000)/(sport.time/3600||1);
let remain=cum.at(-1)-R.pos;
let eta=avg>0.5?remain/(avg/3.6):0;

last={lat,lon};
lastT=now;

// UI

document.getElementById('out').innerHTML=
`POS: ${Math.round(R.pos)} m<br>
OFF: ${Math.round(R.off)} m<br>
SPD: ${speed.toFixed(2)} km/u<br>
AVG: ${avg.toFixed(2)} km/u<br>
KCAL: ${Math.round(sport.kcal)}<br>
ETA: ${eta?Math.round(eta/60)+' min':'--'}<br>
ACC: ${acc} m`;

},null,{enableHighAccuracy:true});
}
</script>
</body>
</html>
