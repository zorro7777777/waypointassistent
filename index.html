<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Engine v87 - Smooth Voice Queue</title>
   <style>
        body { font-family: sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #info { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; margin: 10px 0; min-height: 460px; line-height: 1.3; border-left: 5px solid #27ae60; font-size: 1.1rem; position: relative; }
        .gear-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; cursor: pointer; opacity: 0.7; z-index: 10; }
        .highlight { color: #fff; font-weight: bold; font-size: 1.1rem; }
        .field-yellow { color: #ffff00; font-weight: bold; font-size: 0.95rem; display: block; margin-top: 2px; }
        .field-green { color: #00ff00; font-weight: bold; }
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #dcdde1; display: none; }
        .row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .start { background: #27ae60; flex: 2; } 
        .pause { background: #f39c12; flex: 2; } 
        .toggle-list { background: #3498db; flex: 0.4; }
        #resetBtn { background: #e74c3c; flex: 0.4; display: none; }
        .copy-btn { background: #34495e; padding: 8px; font-size: 0.75rem; margin-top: 10px; border: 1px solid #5d6d7e; width: 100%; color: #bdc3c7; }
        #gpxInput { width:100%; margin-bottom:10px; border:1px solid #ccc; padding:5px; border-radius:5px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        td { padding: 8px 0; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.1rem; margin:0 0 5px 0; color:#2c3e50;">💿 PLATINA ENGINE v87</h1>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:4px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <div style="font-size: 0.8rem;">Gewicht: <input type="number" id="userWeight" style="width:40px" value="92">kg</div>
        </div>
        <label><input type="checkbox" id="audioToggle" checked> 🔊 Spraak</label>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    
    <div class="row">
        <button onclick="handleStartPause()" id="startBtn" class="start">▶ START</button>
        <button onclick="toggleTable()" class="toggle-list">📑</button>
        <button onclick="location.reload()" id="resetBtn">🔄</button>
    </div>
    
    <div id="info">
        <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
        <div id="display-content">Systeem gereed.</div>
    </div>

    <div id="tableCon">
        <div style="font-size:0.75rem; font-weight:bold; padding:8px; background:#dfe6e9; border-radius:5px; text-align:center;" id="wp-summary">Geen route geladen</div>
        <table><tbody id="list"></tbody></table>
    </div>
</div>

<script>
const PROFS = {
    wandelen: { ms: 0.42, max: 7, th: 0.67, radius: 10, unit: "Stappen" },
    fietsen: { ms: 1.95, max: 45, th: 2.10, radius: 20, unit: "Omwentelingen" }
};
let CONFIG = { ...PROFS.wandelen };
let track = [], waypoints = [], cumDist = [], watchId = null, lastPos = null, maxRoutePos = 0, tripDist = 0, finished = false;
let sport = { steps: 0, kcal: 0, movingTime: 0, idleTime: 0, lastTick: null };
let alertTime = 0, isOffRoute = false, isPaused = false;
let lastEtaUpdate = 0, cachedArrival = "--:--";

// VOICE QUEUE LOGIC
let speechQueue = [];
let isSpeaking = false;

function speak(text) {
    if (!document.getElementById('audioToggle').checked) return;
    speechQueue.push(text);
    processQueue();
}

function processQueue() {
    if (isSpeaking || speechQueue.length === 0) return;
    
    isSpeaking = true;
    const msg = new SpeechSynthesisUtterance(speechQueue.shift());
    msg.lang = 'nl-NL';
    
    msg.onend = () => {
        // Wacht 2000ms na het einde van de zin voor de volgende start
        setTimeout(() => {
            isSpeaking = false;
            processQueue();
        }, 2000);
    };
    
    window.speechSynthesis.speak(msg);
}

function fmtT(s) {
    if (!isFinite(s) || s < 0) return "00:00:00";
    const h = Math.floor(s / 3600).toString().padStart(2, '0');
    const m = Math.floor((s % 3600) / 60).toString().padStart(2, '0');
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return `${h}:${m}:${sec}`;
}

function getDist(a,b,c,d){
    const R=6371000, rL=(c-a)*Math.PI/180, rO=(d-b)*Math.PI/180;
    return 2*R*Math.asin(Math.sqrt(Math.sin(rL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(rO/2)**2));
}

function getRInfo(lat, lon) {
    let bD = Infinity, bP = 0;
    track.forEach((t, i) => {
        const d = getDist(lat, lon, t.lat, t.lon);
        if (d < bD) { bD = d; bP = cumDist[i]; }
    });
    return { pos: bP, off: bD };
}

function toggleConfig() {
    const el = document.getElementById('configArea');
    const reset = document.getElementById('resetBtn');
    const isHidden = (el.style.display === 'none' || el.style.display === '');
    el.style.display = isHidden ? 'block' : 'none';
    reset.style.display = isHidden ? 'block' : 'none';
}

function toggleTable() {
    const el = document.getElementById('tableCon');
    el.style.display = (el.style.display === 'none') ? 'block' : 'none';
}

document.getElementById('gpxInput').onchange = e => {
    const r = new FileReader();
    r.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        const pts = [...xml.getElementsByTagName('trkpt')];
        track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        cumDist = [0];
        for(let i=0; i<track.length-1; i++) {
            cumDist[i+1] = cumDist[i] + getDist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
        }
        let tempWps = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "Punt",
            lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'),
            passed: false, missed: false, touched: false
        }));
        tempWps.push({ name: "START", lat: track[0].lat, lon: track[0].lon, passed: false, missed: false, touched: false });
        tempWps.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, passed: false, missed: false, touched: false });
        waypoints = tempWps.map(w => {
            w.routePos = getRInfo(w.lat, w.lon).pos;
            return w;
        }).sort((a,b) => a.routePos - b.routePos);
        updateWPUI();
        
        const totalKm = (cumDist.at(-1) / 1000).toFixed(1);
        speak(`Route geladen.`);
        speak(`${waypoints.length} punten over ${totalKm} kilometer.`);
        document.getElementById('display-content').innerText = "Route geladen. Klik op START.";
    };
    r.readAsText(e.target.files[0]);
};

function updateWPUI() {
    const p = waypoints.filter(w => w.passed).length;
    const m = waypoints.filter(w => w.missed).length;
    document.getElementById('wp-summary').innerText = `✅ ${p} | ❌ ${m} | ⏳ ${waypoints.length - p - m}`;
    document.getElementById('list').innerHTML = waypoints.map(w => `
        <tr style="${w.passed ? 'color:#27ae60; font-weight:bold;' : (w.missed ? 'color:#e74c3c;text-decoration:line-through;' : '')}">
            <td style="width:25px">${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td>
            <td>${w.name}</td>
            <td style="text-align:right">${Math.round(w.routePos)}m</td>
        </tr>`).join('');
}

function handleStartPause() {
    const btn = document.getElementById('startBtn');
    if (!watchId) {
        startGPS();
        btn.innerText = "⏸ PAUZE"; btn.className = "pause";
        speak("Systeem actief. Goede reis.");
    } else {
        isPaused = !isPaused;
        if (isPaused) {
            btn.innerText = "▶ HERVAT"; btn.className = "start";
            speak("Pauze.");
            sport.lastTick = null;
        } else {
            btn.innerText = "⏸ PAUZE"; btn.className = "pause";
            speak("Hervatting.");
            sport.lastTick = Date.now();
        }
    }
}

function startGPS() {
    if (watchId || !track.length) return;
    document.getElementById('gpxInput').style.display = 'none';
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen');

    watchId = navigator.geolocation.watchPosition(p => {
        if (finished || isPaused) return;
        const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = p.coords;
        const skmh = (s || 0) * 3.6, now = Date.now(), dt = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;
        const R = getRInfo(lat, lon);
        if (R.pos > maxRoutePos) maxRoutePos = R.pos;

        if (R.off > 55 && now - alertTime > 25000) { 
            speak(Math.round(R.off) + " meter van route."); 
            alertTime = now; isOffRoute = true; 
        } else if (isOffRoute && R.off < 8) { 
            speak("Terug op route."); isOffRoute = false; 
        }

        const isM = skmh >= (CONFIG.ms * 3.6) && skmh <= CONFIG.max;
        const weight = parseFloat(document.getElementById('userWeight').value) || 92;
        const metVal = document.getElementById('profile').value === 'wandelen' ? (0.75 * skmh + 0.5) : (0.4 * skmh);

        if (isM) {
            sport.movingTime += dt;
            sport.steps += ((skmh/3.6 * dt) / CONFIG.th);
            sport.kcal += (metVal * 3.5 * weight / 200) * (dt / 60);
            if (lastPos && acc < 25) tripDist += getDist(lastPos.lat, lastPos.lon, lat, lon);
            lastPos = { lat, lon };
        } else if (sport.lastTick) { sport.idleTime += dt; }

        waypoints.forEach((w, i) => {
            if (w.passed || w.missed) return;
            if (getDist(lat, lon, w.lat, w.lon) <= CONFIG.radius) w.touched = true;
            if (R.pos >= w.routePos - CONFIG.radius && w.touched) {
                w.passed = true;
                if (i === waypoints.length - 1) { 
                    finished = true; speak("Bestemming bereikt."); navigator.geolocation.clearWatch(watchId); 
                } else { 
                    speak(w.name); 
                    const next = waypoints.find(nw => !nw.passed && !nw.missed);
                    if(next) speak("Ga naar " + next.name);
                }
                updateWPUI();
            } else if (maxRoutePos > w.routePos + CONFIG.radius + acc + 12) {
                w.missed = true;
                speak(w.name + " gemist."); updateWPUI();
            }
        });

        const next = waypoints.find(w => !w.passed && !w.missed);
        const avgV = R.pos > 25 ? (R.pos / 1000) / (sport.movingTime / 3600) : 0;
        
        if (now - lastEtaUpdate > 60000 || cachedArrival === "--:--") {
            const remainingDist = cumDist.at(-1) - R.pos;
            if (avgV > 0.5) {
                const arrivalDate = new Date(now + (remainingDist / (avgV / 3.6)) * 1000);
                cachedArrival = arrivalDate.getHours().toString().padStart(2, '0') + ":" + arrivalDate.getMinutes().toString().padStart(2, '0');
            }
            lastEtaUpdate = now;
        }

        document.getElementById('display-content').innerHTML = `
            <b style="color:#ffff00">VOLGEND:</b><br>
            <span class="highlight" style="font-size:1.5rem; color:#00ff00;">${finished ? 'FINISH' : (next ? next.name : '---')}</span><br>
            <b>AFSTAND:</b> <span class="highlight">${(next && !finished) ? Math.max(0, Math.round(next.routePos - R.pos)) : 0}m</span><br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>${CONFIG.unit.toUpperCase()}:</b> <span class="field-green">${Math.round(sport.steps)}</span> (Cad: ${Math.round(isM ? ((skmh/3.6)/CONFIG.th*60) : 0)})<br>
            <b>TRIP:</b> <span class="field-green">${(tripDist/1000).toFixed(3)} km</span><br>
            <b>TIJD:</b> <span class="field-green">${fmtT(sport.movingTime)}</span><br>
            <b>AANKOMST:</b> <span class="field-green">${finished ? 'BEREIKT' : cachedArrival}</span><br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>SPD:</b> ${skmh.toFixed(1)} km/u<br>
            <b>AVG:</b> ${avgV.toFixed(2)} km/u<br>
            <b>ENERGIE:</b> ${Math.round(sport.kcal)} kcal<br>
            <b>POWER:</b> ${metVal.toFixed(1)} MET<br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>OFF-TRACK:</b> <span style="color:${R.off > 50 ? '#e74c3c' : '#00ff00'}">${Math.round(R.off)}m</span><br>
            <b>ACCURACY:</b> ${acc.toFixed(0)}m<br>
            <span class="field-yellow">LAT: ${lat.toFixed(6)}</span>
            <span class="field-yellow">LON: ${lon.toFixed(6)}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${lat.toFixed(6)},${lon.toFixed(6)}')">📍 KOPIEER COÖRDINATEN</button>
        `;
        sport.lastTick = now;
    }, null, { enableHighAccuracy: true });
}

function updateProfile() {
    const val = document.getElementById('profile').value;
    CONFIG = { ...PROFS[val] };
    speak(`Profiel ingesteld op ${val}.`);
}
</script>
</body>
</html>
