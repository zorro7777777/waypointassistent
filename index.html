<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO - V4.6</title>

    <style>
        :root {
            --bg-dark: #1a1a1a;
            --accent: #00bfff;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --text-main: #2c3e50;
        }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            padding: 5px;
            background: #f0f3f5;
            color: var(--text-main);
            font-size: 13px;
            margin: 0;
        }

        .card {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        #console {
            background: var(--bg-dark);
            color: #00ff00;
            padding: 12px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            margin: 10px 0;
            border-left: 5px solid var(--success);
            min-height: 100px;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            text-align: center;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-value {
            color: var(--accent);
            font-weight: 900;
            font-size: 1.8rem;
            display: block;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #7f8c8d;
            text-transform: uppercase;
        }

        .config-section {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: none;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 10px;
        }

        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            flex: 1;
        }

        .btn-start { background: var(--success); flex: 2; }
        .btn-blue { background: var(--accent); flex: 0.5; }
        .btn-red { background: var(--danger); flex: 0.5; }

        hr {
            border: 0;
            border-top: 1px solid #444;
            margin: 8px 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        td {
            padding: 10px 4px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .strikethrough {
            text-decoration: line-through;
            opacity: 0.5;
            color: var(--danger);
        }

        .info-badge {
            background: var(--accent);
            color: white;
            font-size: 0.6rem;
            padding: 2px 5px;
            border-radius: 50%;
            margin-left: 5px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom:10px;">
        <h2 style="margin:0; font-size:1.1rem;">
            WAYPOINTASSISTENT <span style="color:var(--accent)">PRO V4.6</span>
        </h2>
        <span onclick="UI.toggleConfig()" style="cursor:pointer; font-size: 1.2rem;">⚙️</span>
    </div>

    <div id="configArea" class="config-section">

        <div class="row">
            <select id="profile" onchange="UI.updateProfile()" style="padding:8px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>

            <input type="number" id="userWeight" style="width:50px; padding:5px;" value="92"> kg
        </div>

        <label>
            <input type="checkbox" id="audioToggle" checked>
            Spraakassistent (NL)
        </label>

        <hr>

        <input type="file" id="gpxInput" accept=".gpx" style="width:100%;">
    </div>

    <div class="stat-grid">
        <div>
            <span class="stat-label">Off-Route</span>
            <span id="ui-off-big" class="stat-value">0m</span>
        </div>

        <div>
            <span class="stat-label">KM/U</span>
            <span id="ui-speed-big" class="stat-value">0.0</span>
        </div>

        <div>
            <span class="stat-label">GPS Acc</span>
            <span id="ui-acc-big" class="stat-value">0m</span>
        </div>
    </div>

    <div style="background:#e8f4fd; padding:10px; border-radius:8px; border-left:4px solid var(--accent); margin-bottom:10px;">
        <div style="display:flex; justify-content:space-between;">
            <span class="stat-label">Traject:</span>
            <span id="ui-total-len" style="font-size:0.75rem; font-weight:bold; color:var(--success);">
                Afstand: --
            </span>
        </div>

        <span id="ui-segment" style="font-weight:bold; font-size:0.95rem;">
            Wacht op GPX...
        </span>
    </div>

    <div class="row">
        <button id="startBtn" onclick="APP.handleStartPause()" class="btn-start">▶ START</button>
        <button onclick="UI.toggleTable()" class="btn-blue">📑</button>
        <button id="stopBtn" onclick="APP.stop()" class="btn-red" style="display:none;">⏹ STOP</button>
        <button id="resetBtn" onclick="APP.reset()" class="btn-red" style="display:none;">🔄</button>
    </div>

    <div id="console">

        <div id="standby-msg" style="text-align:center; padding:20px;">
            Laad een GPX bestand om te beginnen.
        </div>

        <div id="live-ui" style="display:none;">

            <div style="display:flex; justify-content:space-between;">
                <span>WP: <span id="ui-next-wp">---</span></span>
                <span id="ui-dist" style="color:var(--accent); font-weight:bold;">0m</span>
            </div>

            <hr>

            <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; font-size:0.8rem;">
                <div>TRIP: <span id="ui-trip">0.000 km</span></div>
                <div>ETA: <span id="ui-eta">--:--</span></div>
                <div>MOVE: <span id="ui-mov-time">00:00:00</span></div>
                <div>PAUZE: <span id="ui-pau-time">00:00:00</span></div>
                <div>KCAL: <span id="ui-kcal">0</span></div>
                <div>MET: <span id="ui-met">1.0</span></div>
                <div>AVG KM/U: <span id="ui-avg-speed">0.0</span></div>
                <div><span id="ui-count-label">STAPPEN</span>: <span id="ui-steps">0</span></div>
            </div>

        </div>
    </div>

    <div id="tableCon" style="display:none;">
        <table id="wpList"></table>
    </div>

</div>

<script>
const CORE = {
    settings: {
        wandelen: { ms: 0.36, th: 0.67, radius: 20, label: "STAPPEN" },
        fietsen:  { ms: 5.5, th: 2.10, radius: 35, label: "OMWENTELINGEN" }
    },
    met_table: {
        wandelen: [
            {max: 1.5, met: 1.0},
            {max: 4.0, met: 3.0},
            {max: 5.5, met: 3.5},
            {max: Infinity, met: 4.5}
        ],
        fietsen: [
            {max: 1.5, met: 1.0},
            {max: 15, met: 5.0},
            {max: 20, met: 6.5},
            {max: Infinity, met: 8.0}
        ]
    },
    route: { track: [], waypoints: [], cumDist: [], totalDist: 0 },
    session: {
        isStarted: false,
        isPaused: false,
        isOffRoute: false,
        finished: false,
        lastTrackIdx: 0,
        tripDist: 0,
        movingTime: 0,
        pauseTime: 0,
        kcal: 0,
        steps: 0,
        lastTick: null,
        watchId: null,
        currentMet: 1.0,
        lastOffRouteSpeakDist: 0,
        moveSeconds: 0
    },
    speech: { queue: [], isSpeaking: false, lastMsg: "" }
};

const LOGIC = {
    getDist(lat1, lon1, lat2, lon2) {
        const R = 6371000;
        const toRad = Math.PI / 180;

        const dLat = (lat2 - lat1) * toRad;
        const dLon = (lon2 - lon1) * toRad;

        const lat1r = lat1 * toRad;
        const lat2r = lat2 * toRad;

        const a =
            Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1r) * Math.cos(lat2r) *
            Math.sin(dLon / 2) ** 2;

        return 2 * R * Math.asin(Math.sqrt(a));
    },

    getMET(speed, profile) {
        const table = CORE.met_table[profile];
        for (const entry of table) {
            if (speed <= entry.max) return entry.met;
        }
        return 1.0;
    },

    formatVoiceDist(meters) {
        return meters < 1000
            ? `${Math.round(meters)} meter`
            : `${(meters / 1000).toFixed(1)} kilometer`.replace('.', ',');
    }
};

const UI = {
    update(lat = 0, lon = 0, acc = 0, speed = 0, offRoute = 0, posOnRoute = 0) {

        const nextWp = CORE.route.waypoints.find(w => !w.passed && !w.missed);

        const avgSpeed = CORE.session.movingTime > 2
            ? (CORE.session.tripDist / CORE.session.movingTime) * 3.6
            : 0;

        const profileEl = document.getElementById('profile');
        const profile = profileEl ? profileEl.value : "wandelen";
        const config = CORE.settings[profile];

        const set = (id, val) => {
            const el = document.getElementById(id);
            if (el) el.innerText = val;
        };

        const setColor = (id, cond, color) => {
            const el = document.getElementById(id);
            if (el) el.style.color = cond ? color : 'var(--accent)';
        };

        set('ui-total-len', `Track: ${(CORE.route.totalDist / 1000 || 0).toFixed(2)} km`);

        set('ui-off-big', Math.round(offRoute || 0) + "m");
        setColor('ui-off-big', (offRoute || 0) > 45, 'var(--danger)');

        set('ui-speed-big', (speed || 0).toFixed(1));
        set('ui-acc-big', Math.round(acc || 0) + "m");

        set('ui-next-wp', nextWp ? nextWp.name : "FINISH");

        set('ui-dist',
            nextWp
                ? Math.max(0, Math.round((nextWp.routePos || 0) - (posOnRoute || 0))) + "m"
                : "0m"
        );

        set('ui-trip', ((CORE.session.tripDist || 0) / 1000).toFixed(3) + " km");

        set('ui-mov-time', this.fmt(CORE.session.movingTime || 0));
        set('ui-pau-time', this.fmt(CORE.session.pauseTime || 0));

        set('ui-kcal', Math.round(CORE.session.kcal || 0));
        set('ui-met', (CORE.session.currentMet || 1).toFixed(1));

        set('ui-avg-speed', avgSpeed.toFixed(1));
        set('ui-steps', Math.floor(CORE.session.steps || 0));

        set('ui-count-label', config?.label || "");
    },

    fmt(s) {
        return new Date((s || 0) * 1000).toISOString().substr(11, 8);
    },

    toggleConfig() {
        const el = document.getElementById('configArea');
        if (!el) return;

        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    },

updateProfile() {
    const profile = document.getElementById('profile')?.value;
    if (!profile) return;
}

    updateTable() {
        const el = document.getElementById('wpList');
        if (!el) return;

        el.innerHTML = CORE.route.waypoints.map((w, i) => `
            <tr onclick="APP.readWp(${i})"
                class="${w.missed ? 'strikethrough' : ''}"
                style="color:${w.passed ? 'var(--success)' : '#333'}">

                <td>${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td>
                <td><b>${w.name}</b></td>
                <td align="right">${(w.routePos / 1000).toFixed(2)}km</td>
            </tr>
        `).join('');
    }
};

const APP = {

    init() {
        document.getElementById('gpxInput').onchange = e => this.loadGPX(e);
    },

    loadGPX(e) {
        const reader = new FileReader();

        reader.onload = ev => {
            const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
            const pts = [...xml.getElementsByTagName('trkpt')];

            if (pts.length < 2) return alert("Foutieve GPX.");

            CORE.route.track = pts.map(p => ({
                lat: +p.getAttribute('lat'),
                lon: +p.getAttribute('lon')
            }));

            CORE.route.cumDist = [0];

            for (let i=0; i<CORE.route.track.length-1; i++) {
                CORE.route.cumDist[i+1] =
                    CORE.route.cumDist[i] +
                    LOGIC.getDist(
                        CORE.route.track[i].lat,
                        CORE.route.track[i].lon,
                        CORE.route.track[i+1].lat,
                        CORE.route.track[i+1].lon
                    );
            }

            CORE.route.totalDist = CORE.route.cumDist.at(-1);

            document.getElementById('standby-msg').style.display = 'none';
            document.getElementById('live-ui').style.display = 'block';
        };

        reader.readAsText(e.target.files[0]);
    },

    handleStartPause() {
        if (!CORE.session.watchId) {

            document.getElementById('stopBtn').style.display = "inline-block";

            CORE.session.watchId = navigator.geolocation.watchPosition(
                p => this.gpsHandler(p),
                e => alert(e.message),
                { enableHighAccuracy: true }
            );

        } else {
            CORE.session.isPaused = !CORE.session.isPaused;
        }

        CORE.session.lastTick = Date.now();
    },

    gpsHandler(pos) {
        const now = Date.now();
        const delta = CORE.session.lastTick ? (now - CORE.session.lastTick)/1000 : 0;
        CORE.session.lastTick = now;

        if (CORE.session.isPaused || CORE.session.finished) return;

        const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = pos.coords;
        const speedKmh = (s || 0) * 3.6;

        UI.update(lat, lon, acc, speedKmh, 0, 0);
    },

    readWp(i) {
        const w = CORE.route.waypoints[i];
        this.speak(w?.name || "Geen info");
    },

    speak(t) {
        if (!t) return;
        CORE.speech.queue.push(t);
        if (!CORE.speech.isSpeaking) this.play();
    },

    play() {
        if (CORE.speech.queue.length === 0) {
            CORE.speech.isSpeaking = false;
            return;
        }

        CORE.speech.isSpeaking = true;

        const u = new SpeechSynthesisUtterance(CORE.speech.queue.shift());
        u.lang = "nl-NL";
        u.onend = () => setTimeout(() => this.play(), 400);

        speechSynthesis.speak(u);
    },

    stop() {
        if (!CORE.session.watchId) return;

        navigator.geolocation.clearWatch(CORE.session.watchId);
        CORE.session.watchId = null;

        CORE.session.finished = true;
        CORE.session.isPaused = true;

        speechSynthesis.cancel();
        CORE.speech.queue = [];

        document.getElementById('stopBtn').style.display = "none";
    }
};

APP.init();
</script>
</body>
</html>
