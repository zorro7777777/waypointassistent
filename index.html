<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Waypointassistent PRO (Optimized)</title>

<style>
body { font-family: sans-serif; background:#f0f3f5; padding:10px; }
.card { max-width:500px; margin:auto; background:white; padding:12px; border-radius:10px; }

button { padding:10px; margin-top:5px; width:100%; border:none; border-radius:8px; }
.start { background:#27ae60; color:white; }
.pause { background:#f39c12; color:white; }

#info { background:#111; color:#0f0; padding:10px; border-radius:8px; margin-top:10px; font-family:monospace; }
.big { font-size:2rem; font-weight:bold; }
</style>
</head>

<body>

<div class="card">
<h3>Waypointassistent PRO ⚡</h3>

<input type="file" id="gpxInput" accept=".gpx">

<button id="startBtn" class="start">START</button>

<div id="info">
<div>OFF ROUTE: <span id="off" class="big">0m</span></div>
<div>SNELHEID: <span id="speed" class="big">0</span> km/u</div>
<div>TRIP: <span id="trip">0 km</span></div>
<div>ETA: <span id="eta">--:--</span></div>
</div>
</div>

<script>
/* ================================
   PERFORMANCE CONFIG
================================ */
const CONFIG = {
    simplifyDist: 5,
    gpsInterval: 1000,
    uiInterval: 500
};

/* ================================
   GLOBALS
================================ */
let track = [], cumDist = [];
let waypoints = [];
let lastTrackIndex = 0;

let watchId = null;
let lastPos = null;
let tripDist = 0;
let smoothSpeed = 0;

let lastProcessTime = 0;
let lastUIUpdate = 0;

/* ================================
   HELPERS
================================ */
function toRad(v){ return v * Math.PI/180; }

function getDistFast(a,b){
    const R=6371000;
    const dLat=b.latRad-a.latRad;
    const dLon=b.lonRad-a.lonRad;

    const x=Math.sin(dLat/2)**2 +
        Math.cos(a.latRad)*Math.cos(b.latRad)*
        Math.sin(dLon/2)**2;

    return 2*R*Math.asin(Math.sqrt(x));
}

function simplifyTrack(points, minDist){
    if(points.length<2) return points;

    const res=[points[0]];
    let last=points[0];

    for(let i=1;i<points.length;i++){
        if(getDistFast(last,points[i])>minDist){
            res.push(points[i]);
            last=points[i];
        }
    }
    return res;
}

function enrichTrack(points){
    return points.map(p=>({
        lat:p.lat,
        lon:p.lon,
        latRad:toRad(p.lat),
        lonRad:toRad(p.lon)
    }));
}

/* ================================
   GPX LOAD
================================ */
document.getElementById('gpxInput').onchange = e=>{
    const r=new FileReader();
    r.onload=ev=>{
        const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

        let raw=[...xml.getElementsByTagName('trkpt')].map(p=>({
            lat:+p.getAttribute('lat'),
            lon:+p.getAttribute('lon')
        }));

        raw = enrichTrack(raw);
        raw = simplifyTrack(raw, CONFIG.simplifyDist);
        track = raw;

        // cum dist
        cumDist=[0];
        for(let i=1;i<track.length;i++){
            cumDist[i]=cumDist[i-1]+getDistFast(track[i-1],track[i]);
        }

        alert("GPX geladen: "+track.length+" punten");
    };
    r.readAsText(e.target.files[0]);
};

/* ================================
   ROUTE MATCH (FAST)
================================ */
function getRInfo(lat,lon){
    if(!track.length) return {pos:0,off:0};

    const cur={
        latRad:toRad(lat),
        lonRad:toRad(lon)
    };

    let bestDist=Infinity;
    let bestIdx=lastTrackIndex;

    const range=Math.max(30,Math.floor(smoothSpeed*8));

    let start=Math.max(0,lastTrackIndex-range);
    let end=Math.min(track.length,lastTrackIndex+range);

    // coarse
    for(let i=start;i<end;i+=3){
        const d=getDistFast(cur,track[i]);
        if(d<bestDist){
            bestDist=d;
            bestIdx=i;
        }
    }

    // refine
    start=Math.max(0,bestIdx-5);
    end=Math.min(track.length,bestIdx+5);

    for(let i=start;i<end;i++){
        const d=getDistFast(cur,track[i]);
        if(d<bestDist){
            bestDist=d;
            bestIdx=i;
        }
    }

    lastTrackIndex=bestIdx;

    return {
        pos:cumDist[bestIdx],
        off:bestDist
    };
}

/* ================================
   GPS CONTROL
================================ */
function shouldProcess(){
    const now=Date.now();
    if(now-lastProcessTime>CONFIG.gpsInterval){
        lastProcessTime=now;
        return true;
    }
    return false;
}

function safeUI(update){
    const now=Date.now();
    if(now-lastUIUpdate>CONFIG.uiInterval){
        update();
        lastUIUpdate=now;
    }
}

/* ================================
   START
================================ */
document.getElementById('startBtn').onclick=()=>{
    if(!track.length) return alert("Laad GPX");

    if(!watchId){
        watchId=navigator.geolocation.watchPosition(onGPS);
    }
};

/* ================================
   GPS LOOP
================================ */
function onGPS(p){
    if(!shouldProcess()) return;

    const lat=p.coords.latitude;
    const lon=p.coords.longitude;
    const acc=p.coords.accuracy;
    const speed=(p.coords.speed||0)*3.6;

    if(acc>40) return;

    const R=getRInfo(lat,lon);

    if(lastPos){
        const d=getDistFast(
            {latRad:toRad(lastPos.lat), lonRad:toRad(lastPos.lon)},
            {latRad:toRad(lat), lonRad:toRad(lon)}
        );
        if(speed>1.5) tripDist+=d;
    }

    smoothSpeed=smoothSpeed*0.8 + speed*0.2;

    const remaining=(cumDist.at(-1)||0)-R.pos;
    const etaSec=remaining/(smoothSpeed/3.6 || 1);

    safeUI(()=>{
        document.getElementById('off').innerText=Math.round(R.off)+"m";
        document.getElementById('speed').innerText=speed.toFixed(1);
        document.getElementById('trip').innerText=(tripDist/1000).toFixed(2)+" km";

        const eta=new Date(Date.now()+etaSec*1000)
            .toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
        document.getElementById('eta').innerText=eta;
    });

    lastPos={lat,lon};
}
</script>

</body>
</html>
