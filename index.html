<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Engine v90 - Final Diamond</title>
    <style>
        :root { --bg: #f4f7f6; --dark: #1a1a1a; --accent: #00ff00; --panel: #2d3436; --green: #00b894; --red: #d63031; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #2d3436; }
        .card { max-width: 500px; margin: auto; background: white; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow: hidden; }
        .stats-bar { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--panel); color: white; padding: 10px; gap: 5px; }
        .stat { text-align: center; }
        .stat-l { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; display: block; }
        .stat-v { font-weight: bold; font-size: 1rem; }
        #console { background: var(--dark); color: var(--accent); padding: 20px; font-family: 'Courier New', monospace; min-height: 200px; position: relative; border-bottom: 4px solid var(--green); }
        .gear { position: absolute; top: 10px; right: 10px; cursor: pointer; font-size: 1.4rem; opacity: 0.6; }
        .p10 { padding: 15px; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; flex: 1; transition: 0.2s; }
        .btn-main { background: var(--green); color: white; }
        .btn-stop { background: var(--panel); color: white; display: none; }
        .btn-reset { background: #fab1a0; color: var(--red); }
        #config { background: #dfe6e9; padding: 15px; display: none; border-radius: 8px; margin-bottom: 10px; }
        .wp-item { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 0.8rem; border-radius: 4px; }
        .passed { color: var(--green); font-weight: bold; background: #e6fffb; }
        .missed { color: var(--red); text-decoration: line-through; background: #fff1f0; }
    </style>
</head>
<body>

<div class="card">
    <div class="stats-bar">
        <div class="stat"><span class="stat-l" id="unit-label">Steps</span><span class="stat-v" id="v-steps">0</span></div>
        <div class="stat"><span class="stat-l">KM/H</span><span class="stat-v" id="v-speed">0.0</span></div>
        <div class="stat"><span class="stat-l">KCAL</span><span class="stat-v" id="v-kcal">0</span></div>
        <div class="stat"><span class="stat-l">TRIP</span><span class="stat-v" id="v-trip">0.00</span></div>
    </div>

    <div id="console">
        <div class="gear" onclick="UI.toggleConfig()">⚙️</div>
        <div id="display">Klaar voor start...</div>
    </div>

    <div class="p10">
        <div id="config">
            <select id="p-select" onchange="UI.updateProfile()" style="width:100%; padding:10px; margin-bottom:10px;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <label><input type="checkbox" id="audio-on" checked> Audio Feedback</label>
        </div>

        <input type="file" id="file-in" accept=".gpx" style="width:100%; margin-bottom:10px;">
        
        <div class="btn-row">
            <button class="btn-main" id="btn-start" onclick="Controller.start()">START</button>
            <button class="btn-stop" id="btn-stop" onclick="Controller.stop()">STOP</button>
            <button class="btn-reset" onclick="location.reload()">RESET</button>
        </div>

        <div id="wp-list" style="margin-top:20px;"></div>
    </div>
</div>

<script>
/** * CONFIGURATION & CONSTANTS 
 */
const DOMAIN_RULES = {
    WP_RADIUS: 20,
    WP_MISS_THRESHOLD: 35,
    OFF_ROUTE_LIMIT: 60,
    MIN_MOVING_SPEED: 0.8, // m/s
    WEIGHT_KG: 85
};

/**
 * LAYER 1: AUDIO SERVICE (Infrastructure)
 */
const AudioService = {
    speak(text) {
        if (!document.getElementById('audio-on').checked) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'nl-NL';
        window.speechSynthesis.speak(msg);
    }
};

/**
 * LAYER 2: MOVEMENT ENGINE (Pure logic for stats)
 */
const MovementEngine = {
    calculateSteps(dist, stride) { return dist / stride; },
    calculateKcal(dt, met) {
        return ((met * 3.5 * DOMAIN_RULES.WEIGHT_KG) / 12000) * dt;
    }
};

/**
 * LAYER 3: GPX ENGINE (Pure logic for route)
 */
const GpxEngine = {
    calcDist(p1, p2) {
        const R = 6371000;
        const dLat = (p2.lat - p1.lat) * Math.PI / 180;
        const dLon = (p2.lon - p1.lon) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(p1.lat*Math.PI/180)*Math.cos(p2.lat*Math.PI/180)*Math.sin(dLon/2)**2;
        return 2 * R * Math.asin(Math.sqrt(a));
    },

    findNearest(pos, track, cumDist, lastIdx) {
        let best = { dist: Infinity, idx: lastIdx };
        const win = 100;
        const start = Math.max(0, lastIdx - win);
        const end = Math.min(track.length, lastIdx + win);
        
        for (let i = (lastIdx === 0 ? 0 : start); i < (lastIdx === 0 ? track.length : end); i++) {
            const d = this.calcDist(pos, track[i]);
            if (d < best.dist) best = { dist: d, idx: i };
        }
        return { ...best, pos: cumDist[best.idx] };
    }
};

/**
 * LAYER 4: UI CONTROLLER (Presentation)
 */
const UI = {
    dom: {},
    init() {
        const ids = ['v-steps','v-speed','v-kcal','v-trip','display','wp-list','unit-label','p-select','btn-start','btn-stop','file-in'];
        ids.forEach(id => this.dom[id] = document.getElementById(id));
    },
    renderStats(s) {
        this.dom['v-steps'].innerText = Math.round(s.steps);
        this.dom['v-speed'].innerText = s.speed.toFixed(1);
        this.dom['v-trip'].innerText = (s.trip/1000).toFixed(2);
        this.dom['v-kcal'].innerText = Math.round(s.kcal);
    },
    renderConsole(nextWp, dist, offRoute, acc) {
        this.dom['display'].innerHTML = `
            <div style="color:var(--green); font-size:0.7rem;">DOEL: ${nextWp ? nextWp.name : 'FINISH'}</div>
            <div style="font-size:1.8rem; font-weight:bold;">${nextWp ? Math.round(dist) + 'm' : '0m'}</div>
            <div style="margin-top:10px; font-size:0.75rem; color:#888;">
                AFWIJKING: <span style="color:${offRoute > DOMAIN_RULES.OFF_ROUTE_LIMIT ? 'red' : 'var(--green)'}">${Math.round(offRoute)}m</span> | GPS: ${Math.round(acc)}m
            </div>
        `;
    },
    renderWpList(waypoints) {
        this.dom['wp-list'].innerHTML = waypoints.map(w => `
            <div class="wp-item ${w.status}">
                <span>${w.status === 'passed' ? '✅' : (w.status === 'missed' ? '❌' : '⏳')} ${w.name}</span>
                <span>${Math.round(w.routePos)}m</span>
            </div>
        `).join('');
    },
    toggleConfig() {
        const c = document.getElementById('config');
        c.style.display = c.style.display === 'block' ? 'none' : 'block';
    },
    updateProfile() {
        const p = this.dom['p-select'].value;
        this.dom['unit-label'].innerText = p === 'wandelen' ? 'Stappen' : 'Omw.';
    }
};

/**
 * LAYER 5: CONTROLLER (Orchestrator)
 */
const Controller = {
    data: { track: [], waypoints: [], cumDist: [] },
    state: { 
        active: false, watchId: null, lastTrackIdx: 0, currentWpIdx: 0, maxDist: 0,
        steps: 0, speed: 0, kcal: 0, trip: 0, lastTick: null 
    },
    profiles: {
        wandelen: { met: 3.5, stride: 0.75 },
        fietsen: { met: 8.0, stride: 2.10 }
    },

    init() {
        UI.init();
        UI.dom['file-in'].onchange = (e) => this.handleFile(e);
    },

    handleFile(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
            const pts = [...xml.getElementsByTagName('trkpt')].map(p => ({lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon')}));
            
            // Build CumDist
            this.data.cumDist = [0];
            for(let i=0; i<pts.length-1; i++) {
                this.data.cumDist[i+1] = this.data.cumDist[i] + GpxEngine.calcDist(pts[i], pts[i+1]);
            }
            this.data.track = pts;

            // Build Waypoints
            const wpts = [...xml.getElementsByTagName('wpt')].map(w => ({
                name: w.getElementsByTagName('name')[0]?.textContent || "WP",
                lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'),
                status: 'pending'
            })).map(w => {
                w.routePos = GpxEngine.findNearest(w, this.data.track, this.data.cumDist, 0).pos;
                return w;
            }).sort((a,b) => a.routePos - b.routePos);
            
            wpts.push({name: "FINISH", lat: pts.at(-1).lat, lon: pts.at(-1).lon, status: 'pending', routePos: this.data.cumDist.at(-1)});
            this.data.waypoints = wpts;

            UI.renderWpList(this.data.waypoints);
            UI.dom['display'].innerText = "Bestand OK. Ready.";
            AudioService.speak("Route geladen.");
        };
        reader.readAsText(e.target.files[0]);
    },

    start() {
        if (this.state.active || !this.data.track.length) return;
        this.state.active = true;
        UI.dom['btn-start'].style.display = 'none';
        UI.dom['btn-stop'].style.display = 'block';
        UI.dom['file-in'].style.display = 'none';
        
        this.state.watchId = navigator.geolocation.watchPosition(
            (p) => this.tick(p), 
            (err) => console.error(err), 
            {enableHighAccuracy:true}
        );
        AudioService.speak("Start.");
    },

    stop() {
        if (this.state.watchId) navigator.geolocation.clearWatch(this.state.watchId);
        this.state.active = false;
        UI.dom['btn-stop'].style.display = 'none';
        UI.dom['btn-start'].style.display = 'block';
        AudioService.speak("Tracking gepauzeerd.");
    },

    tick(p) {
        const { latitude: lat, longitude: lon, accuracy: acc, speed } = p.coords;
        const now = Date.now();
        const dt = this.state.lastTick ? (now - this.state.lastTick)/1000 : 0;
        const profile = this.profiles[UI.dom['p-select'].value];
        
        // 1. Position & Route Logic
        const pos = { lat, lon };
        const R = GpxEngine.findNearest(pos, this.data.track, this.data.cumDist, this.state.lastTrackIdx);
        this.state.lastTrackIdx = R.idx;
        if (R.pos > this.state.maxDist) this.state.maxDist = R.pos;

        // 2. Movement Logic
        this.state.speed = (speed || 0) * 3.6;
        if (speed > DOMAIN_RULES.MIN_MOVING_SPEED) {
            const distInTick = speed * dt;
            this.state.trip += distInTick;
            this.state.steps += MovementEngine.calculateSteps(distInTick, profile.stride);
            this.state.kcal += MovementEngine.calculateKcal(dt, profile.met);
        }

        // 3. Waypoint Logic (O(1) Pointer)
        const nextWp = this.data.waypoints[this.state.currentWpIdx];
        if (nextWp) {
            const dToWp = GpxEngine.calcDist(pos, nextWp);
            if (dToWp < DOMAIN_RULES.WP_RADIUS) {
                nextWp.status = 'passed';
                this.state.currentWpIdx++;
                UI.renderWpList(this.data.waypoints);
                AudioService.speak(nextWp.name + " bereikt.");
            } else if (this.state.maxDist > nextWp.routePos + DOMAIN_RULES.WP_MISS_THRESHOLD) {
                nextWp.status = 'missed';
                this.state.currentWpIdx++;
                UI.renderWpList(this.data.waypoints);
                AudioService.speak(nextWp.name + " gemist.");
            }
        }

        // 4. UI Update
        UI.renderStats(this.state);
        UI.renderConsole(nextWp, nextWp ? nextWp.routePos - R.pos : 0, R.dist, acc);
        this.state.lastTick = now;
    }
};

Controller.init();
</script>
</body>
</html>
