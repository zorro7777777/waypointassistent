<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Engine v78 - Platina Hybrid Accuraat</title>
   <style>
        body { font-family: sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
        .stat-box { background: #fff; border: 1px solid #ddd; padding: 8px 2px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 0.55rem; color: #7f8c8d; text-transform: uppercase; display: block; }
        .stat-val { font-weight: bold; font-size: 0.95rem; }
        #info { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; margin: 10px 0; min-height: 280px; line-height: 1.4; border-left: 5px solid #27ae60; font-size: 1.1rem; position: relative; }
        .gear-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; cursor: pointer; opacity: 0.7; z-index: 10; }
        .highlight { color: #fff; font-weight: bold; font-size: 1.1rem; }
        .field-yellow { color: #ffff00; font-weight: bold; font-size: 0.95rem; display: block; margin-top: 2px; }
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #dcdde1; }
        .row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .start { background: #27ae60; flex: 2; } 
        .pause { background: #f39c12; flex: 2; } 
        .copy-btn { background: #34495e; padding: 8px; font-size: 0.75rem; margin-top: 10px; border: 1px solid #5d6d7e; width: 100%; color: #bdc3c7; }
        #gpxInput { width:100%; margin-bottom:10px; border:1px solid #ccc; padding:5px; border-radius:5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.8rem; }
        td { padding: 8px 0; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.1rem; margin:0 0 10px 0; color:#2c3e50;">💿 PLATINA ENGINE v78</h1>
    
    <div class="stats-grid">
        <div class="stat-box"><span id="unit-label" class="stat-label">Stappen</span><span id="stat-steps" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Cadans/m</span><span id="stat-cadence" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Kcal</span><span id="stat-kcal" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Trip Km</span><span id="stat-trip" class="stat-val">0.00</span></div>
    </div>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:4px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <div style="font-size: 0.8rem;">Gewicht: <input type="number" id="userWeight" style="width:40px" value="92">kg</div>
        </div>
        <label><input type="checkbox" id="audioToggle" checked> 🔊 Spraak</label>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    <div class="row">
        <button onclick="handleStartPause()" id="startBtn" class="start">▶ START</button>
        <button onclick="location.reload()" style="background:#e74c3c; flex:0.5;">🔄</button>
    </div>
    
    <div id="info">
        <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
        <div id="display-content">Systeem gereed.</div>
    </div>

    <div id="tableCon">
        <div style="font-size:0.75rem; font-weight:bold; padding:8px; background:#dfe6e9; border-radius:5px; text-align:center;" id="wp-summary">Laden...</div>
        <table><tbody id="list"></tbody></table>
    </div>
</div>

<script>
const PROFS = {
    wandelen: { ms: 0.42, max: 7, th: 0.67, radius: 12, unit: "Stappen" },
    fietsen: { ms: 1.95, max: 45, th: 2.10, radius: 20, unit: "Omwentelingen" }
};
let CONFIG = { ...PROFS.wandelen };
let track = [], waypoints = [], cumDist = [], watchId = null, lastPos = null, maxRoutePos = 0, tripDist = 0, finished = false;
let sport = { steps: 0, kcal: 0, movingTime: 0, idleTime: 0, lastTick: null };
let alertTime = 0, isOffRoute = false, isPaused = false;

function getDynamicMET(skmh, mode) {
    if (skmh < 0.5) return 0;
    return mode === 'wandelen' ? (0.75 * skmh + 0.5) : (0.4 * skmh);
}

function speak(t) {
    if (!document.getElementById('audioToggle').checked) return;
    const m = new SpeechSynthesisUtterance(t);
    m.lang = 'nl-NL';
    window.speechSynthesis.speak(m);
}

function getDist(a,b,c,d){
    const R=6371000, rL=(c-a)*Math.PI/180, rO=(d-b)*Math.PI/180;
    return 2*R*Math.asin(Math.sqrt(Math.sin(rL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(rO/2)**2));
}

function getRInfo(lat, lon) {
    let bD = Infinity, bP = 0;
    track.forEach((t, i) => { const d = getDist(lat, lon, t.lat, t.lon); if (d < bD) { bD = d; bP = cumDist[i]; } });
    return { pos: bP, off: bD };
}

function toggleConfig() { document.getElementById('configArea').style.display = document.getElementById('configArea').style.display === 'none' ? 'block' : 'none'; }

document.getElementById('gpxInput').onchange = e => {
    const r = new FileReader();
    r.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        const pts = [...xml.getElementsByTagName('trkpt')];
        track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        cumDist = [0]; for(let i=0; i<track.length-1; i++) cumDist[i+1] = cumDist[i] + getDist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
        waypoints = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "Punt",
            lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'), passed: false, missed: false, touched: false
        })).map(w => { w.routePos = getRInfo(w.lat, w.lon).pos; return w; }).sort((a,b) => a.routePos - b.routePos);
        updateWPUI();
    };
    r.readAsText(e.target.files[0]);
};

function updateWPUI() {
    const p = waypoints.filter(w => w.passed).length, m = waypoints.filter(w => w.missed).length;
    document.getElementById('wp-summary').innerText = `✅ ${p} | ❌ ${m} | ⏳ ${waypoints.length - p - m}`;
    document.getElementById('list').innerHTML = waypoints.map(w => `<tr style="${w.passed ? 'color:#27ae60;' : (w.missed ? 'color:#e74c3c;text-decoration:line-through;' : '')}"><td>${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td><td>${w.name}</td><td style="text-align:right">${Math.round(w.routePos)}m</td></tr>`).join('');
}

function handleStartPause() {
    if (!watchId) startGPS();
    else { isPaused = !isPaused; document.getElementById('startBtn').innerText = isPaused ? "▶ HERVAT" : "⏸ PAUZE"; }
}

function startGPS() {
    if (watchId || !track.length) return;
    document.getElementById('configArea').style.display = 'none';
    document.getElementById('gpxInput').style.display = 'none';
    const btn = document.getElementById('startBtn'); btn.innerText = "⏸ PAUZE"; btn.className = "pause";
    
    const first = waypoints.find(w => !w.passed && !w.missed);
    if(first) speak("Tracking gestart. Ga naar " + first.name);
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen');

    watchId = navigator.geolocation.watchPosition(p => {
        if (finished || isPaused) return;
        const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = p.coords;
        const skmh = (s || 0) * 3.6, now = Date.now(), dt = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;
        const R = getRInfo(lat, lon);
        if (R.pos > maxRoutePos) maxRoutePos = R.pos;

        // --- Off-Route Dynamische Spraak ---
        if (R.off > 49 && now - alertTime > 15000) { 
            speak(Math.round(R.off) + " meter van route."); 
            alertTime = now; isOffRoute = true; 
        } else if (isOffRoute && R.off < 6) { 
            speak("Terug op route."); isOffRoute = false; 
        }

        const isM = skmh >= (CONFIG.ms * 3.6) && skmh <= CONFIG.max;
        const weight = parseFloat(document.getElementById('userWeight').value) || 92;
        const met = getDynamicMET(skmh, document.getElementById('profile').value);

        if (isM) {
            sport.movingTime += dt;
            sport.steps += ((skmh/3.6 * dt) / CONFIG.th);
            sport.kcal += (met * 3.5 * weight / 200) * (dt / 60);
            if (lastPos && acc < 25) tripDist += getDist(lastPos.lat, lastPos.lon, lat, lon);
            lastPos = { lat, lon };
        } else if (sport.lastTick) { sport.idleTime += dt; }

        let statusChanged = false;
        waypoints.forEach((w, i) => {
            if (w.passed || w.missed) return;
            if (getDist(lat, lon, w.lat, w.lon) <= CONFIG.radius) w.touched = true;
            const isF = (i === waypoints.length - 1);
            if (R.pos >= w.routePos - CONFIG.radius && w.touched) {
                w.passed = true; statusChanged = true;
                speak(isF ? "Finish bereikt." : w.name + " bereikt.");
                if (isF) finished = true; updateWPUI();
            } else if (maxRoutePos > w.routePos + CONFIG.radius + acc + 10) {
                w.missed = true; statusChanged = true;
                speak(w.name + " gemist."); updateWPUI();
            }
        });

        const next = waypoints.find(w => !w.passed && !w.missed);
        if(statusChanged && next && !finished) { setTimeout(() => speak("Ga naar " + next.name), 2000); }

        // --- UI Update ---
        document.getElementById('stat-steps').innerText = Math.round(sport.steps);
        document.getElementById('stat-kcal').innerText = Math.round(sport.kcal);
        document.getElementById('stat-trip').innerText = (tripDist/1000).toFixed(2);
        document.getElementById('stat-cadence').innerText = Math.round(isM ? ((skmh/3.6)/CONFIG.th*60) : 0);

        document.getElementById('display-content').innerHTML = `
            <b style="color:#ffff00">VOLGEND DOEL:</b><br>
            <span class="highlight" style="font-size:1.5rem; color:#00ff00;">${next ? next.name : 'FINISH'}</span><br>
            <b>AFSTAND:</b> <span class="highlight">${next ? Math.max(0, Math.round(next.routePos - R.pos)) : 0}m</span><br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>SNELHEID:</b> ${skmh.toFixed(1)} km/u | <b>MET:</b> ${met.toFixed(1)}<br>
            <b>GEMIDDELD:</b> ${((tripDist/1000)/(sport.movingTime/3600 || 1)).toFixed(2)} km/u<br>
            <b>OFF-TRACK:</b> <span style="color:${isOffRoute?'#e74c3c':'#00ff00'}">${Math.round(R.off)}m</span> | <b>GPS:</b> ${acc.toFixed(0)}m<br>
            <span class="field-yellow">LAT: ${Math.abs(lat).toFixed(6)}° ${lat >= 0 ? 'N' : 'Z'}</span>
            <span class="field-yellow">LON: ${Math.abs(lon).toFixed(6)}° ${lon >= 0 ? 'O' : 'W'}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${lat.toFixed(6)},${lon.toFixed(6)}')">📍 KOPIEER COÖRDINATEN</button>
        `;
        sport.lastTick = now;
    }, null, { enableHighAccuracy: true });
}
function updateProfile() { CONFIG = { ...PROFS[document.getElementById('profile').value] }; document.getElementById('unit-label').innerText = CONFIG.unit; }
</script>
</body>
</html>
