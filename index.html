<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strava Engine v27 FIELD - Accuracy+Speed</title>

    <style>
        body { font-family: Arial, sans-serif; line-height: 1.4; padding: 10px; max-width: 800px; margin: auto; }
        .version { color: #666; margin-bottom: 10px; font-size: 0.9em; }
        
        table { border-collapse: collapse; width: 100%; margin-top: 10px; }
        td, th { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #f4f4f4; }

        .controls { display: flex; gap: 10px; margin: 15px 0; }
        button { flex: 1; padding: 15px; font-size: 16px; border: none; border-radius: 6px; color: white; cursor: pointer; }

        .startBtn { background: #2ecc71; }
        .resetBtn { background: #3498db; }
        
        #info { 
            background: #f9f9f9; 
            padding: 15px; 
            border-radius: 8px; 
            border: 1px solid #ddd;
            font-family: monospace;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .slow { color: #e74c3c; font-weight: bold; }
        .acc-good { color: #27ae60; }
        .acc-bad { color: #e67e22; font-weight: bold; }
    </style>
</head>

<body>

<h1>GPX STRAVA ENGINE v27</h1>
<div class="version">FIELD EDITION: SPEED LOCK + GPS ACCURACY</div>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
    <button id="startBtn" class="startBtn">▶️ Start Tracking</button>
    <button id="resetBtn" class="resetBtn">🔄 Reset Alles</button>
</div>

<h2>Live Status</h2>
<div id="info">Wacht op GPX bestand en Start...</div>

<h2>Waypoints</h2>
<table>
    <thead>
        <tr>
            <th>Status</th>
            <th>Naam</th>
            <th>Afstand (m)</th>
        </tr>
    </thead>
    <tbody id="list"></tbody>
</table>

<script>
// ================= STATE =================
let track = [];
let waypoints = [];
let cumDist = [];

let watchId = null;
let active = false;

let gpsTrip = 0; 
let lastLat = null;
let lastLon = null;
let maxRoutePos = 0;

// ================= CONFIG =================
const RADIUS = 10;       
const TRACK_TOL = 5;    
const MIN_SPEED = 1.0;   

// ================= MATH =================
function dist(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function buildPolyline() {
    cumDist = [0];
    for (let i = 0; i < track.length - 1; i++) {
        cumDist[i + 1] = cumDist[i] + dist(
            track[i].lat, track[i].lon,
            track[i + 1].lat, track[i + 1].lon
        );
    }
}

function projectOnRoute(lat, lon) {
    let bestDist = Infinity;
    let bestPos = 0;
    for (let i = 0; i < track.length; i++) {
        const d = dist(lat, lon, track[i].lat, track[i].lon);
        if (d < bestDist) {
            bestDist = d;
            bestPos = cumDist[i];
        }
    }
    return bestPos;
}

function pointToSegment(px, py, ax, ay, bx, by) {
    const A = px - ax, B = py - ay, C = bx - ax, D = by - ay;
    const dot = A * C + B * D;
    const lenSq = C * C + D * D;
    let t = lenSq === 0 ? 0 : dot / lenSq;
    t = Math.max(0, Math.min(1, t));
    return dist(px, py, ax + t * C, ay + t * D);
}

// ================= RESET =================
function resetAll() {
    if (watchId) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    track = [];
    waypoints = [];
    cumDist = [];
    gpsTrip = 0;
    lastLat = null;
    lastLon = null;
    maxRoutePos = 0;
    active = false;
    document.getElementById('info').innerHTML = "🔄 Systeem gereset.";
    document.getElementById('list').innerHTML = "";
}

// ================= GPX LOAD =================
document.getElementById('gpxFile').onchange = e => {
    const reader = new FileReader();
    reader.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        track = [...xml.getElementsByTagName('trkpt')].map(p => ({
            lat: +p.getAttribute('lat'),
            lon: +p.getAttribute('lon')
        }));
        if(track.length === 0) return;
        buildPolyline();

        waypoints = [...xml.getElementsByTagName('wpt')].map(x => ({
            name: x.getElementsByTagName('name')[0]?.textContent || "WP",
            lat: +x.getAttribute('lat'),
            lon: +x.getAttribute('lon'),
            passed: false,
            missed: false,
            touched: false,
            minDist: Infinity
        }));

        waypoints.unshift({ name: "START", lat: track[0].lat, lon: track[0].lon, passed: true, touched: true, minDist: 0 });
        waypoints.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, passed: false, touched: false, minDist: Infinity });

        waypoints.forEach(w => w.routePos = projectOnRoute(w.lat, w.lon));
        waypoints.sort((a, b) => a.routePos - b.routePos);

        for (let i = 0; i < waypoints.length; i++) {
            waypoints[i].segment = (i === 0) ? 0 : waypoints[i].routePos - waypoints[i - 1].routePos;
        }
        document.getElementById('info').innerHTML = "✅ GPX geladen. Klik op Start.";
        render();
    };
    reader.readAsText(e.target.files[0]);
};

// ================= LOGICA =================
function processLocation(lat, lon) {
    const currentRoutePos = projectOnRoute(lat, lon);
    if (currentRoutePos > maxRoutePos) maxRoutePos = currentRoutePos;

    for (let w of waypoints) {
        if (w.passed || w.missed) continue;
        const d = dist(lat, lon, w.lat, w.lon);
        if (d < w.minDist) w.minDist = d;
        if (d <= RADIUS) w.touched = true;
        if (currentRoutePos >= w.routePos - RADIUS && w.touched) w.passed = true;
        if (maxRoutePos > w.routePos + (RADIUS * 2) && !w.passed) w.missed = true;
    }
}

// ================= GPS CORE =================
function startTracking() {
    if (watchId || track.length === 0) return;
    active = true;

    watchId = navigator.geolocation.watchPosition(p => {
        if (!active) return;

        const lat = p.coords.latitude;
        const lon = p.coords.longitude;
        const speed = (p.coords.speed || 0) * 3.6;
        const accuracy = p.coords.accuracy || 0;

        if (lastLat !== null) {
            const d = dist(lastLat, lastLon, lat, lon);
            // Alleen tellen als snelheid > 1 km/u
            if (speed >= MIN_SPEED && d > 1 && d < 5001) {
                gpsTrip += d;
            }
        }

        processLocation(lat, lon);
        lastLat = lat;
        lastLon = lon;

        // UI Feedback
        const accClass = accuracy > 20 ? "acc-bad" : "acc-good";
        const speedMsg = speed < MIN_SPEED ? "<span class='slow'>⏸ STILSTAND</span>" : "<span style='color:green'>▶️ WANDELEN</span>";

        document.getElementById('info').innerHTML = `
            <b>Status:</b> ${speedMsg}<br>
            <b>Locatie:</b> ${lat.toFixed(5)}, ${lon.toFixed(5)}<br>
            <b>Nauwkeurigheid:</b> <span class="${accClass}">${accuracy.toFixed(1)} meter</span><br>
            <b>Snelheid:</b> ${speed.toFixed(1)} km/u<br>
            <b>Tripteller:</b> ${(gpsTrip / 1000).toFixed(3)} km
        `;

        render();

    }, err => {
        document.getElementById('info').innerHTML = "❌ GPS Fout: " + err.message;
    }, {
        enableHighAccuracy: true,
        maximumAge: 1000
    });
}

function render() {
    const tbody = document.getElementById('list');
    tbody.innerHTML = "";
    waypoints.forEach(w => {
        let icon = "⏳";
        let rowStyle = "";
        if (w.passed) { icon = "✅"; rowStyle = "background:#eaffea"; }
        else if (w.missed) { icon = "❌"; rowStyle = "background:#ffeaea"; }
        tbody.innerHTML += `<tr style="${rowStyle}"><td>${icon}</td><td>${w.name}</td><td>${w.segment.toFixed(0)} m</td></tr>`;
    });
}

document.getElementById('startBtn').onclick = startTracking;
document.getElementById('resetBtn').onclick = resetAll;

</script>
</body>
</html>
