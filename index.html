<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Tracker V11.2 Stable Smooth Engine</title>
<style>
body{font-family:Arial}
.version{color:#666;margin-bottom:10px}
table{border-spacing:3px}
td,th{border:2px double black;padding:6px}
.startName{color:green;font-weight:bold}
.endName{color:red;font-weight:bold}

.controls{display:flex;gap:10px;margin:10px 0}
button{flex:1;padding:12px;font-size:16px;border:none;border-radius:6px;color:white}
.startBtn{background:#2ecc71}
.stopBtn{background:#e74c3c}
.pauseBtn{background:#f39c12}
.resumeBtn{background:#2ecc71}
</style>
</head>
<body>

<h1>GPX Wandel Tracker</h1>
<div class="version">Versie 11.2 (Smooth Trip + Stable Waypoints)</div>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
<button id="startBtn" class="startBtn">▶️ Start</button>
<button id="pauseBtn" class="pauseBtn" disabled>⏸️ Pauze</button>
</div>

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints</h2>
<table>
<thead>
<tr>
<th>Status</th>
<th>Naam</th>
<th>Segment (m)</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>

// ================= STATE =================
let track=[];
let cum=[];
let waypoints=[];

let watchId=null;
let active=false;
let paused=false;

let gpsTrip=0;
let lastLat=null;
let lastLon=null;

// smoothing buffer
let buffer=[];
const BUFFER_SIZE=5;

const MAX_SPEED=10;
const TOLERANCE=10;

// ================= DIST =================
function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ================= TRACK =================
function buildCum(){
cum=[0];
for(let i=0;i<track.length-1;i++){
cum[i+1]=cum[i]+dist(track[i].lat,track[i].lon,track[i+1].lat,track[i+1].lon);
}
}

function closestIndex(lat,lon){
let best=0,bestD=Infinity;
for(let i=0;i<track.length;i++){
const d=dist(lat,lon,track[i].lat,track[i].lon);
if(d<bestD){bestD=d;best=i;}
}
return best;
}

// ================= LOAD =================
document.getElementById('gpxFile').onchange=e=>{
const r=new FileReader();
r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

track=[...xml.getElementsByTagName('trkpt')].map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));
buildCum();

const w=[...xml.getElementsByTagName('wpt')];
waypoints=w.map(x=>({
name:x.getElementsByTagName('name')[0]?.textContent||"WP",
lat:+x.getAttribute('lat'),
lon:+x.getAttribute('lon'),
index:0,
passed:false,
segment:0
}));

waypoints.unshift({name:"Start",lat:track[0].lat,lon:track[0].lon,index:0,passed:false,segment:0});
waypoints.push({name:"Einde",lat:track.at(-1).lat,lon:track.at(-1).lon,index:track.length-1,passed:false,segment:0});

waypoints.forEach(w=>w.index=closestIndex(w.lat,w.lon));
waypoints.sort((a,b)=>a.index-b.index);

for(let i=0;i<waypoints.length;i++){
if(i===0){waypoints[i].segment=0;continue;}
const prev=waypoints[i-1];
const curr=waypoints[i];
waypoints[i].segment=Math.max(0,cum[curr.index]-cum[prev.index]);
}

render();
};
r.readAsText(e.target.files[0]);
};

// ================= GPS =================
function startTracking(){
if(watchId) return;

watchId=navigator.geolocation.watchPosition(p=>{
if(!active||paused) return;

const lat=p.coords.latitude;
const lon=p.coords.longitude;
const acc=p.coords.accuracy||999;
const speed=(p.coords.speed||0)*3.6;

let d=0;
if(lastLat) d=dist(lastLat,lastLon,lat,lon);

// SMOOTH TRIP ENGINE
if(d>0.3 && d<25 && acc<30 && speed<MAX_SPEED){

buffer.push(d);
if(buffer.length>BUFFER_SIZE) buffer.shift();

const avg=buffer.reduce((a,b)=>a+b,0)/buffer.length;
gpsTrip+=avg;
}

lastLat=lat;
lastLon=lon;

// WAYPOINT ENGINE
for(let w of waypoints){
if(!w.passed){
const wd=dist(lat,lon,w.lat,w.lon);
if(wd<=TOLERANCE) w.passed=true;
}
}

updateUI(lat,lon,speed);
render();

},console.error,{enableHighAccuracy:true});
}

function stopTracking(){
navigator.geolocation.clearWatch(watchId);
watchId=null;
active=false;
paused=false;
lastLat=null;
lastLon=null;
gpsTrip=0;
buffer=[];
render();
}

// ================= BUTTONS =================
const startBtn=document.getElementById('startBtn');
const pauseBtn=document.getElementById('pauseBtn');

startBtn.onclick=()=>{
if(!active){
active=true;
startTracking();
startBtn.textContent="⏹️ Stop";
startBtn.className="stopBtn";
pauseBtn.disabled=false;
}else{
stopTracking();
startBtn.textContent="▶️ Start";
startBtn.className="startBtn";
pauseBtn.disabled=true;
}
};

pauseBtn.onclick=()=>{
paused=!paused;
pauseBtn.textContent=paused?"▶️ Hervatten":"⏸️ Pauze";
pauseBtn.className=paused?"resumeBtn":"pauseBtn";
};

// ================= UI =================
function render(){
const l=document.getElementById('list');
l.innerHTML="";
waypoints.forEach(w=>{
let c="";
if(w.name==="Start")c="startName";
if(w.name==="Einde")c="endName";

l.innerHTML+=`<tr>
<td>${w.passed?"✅":"⏳"}</td>
<td class="${c}">${w.name}</td>
<td>${w.segment.toFixed(1)}</td>
</tr>`;
});
}

function updateUI(lat,lon,speed){
document.getElementById('info').innerHTML=`
📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
🧭 Trip (GPS): ${(gpsTrip/1000).toFixed(3)} km<br>
🚶 Snelheid: ${speed.toFixed(2)} km/u<br>
`;
}

</script>

</body>
</html>
