<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Engine v90 - Geometry Aware</title>
   <style>
        body { font-family: sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        #info { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; margin: 10px 0; min-height: 480px; line-height: 1.3; border-left: 5px solid #27ae60; font-size: 1.1rem; position: relative; overflow: hidden; }
        .gear-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; cursor: pointer; opacity: 0.7; z-index: 10; }
        .highlight { color: #fff; font-weight: bold; font-size: 1.1rem; }
        .field-yellow { color: #ffff00; font-weight: bold; font-size: 0.95rem; display: block; margin-top: 2px; }
        .field-green { color: #00ff00; font-weight: bold; }
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #dcdde1; display: none; }
        .row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .start { background: #27ae60; flex: 2; } 
        .pause { background: #f39c12; flex: 2; } 
        #resetBtn { background: #e74c3c; flex: 0.4; display: none; }
        .copy-btn { background: #34495e; padding: 8px; font-size: 0.75rem; margin-top: 10px; width: 100%; color: #bdc3c7; border: 1px solid #555; }
        #gpxInput { width:100%; margin-bottom:10px; border:1px solid #ccc; padding:5px; border-radius:5px; }
        #list { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; display: none; }
        td { padding: 8px 0; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.1rem; margin:0 0 5px 0; color:#2c3e50;">💿 PLATINA ENGINE v90</h1>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:4px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <div style="font-size: 0.8rem;">Gewicht: <input type="number" id="userWeight" style="width:40px" value="92">kg</div>
        </div>
        <label><input type="checkbox" id="audioToggle" checked> 🔊 Spraak</label>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    
    <div class="row">
        <button onclick="handleStartPause()" id="startBtn" class="start">▶ START</button>
        <button onclick="toggleTable()" style="background:#3498db; flex:0.4">📑</button>
        <button onclick="location.reload()" id="resetBtn">🔄</button>
    </div>
    
    <div id="info">
        <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
        <div id="display-content">Laden... Wacht op GPX.</div>
    </div>

    <table id="list"></table>
</div>

<script>
// --- CORE CONFIG ---
const PROFS = {
    wandelen: { ms: 0.42, max: 7, th: 0.67, radius: 10, unit: "Stappen" },
    fietsen: { ms: 1.95, max: 45, th: 2.10, radius: 20, unit: "Omwentelingen" }
};
let CONFIG = { ...PROFS.wandelen };
let track = [], waypoints = [], cumDist = [], watchId = null, lastPos = null, tripDist = 0, finished = false;
let sport = { steps: 0, kcal: 0, movingTime: 0, lastTick: null };
let smoothLat = null, smoothLon = null, lastTrackIndex = 0;
let speechQueue = [], isSpeaking = false;
let cachedArrival = "--:--", lastEtaUpdate = 0;

// --- GEOMETRY ENGINE (PROJECTION) ---
function getNearestSegment(pLat, pLon) {
    let minD = Infinity, bestP = 0, bestIdx = 0;
    
    // Moving Window: zoek 50 segmenten rondom huidige index voor performance en robuustheid
    let start = Math.max(0, lastTrackIndex - 10);
    let end = Math.min(track.length - 1, lastTrackIndex + 40);

    for (let i = start; i < end; i++) {
        const A = track[i], B = track[i+1];
        const res = projectOnSegment(pLat, pLon, A, B);
        if (res.d < minD) {
            minD = res.d;
            bestP = cumDist[i] + res.projDist;
            bestIdx = i;
        }
    }
    lastTrackIndex = bestIdx;
    return { off: minD, pos: bestP };
}

function projectOnSegment(pLat, pLon, A, B) {
    const L2 = Math.pow(getDist(A.lat, A.lon, B.lat, B.lon), 2);
    if (L2 === 0) return { d: getDist(pLat, pLon, A.lat, A.lon), projDist: 0 };
    
    // Projectie fractie t
    let t = ((pLat - A.lat) * (B.lat - A.lat) + (pLon - A.lon) * (B.lon - A.lon)) / L2;
    t = Math.max(0, Math.min(1, t));
    
    const projLat = A.lat + t * (B.lat - A.lat);
    const projLon = A.lon + t * (B.lon - A.lon);
    
    return {
        d: getDist(pLat, pLon, projLat, projLon),
        projDist: t * Math.sqrt(L2)
    };
}

// --- VOICE ---
function speak(text) {
    if (!document.getElementById('audioToggle').checked) return;
    speechQueue.push(text.replace("START", "Start").replace("FINISH", "Finish"));
    if (!isSpeaking) processQueue();
}
function processQueue() {
    if (speechQueue.length === 0) { isSpeaking = false; return; }
    isSpeaking = true;
    const m = new SpeechSynthesisUtterance(speechQueue.shift());
    m.lang = 'nl-NL'; m.rate = 0.9;
    m.onend = () => setTimeout(processQueue, 2000);
    window.speechSynthesis.speak(m);
}

// --- GPS & MATH ---
function getDist(a,b,c,d){
    const R=6371000, rL=(c-a)*Math.PI/180, rO=(d-b)*Math.PI/180;
    return 2*R*Math.asin(Math.sqrt(Math.sin(rL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(rO/2)**2));
}

document.getElementById('gpxInput').onchange = e => {
    const r = new FileReader();
    r.onload = ev => {
        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
        const pts = [...xml.getElementsByTagName('trkpt')];
        track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
        cumDist = [0];
        for(let i=0; i<track.length-1; i++) cumDist[i+1] = cumDist[i] + getDist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
        
        waypoints = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "Punt",
            lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'),
            passed: false, touched: false
        })).sort((a,b) => getNearestSegment(a.lat, a.lon).pos - getNearestSegment(b.lat, b.lon).pos);
        
        speak("Route geladen.");
        document.getElementById('display-content').innerText = "Gereed. Druk op START.";
    };
    r.readAsText(e.target.files[0]);
};

function handleStartPause() {
    const btn = document.getElementById('startBtn');
    if (!watchId) {
        startGPS(); btn.innerText = "⏸ PAUZE"; btn.className = "pause";
        speak("Systeem actief.");
    } else {
        isPaused = !isPaused;
        btn.innerText = isPaused ? "▶ HERVAT" : "⏸ PAUZE";
        btn.className = isPaused ? "start" : "pause";
        speak(isPaused ? "Pauze" : "Hervatting");
        sport.lastTick = isPaused ? null : Date.now();
    }
}

function startGPS() {
    if (watchId) return;
    if ('wakeLock' in navigator) navigator.wakeLock.request('screen');
    watchId = navigator.geolocation.watchPosition(p => {
        if (isPaused || finished) return;
        const { latitude: rLat, longitude: rLon, accuracy: acc, speed: s } = p.coords;
        const now = Date.now(), dt = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;

        if (acc > 25) return;
        if (smoothLat === null) { smoothLat = rLat; smoothLon = rLon; }
        else {
            smoothLat = (rLat * 0.35) + (smoothLat * 0.65);
            smoothLon = (rLon * 0.35) + (smoothLon * 0.65);
        }

        const R = getNearestSegment(smoothLat, smoothLon);
        const skmh = (s || 0) * 3.6;
        const isM = skmh >= (CONFIG.ms * 3.6) && skmh <= CONFIG.max;

        if (isM && dt > 0) {
            sport.movingTime += dt;
            sport.steps += ((skmh/3.6 * dt) / CONFIG.th);
            const met = CONFIG.unit === "Stappen" ? (0.75 * skmh + 0.5) : (0.4 * skmh);
            sport.kcal += (met * 3.5 * 92 / 200) * (dt / 60);
            if (lastPos) tripDist += getDist(lastPos.lat, lastPos.lon, smoothLat, smoothLon);
            lastPos = { lat: smoothLat, lon: smoothLon };
        }

        // Waypoint engine
        const next = waypoints.find(w => !w.passed);
        if (next) {
            const dToWp = getDist(smoothLat, smoothLon, next.lat, next.lon);
            if (dToWp < CONFIG.radius) next.touched = true;
            if (next.touched && dToWp > CONFIG.radius + 5) {
                next.passed = true;
                speak(next.name);
                const n2 = waypoints.find(w => !w.passed);
                if (n2) speak("Volgend punt: " + n2.name);
            }
        }

        // ETA klok
        if (now - lastEtaUpdate > 30000) {
            const rem = cumDist.at(-1) - R.pos;
            const v = (R.pos/1000) / (sport.movingTime/3600);
            if (v > 1) {
                const arr = new Date(now + (rem/(v/3.6))*1000);
                cachedArrival = arr.getHours().toString().padStart(2,'0')+":"+arr.getMinutes().toString().padStart(2,'0');
            }
            lastEtaUpdate = now;
        }

        document.getElementById('display-content').innerHTML = `
            <b style="color:#ffff00">NAAR:</b> <span class="highlight">${next ? next.name : 'FINISH'}</span><br>
            <b>AFSTAND:</b> <span class="highlight">${next ? Math.round(getDist(smoothLat, smoothLon, next.lat, next.lon)) : 0}m</span><br>
            <hr style="border:0; border-top:1px solid #444;">
            <b>TRIP:</b> <span class="field-green">${(tripDist/1000).toFixed(3)} km</span><br>
            <b>TIJD:</b> <span class="field-green">${new Date(sport.movingTime * 1000).toISOString().substr(11, 8)}</span><br>
            <b>AANKOMST:</b> <span class="field-green">${cachedArrival}</span><br>
            <hr style="border:0; border-top:1px solid #444;">
            <b>SPD:</b> ${skmh.toFixed(1)} km/u | <b>AVG:</b> ${( (R.pos/1000)/(sport.movingTime/3600) || 0).toFixed(1)}<br>
            <b>OFF-TRACK:</b> <span style="color:${R.off > 30 ? '#e74c3c' : '#00ff00'}">${Math.round(R.off)}m</span><br>
            <b>${CONFIG.unit.toUpperCase()}:</b> ${Math.round(sport.steps)} | <b>KCAL:</b> ${Math.round(sport.kcal)}<br>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${smoothLat},${smoothLon}')">📍 KOPIEER POSITIE</button>
        `;
        sport.lastTick = now;
    }, null, { enableHighAccuracy: true });
}

function toggleTable() { 
    const t = document.getElementById('list');
    t.style.display = t.style.display === 'none' ? 'table' : 'none';
    t.innerHTML = waypoints.map(w => `<tr><td>${w.passed?'✅':'⏳'}</td><td>${w.name}</td></tr>`).join('');
}
function updateProfile() { CONFIG = PROFS[document.getElementById('profile').value]; speak("Profiel gewijzigd."); }
</script>
</body>
</html>
