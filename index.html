<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPX Engine v77 - Platina Anticipate</title>
    <style>
        :root { --text-scale: 1.0; }
        body { font-family: sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
        .stat-box { background: #fff; border: 1px solid #ddd; padding: 8px 2px; border-radius: 8px; text-align: center; }
        .stat-label { font-size: 0.55rem; color: #7f8c8d; text-transform: uppercase; display: block; }
        .stat-val { font-weight: bold; font-size: 0.95rem; }
        #info { background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; font-family: monospace; margin: 10px 0; min-height: 250px; line-height: 1.4; border-left: 5px solid #27ae60; font-size: calc(0.82rem * var(--text-scale)); position: relative; overflow: hidden; }
        .gear-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; cursor: pointer; opacity: 0.7; z-index: 10; }
        .highlight { color: #fff; font-weight: bold; font-size: calc(0.95rem * var(--text-scale)); }
        .large-info { font-size: calc(1.2rem * var(--text-scale)); line-height: 1.2; }
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #dcdde1; }
        .row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; transition: background 0.3s; }
        .start { background: #27ae60; flex: 2; } 
        .stop { background: #c0392b; flex: 2; }
        .toggle-list { background: #3498db; }
        .reset { background: #e74c3c; flex: 1; }
        #gpxInput { width:100%; margin-bottom:10px; border:1px solid #ccc; padding:5px; border-radius:5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 0.8rem; }
        td { padding: 10px 0; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.1rem; margin:0 0 10px 0; color:#2c3e50;">💿 PLATINA ENGINE v77</h1>
    
    <div class="stats-grid">
        <div class="stat-box"><span id="unit-label" class="stat-label">Stappen</span><span id="stat-steps" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Cadans/m</span><span id="stat-cadence" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Kcal</span><span id="stat-kcal" class="stat-val">0</span></div>
        <div class="stat-box"><span class="stat-label">Trip Km</span><span id="stat-trip" class="stat-val">0.00</span></div>
    </div>

    <div class="stats-grid" style="grid-template-columns: 1fr 1fr;">
        <div class="stat-box"><span class="stat-label">Bewogen</span><span id="stat-moving" class="stat-val">00:00:00</span></div>
        <div class="stat-box"><span class="stat-label">Pauze</span><span id="stat-idle" class="stat-val">00:00:00</span></div>
    </div>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:4px; flex: 1;">
                <option value="wandelen">🚶 Wandelen </option>
                <option value="fietsen">🚲 Fietsen </option>
            </select>
        </div>
        <div class="row">
            <label><input type="checkbox" id="audioToggle" checked> 🔊 Spraak (Vrouw)</label>
        </div>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    
    <div class="row" id="mainControls">
        <button onclick="handleStartStop()" id="startBtn" class="start">▶</button>
        <button onclick="toggleTable()" id="listBtn" class="toggle-list">📑</button>
        <button onclick="location.reload()" id="resetBtn" class="reset">🔄</button>
    </div>
    
    <div id="info">
        <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
        <div id="display-content">Systeem stand-by.</div>
    </div>

    <div id="tableCon">
        <div id="wp-summary" style="font-size:0.75rem; font-weight:bold; padding:8px; background:#dfe6e9; border-radius:5px; margin-top:10px; text-align:center;">Punten: 0</div>
        <table><tbody id="list"></tbody></table>
    </div>
</div>

<script>
const PROFS = {
    wandelen: { ms: 0.4, max: 8, th: 0.67, radius: 25, met: 3.5, unit: "Stappen" },
    fietsen: { ms: 1.2, max: 45, th: 2.10, radius: 35, met: 8.0, unit: "Omwentelingen" }
};
let CONFIG = { ...PROFS.wandelen };
let track = [], waypoints = [], cumDist = [], watchId = null, lastPos = null, maxRoutePos = 0, tripDist = 0, finished = false;
let sport = { steps: 0, kcal: 0, movingTime: 0, idleTime: 0, lastTick: null };
let alertTime = 0, isOffRoute = false, lastSearchIdx = 0, totalRouteLength = 0;

function speak(t) {
    if (!document.getElementById('audioToggle').checked) return;
    const m = new SpeechSynthesisUtterance(t);
    m.lang = 'nl-NL';
    const v = window.speechSynthesis.getVoices().find(v => v.lang.includes('NL') && v.name.includes('Female'));
    if (v) m.voice = v;
    window.speechSynthesis.speak(m);
}

function getDist(a,b,c,d){
    const R=6371000, rL=(c-a)*Math.PI/180, rO=(d-b)*Math.PI/180;
    return 2*R*Math.asin(Math.sqrt(Math.sin(rL/2)**2 + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(rO/2)**2));
}

function getRInfo(lat, lon) {
    if (!track.length) return { pos: 0, off: 0 };
    let bD = Infinity, bP = 0, bI = 0;
    let startIdx = Math.max(0, lastSearchIdx - 150);
    let endIdx = Math.min(track.length, lastSearchIdx + 150);
    if (lastSearchIdx === 0 || getDist(lat, lon, track[lastSearchIdx].lat, track[lastSearchIdx].lon) > 200) {
        startIdx = 0; endIdx = track.length;
    }
    for (let i = startIdx; i < endIdx; i++) {
        const d = getDist(lat, lon, track[i].lat, track[i].lon);
        if (d < bD) { bD = d; bP = cumDist[i]; bI = i; }
    }
    lastSearchIdx = bI;
    return { pos: bP, off: bD };
}

function toggleConfig() {
    const area = document.getElementById('configArea');
    area.style.display = area.style.display === 'none' ? 'block' : 'none';
}

function toggleTable() {
    const con = document.getElementById('tableCon');
    con.style.display = con.style.display === 'none' ? 'block' : 'none';
}

document.getElementById('gpxInput').onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => {
        try {
            const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
            const pts = [...xml.getElementsByTagName('trkpt')];
            track = pts.map(p => ({ lat: +p.getAttribute('lat'), lon: +p.getAttribute('lon') }));
            cumDist = [0]; 
            for(let i=0; i<track.length-1; i++) cumDist[i+1] = cumDist[i] + getDist(track[i].lat, track[i].lon, track[i+1].lat, track[i+1].lon);
            totalRouteLength = cumDist[cumDist.length - 1];

            let wpts = [...xml.getElementsByTagName('wpt')].map(w => ({ name: w.getElementsByTagName('name')[0]?.textContent || "WP", lat: +w.getAttribute('lat'), lon: +w.getAttribute('lon'), passed: false, missed: false }));
            wpts.push({ name: "START", lat: track[0].lat, lon: track[0].lon, passed: false, missed: false });
            wpts.push({ name: "FINISH", lat: track.at(-1).lat, lon: track.at(-1).lon, passed: false, missed: false });

            waypoints = wpts.map(w => { w.routePos = getRInfo(w.lat, w.lon).pos; return w; }).sort((a,b) => a.routePos - b.routePos);
            document.getElementById('gpxInput').style.display = 'none';
            document.getElementById('display-content').innerText = "GPX geladen. Druk op START.";
            updateWPUI();
        } catch (err) { alert("GPX fout."); }
    };
    r.readAsText(file);
};

function updateWPUI() {
    const p = waypoints.filter(w => w.passed).length, m = waypoints.filter(w => w.missed).length, t = waypoints.length;
    document.getElementById('wp-summary').innerText = `✅ ${p} | ❌ ${m} | ⏳ ${t-p-m}`;
    document.getElementById('list').innerHTML = waypoints.map(w => `<tr style="${w.passed ? 'color:#27ae60;' : (w.missed ? 'color:#e74c3c;' : '')}"><td>${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}</td><td>${w.name}</td><td style="text-align:right">${Math.round(w.routePos)}m</td></tr>`).join('');
}

function handleStartStop() {
    const btn = document.getElementById('startBtn');
    if (!watchId) {
        if (!track.length) return;
        const first = waypoints.find(w => !w.passed && !w.missed);
        speak("Gestart. Volgend doel: " + (first ? first.name : "onbekend"));
        startGPS();
        btn.innerHTML = "■"; btn.className = "stop";
    } else {
        navigator.geolocation.clearWatch(watchId);
        watchId = null; btn.innerHTML = "▶"; btn.className = "start";
    }
}

function startGPS() {
    watchId = navigator.geolocation.watchPosition(p => {
        if (finished) return; 
        const { latitude: lat, longitude: lon, accuracy: acc, speed: s } = p.coords;
        const speedMs = s || 0;
        const now = Date.now(), dt = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;
        const R = getRInfo(lat, lon);
        if (R.pos > maxRoutePos) maxRoutePos = R.pos;

        // Statistieken
        const isMoving = speedMs >= CONFIG.ms;
        if (isMoving) { 
            sport.movingTime += dt; 
            sport.steps += ((speedMs * dt) / CONFIG.th); 
            if (lastPos) tripDist += getDist(lastPos.lat, lastPos.lon, lat, lon); 
            lastPos = { lat, lon }; 
        } else if (sport.lastTick) sport.idleTime += dt;

        // Waypoint Logica
        waypoints.forEach((w, i) => {
            if (w.passed || w.missed) return;
            const dist = getDist(lat, lon, w.lat, w.lon);
            const isFinish = (i === waypoints.length - 1);

            // CRUCIALE FIX: Finish beveiliging
            // Finish kan alleen bereikt worden als we meer dan 10% van de route hebben afgelegd
            const canFinish = !isFinish || (maxRoutePos > totalRouteLength * 0.2);

            if (dist <= CONFIG.radius && canFinish) { 
                w.passed = true;
                speak(w.name + " bereikt."); 
                if (isFinish) { 
                    finished = true;
                    setTimeout(() => speak("Bestemming bereikt. Proficiat!"), 1500);
                } else {
                    const next = waypoints.find(wp => !wp.passed && !wp.missed);
                    if (next) setTimeout(() => speak("Ga nu naar " + next.name), 2500);
                }
                updateWPUI(); 
            } else if (maxRoutePos > w.routePos + 50 && !isFinish) { 
                w.missed = true; updateWPUI(); 
            }
        });

        const nextWp = waypoints.find(w => !w.passed && !w.missed);
        document.getElementById('stat-steps').innerText = Math.round(sport.steps);
        document.getElementById('stat-trip').innerText = (tripDist/1000).toFixed(2);
        document.getElementById('stat-moving').innerText = new Date(sport.movingTime * 1000).toISOString().substr(11, 8);
        document.getElementById('display-content').innerHTML = `
            <b style="color:#ffff00">DOEL:</b> <span class="highlight">${nextWp ? nextWp.name : 'FINISH'}</span><br>
            <b>AFSTAND:</b> <span class="highlight">${nextWp ? Math.max(0, Math.round(nextWp.routePos - R.pos)) : 0}m</span><br>
            <hr><b>SNELHEID:</b> ${(speedMs*3.6).toFixed(1)} km/u | <b>GPS:</b> ±${acc.toFixed(0)}m
        `;
        sport.lastTick = now;
    }, null, { enableHighAccuracy: true });
}

function updateProfile() { 
    CONFIG = { ...PROFS[document.getElementById('profile').value] }; 
    document.getElementById('unit-label').innerText = CONFIG.unit; 
}
</script>
</body>
</html>
