<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platina Engine v96 - Field Master</title>
    <style>
        :root { 
            --bg: #f4f7f6; 
            --dark: #101010; 
            --accent: #00ff00; 
            --green: #00b894; 
            --red: #d63031; 
            --white: #ffffff; 
            --panel: #2d3436;
        }
        
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #2d3436; }
        
        .card { 
            max-width: 500px; 
            margin: auto; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            overflow: hidden; 
        }

        /* Dashboard Stats */
        .stats-bar { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            background: var(--panel); 
            color: white; 
            padding: 12px 5px; 
            gap: 5px; 
        }
        .stat { text-align: center; }
        .stat-l { font-size: 0.6rem; text-transform: uppercase; opacity: 0.7; display: block; margin-bottom: 2px; }
        .stat-v { font-weight: bold; font-size: 1.1rem; }

        /* Console Window (High Contrast) */
        #console { 
            background: var(--dark); 
            color: var(--white); 
            padding: 25px 20px; 
            font-family: 'Courier New', monospace; 
            min-height: 220px; 
            position: relative; 
            border-bottom: 5px solid var(--green); 
        }
        .gear { position: absolute; top: 12px; right: 12px; cursor: pointer; font-size: 1.5rem; opacity: 0.5; z-index: 10; }
        .next-label { color: var(--accent); font-size: 1rem; font-weight: bold; margin-bottom: 5px; }
        .main-val { font-size: 2.2rem; font-weight: bold; margin: 8px 0; line-height: 1.1; }
        .sub-val { font-size: 1.2rem; opacity: 0.9; margin-top: 5px; }
        .status-line { margin-top: 20px; font-size: 0.9rem; border-top: 1px solid #333; padding-top: 12px; line-height: 1.5; }

        /* Controls */
        .p10 { padding: 15px; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; flex: 1; font-size: 1rem; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .btn-main { background: var(--green); color: white; }
        .btn-stop { background: #636e72; color: white; display: none; }
        .btn-reset { background: #fab1a0; color: var(--red); flex: 0.5; }

        #config { background: #dfe6e9; padding: 15px; display: none; border-radius: 10px; margin-bottom: 15px; border: 1px solid #ccc; }
        
        /* Waypoint List */
        #wp-list { margin-top: 20px; border-radius: 10px; overflow: hidden; border: 1px solid #eee; }
        .wp-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 14px 12px; 
            border-bottom: 1px solid #eee; 
            font-size: 0.95rem; 
            cursor: pointer; 
            background: #fff;
        }
        .wp-item:last-child { border-bottom: none; }
        .passed { color: var(--green); background: #e6fffb !important; font-weight: bold; }
        .missed { color: var(--red); text-decoration: line-through; background: #fff1f0 !important; }
        
        input[type="file"] { width: 100%; padding: 10px; border: 2px dashed #ccc; border-radius: 10px; box-sizing: border-box; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="stats-bar">
        <div class="stat"><span class="stat-l" id="unit-label">Stappen</span><span class="stat-v" id="v-steps">0</span></div>
        <div class="stat"><span class="stat-l">KM/U</span><span class="stat-v" id="v-speed">0.0</span></div>
        <div class="stat"><span class="stat-l">KCAL</span><span class="stat-v" id="v-kcal">0</span></div>
        <div class="stat"><span class="stat-l">TRIP</span><span class="stat-v" id="v-trip">0.00</span></div>
    </div>

    <div id="console">
        <div class="gear" onclick="UI.toggleConfig()">⚙️</div>
        <div id="display">
            <div style="margin-top:50px; text-align:center; opacity:0.6;">Selecteer een GPX bestand om te starten.</div>
        </div>
    </div>

    <div class="p10">
        <div id="config">
            <label style="font-weight:bold; display:block; margin-bottom:5px;">Activiteit:</label>
            <select id="p-select" onchange="UI.updateProfile()" style="width:100%; padding:12px; margin-bottom:15px; border-radius:5px;">
                <option value="wandelen">🚶 Wandelen (Tolerantie: 50m)</option>
                <option value="fietsen">🚲 Fietsen (Tolerantie: 100m)</option>
            </select>
            <label style="display:flex; align-items:center; cursor:pointer;">
                <input type="checkbox" id="audio-on" checked style="width:20px; height:20px; margin-right:10px;"> 
                Audio Feedback Inschakelen
            </label>
        </div>

        <input type="file" id="file-in" accept=".gpx">
        
        <div class="btn-row">
            <button class="btn-main" id="btn-start" onclick="Controller.start()">▶ START</button>
            <button class="btn-stop" id="btn-stop" onclick="Controller.stop()">⏸ STOP</button>
            <button class="btn-reset" onclick="location.reload()">🔄</button>
        </div>

        <div id="wp-list"></div>
    </div>
</div>

<script>
/** * DOMAIN RULES & PROFILES
 */
const PROFILES = {
    wandelen: { met: 3.5, stride: 0.75, tolerance: 50 },
    fietsen: { met: 8.0, stride: 2.10, tolerance: 100 }
};

/**
 * AUDIO SERVICE (With Guide Mode)
 */
const AudioService = {
    speak(text, priority = false) {
        if (!document.getElementById('audio-on').checked) return;
        if (priority) window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'nl-NL';
        msg.rate = 0.9; // Rustig tempo voor gids-ervaring
        window.speechSynthesis.speak(msg);
    }
};

/**
 * CORE ENGINES (Pure Logic)
 */
const GpxEngine = {
    calcDist(p1, p2) {
        const R = 6371000;
        const dLat = (p2.lat - p1.lat) * Math.PI / 180;
        const dLon = (p2.lon - p1.lon) * Math.PI / 180;
        const a = Math.sin(dLat/2)**2 + Math.cos(p1.lat*Math.PI/180)*Math.cos(p2.lat*Math.PI/180)*Math.sin(dLon/2)**2;
        return 2 * R * Math.asin(Math.sqrt(a));
    },

    findNearest(pos, track, cumDist, lastIdx) {
        let best = { dist: Infinity, idx: lastIdx };
        const win = 150; // Zoekvenster voor performance
        const start = Math.max(0, lastIdx - win);
        const end = Math.min(track.length, lastIdx + win);
        
        for (let i = (lastIdx === 0 ? 0 : start); i < (lastIdx === 0 ? track.length : end); i++) {
            const d = this.calcDist(pos, track[i]);
            if (d < best.dist) best = { dist: d, idx: i };
        }
        return { ...best, pos: cumDist[best.idx] };
    }
};

/**
 * UI CONTROLLER (Presentation)
 */
const UI = {
    dom: {},
    init() {
        const ids = ['v-steps','v-speed','v-kcal','v-trip','display','wp-list','unit-label','p-select','btn-start','btn-stop','file-in'];
        ids.forEach(id => this.dom[id] = document.getElementById(id));
    },
    renderStats(s) {
        this.dom['v-steps'].innerText = Math.round(s.steps);
        this.dom['v-speed'].innerText = s.speed.toFixed(1);
        this.dom['v-trip'].innerText = (s.trip/1000).toFixed(2);
        this.dom['v-kcal'].innerText = Math.round(s.kcal);
    },
    renderConsole(nextWp, dist, offRoute, acc) {
        const profile = PROFILES[this.dom['p-select'].value];
        this.dom['display'].innerHTML = `
            <div class="next-label">VOLGEND DOEL:</div>
            <div class="main-val">${nextWp ? nextWp.name : 'FINISH'}</div>
            <div class="sub-val">AFSTAND: ${nextWp ? Math.round(dist) + 'm' : '0m'}</div>
            <div class="status-line">
                AFWIJKING: <span style="color:${offRoute > profile.tolerance ? '#ff4757' : 'var(--accent)'}">${Math.round(offRoute)}m</span><br>
                GPS ACC: ${Math.round(acc)}m
            </div>
        `;
    },
    renderWpList(waypoints) {
        this.dom['wp-list'].innerHTML = waypoints.map((w, i) => `
            <div class="wp-item ${w.status}" onclick="Controller.describeWp(${i})">
                <span>${w.status === 'passed' ? '✅' : (w.status === 'missed' ? '❌' : '⏳')} ${w.name}</span>
                <span>${Math.round(w.routePos)}m</span>
            </div>
        `).join('');
    },
    toggleConfig() {
        const c = document.getElementById('config');
        c.style.display = c.style.display === 'block' ? 'none' : 'block';
    },
    updateProfile() {
        this.dom['unit-label'].innerText = this.dom['p-select'].value === 'wandelen' ? 'Stappen' : 'Omwentelingen';
    }
};

/**
 * MAIN CONTROLLER (Orchestrator)
 */
const Controller = {
    data: { track: [], waypoints: [], cumDist: [] },
    state: { 
        active: false, watchId: null, lastTrackIdx: 0, currentWpIdx: 0, maxDist: 0,
        steps: 0, speed: 0, kcal: 0, trip: 0, lastTick: null, offRouteAlerted: false
    },

    init() {
        UI.init();
        UI.dom['file-in'].onchange = (e) => this.handleFile(e);
    },

    handleFile(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
                const pts = [...xml.getElementsByTagName('trkpt')].map(p => ({
                    lat: +p.getAttribute('lat'), 
                    lon: +p.getAttribute('lon')
                }));
                
                if (pts.length === 0) throw "Geen trackpunten gevonden in GPX.";

                // Cumulatieve afstand berekenen
                this.data.cumDist = [0];
                for(let i=0; i<pts.length-1; i++) {
                    this.data.cumDist[i+1] = this.data.cumDist[i] + GpxEngine.calcDist(pts[i], pts[i+1]);
                }
                this.data.track = pts;

                // Waypoints met Desc support
                this.data.waypoints = [...xml.getElementsByTagName('wpt')].map(w => ({
                    name: w.getElementsByTagName('name')[0]?.textContent || "Punt",
                    desc: w.getElementsByTagName('desc')[0]?.textContent || "",
                    lat: +w.getAttribute('lat'), 
                    lon: +w.getAttribute('lon'),
                    status: 'pending'
                })).map(w => {
                    w.routePos = GpxEngine.findNearest(w, this.data.track, this.data.cumDist, 0).pos;
                    return w;
                }).sort((a,b) => a.routePos - b.routePos);
                
                // Finish toevoegen
                this.data.waypoints.push({
                    name: "FINISH", 
                    desc: "U heeft het eindpunt van de route bereikt.", 
                    lat: pts.at(-1).lat, 
                    lon: pts.at(-1).lon, 
                    status: 'pending', 
                    routePos: this.data.cumDist.at(-1)
                });

                UI.renderWpList(this.data.waypoints);
                UI.dom['display'].innerHTML = `<div style="text-align:center; font-weight:bold; color:var(--green); margin-top:50px;">GPX GEACCEPTEERD.<br>Druk op START om te beginnen.</div>`;
                AudioService.speak("Route succesvol geladen.");
            } catch (err) {
                alert("Fout bij laden GPX: " + err);
            }
        };
        reader.readAsText(e.target.files[0]);
    },

    describeWp(idx) {
        const wp = this.data.waypoints[idx];
        if (!wp.desc || wp.desc.trim() === "") {
            AudioService.speak("Geen extra informatie beschikbaar voor dit knooppunt.", true);
        } else {
            AudioService.speak(wp.desc, true);
        }
    },

    start() {
        if (this.state.active || !this.data.track.length) return;
        this.state.active = true;
        this.state.lastTick = Date.now();
        UI.dom['btn-start'].style.display = 'none';
        UI.dom['btn-stop'].style.display = 'block';
        UI.dom['file-in'].style.display = 'none';
        
        this.state.watchId = navigator.geolocation.watchPosition(
            (p) => this.tick(p), 
            (err) => console.error("GPS Error:", err), 
            { enableHighAccuracy: true }
        );
        
        const first = this.data.waypoints[0];
        AudioService.speak("Tracking geactiveerd. Ga nu naar " + first.name, true);
    },

    stop() {
        if (this.state.watchId) navigator.geolocation.clearWatch(this.state.watchId);
        this.state.active = false;
        UI.dom['btn-stop'].style.display = 'none';
        UI.dom['btn-start'].style.display = 'block';
        AudioService.speak("Tracking gepauzeerd.");
    },

    tick(p) {
        if (!this.state.active) return;
        const { latitude: lat, longitude: lon, accuracy: acc, speed } = p.coords;
        const now = Date.now();
        const dt = (now - this.state.lastTick) / 1000;
        const profile = PROFILES[UI.dom['p-select'].value];
        
        const pos = { lat, lon };
        const R = GpxEngine.findNearest(pos, this.data.track, this.data.cumDist, this.state.lastTrackIdx);
        this.state.lastTrackIdx = R.idx;
        
        if (R.pos > this.state.maxDist) this.state.maxDist = R.pos;

        // AFWIJKINGSDETECTIE (Met cooldown)
        if (R.dist > profile.tolerance) {
            if (!this.state.offRouteAlerted) {
                AudioService.speak("Let op, u wijkt af van de route.");
                this.state.offRouteAlerted = true;
            }
        } else {
            this.state.offRouteAlerted = false;
        }

        // SPORT ENGINE (Telt altijd door zolang we niet bij de FINISH zijn)
        this.state.speed = (speed || 0) * 3.6;
        const distInTick = (speed || 0) * dt;
        
        // Filter ruis bij stilstand
        if (this.state.speed > 1.5) {
            this.state.trip += distInTick;
            this.state.steps += distInTick / profile.stride;
            this.state.kcal += ((profile.met * 3.5 * 85) / 12000) * dt;
        }

        // WAYPOINT POINTER LOGICA
        const nextWp = this.data.waypoints[this.state.currentWpIdx];
        if (nextWp) {
            const dToWp = GpxEngine.calcDist(pos, nextWp);
            
            // Waypoint bereikt
            if (dToWp < 20) {
                this.handleWpPass(nextWp, false);
            } 
            // Waypoint gemist (overschreden op de route)
            else if (this.state.maxDist > nextWp.routePos + 35) {
                this.handleWpPass(nextWp, true);
            }
        }

        UI.renderStats(this.state);
        UI.renderConsole(this.data.waypoints[this.state.currentWpIdx], nextWp ? nextWp.routePos - R.pos : 0, R.dist, acc);
        this.state.lastTick = now;
    },

    handleWpPass(wp, missed = false) {
        wp.status = missed ? 'missed' : 'passed';
        this.state.currentWpIdx++;
        UI.renderWpList(this.data.waypoints);
        
        const isFinish = wp.name === "FINISH";

        if (isFinish) {
            AudioService.speak(missed ? "De finish is gepasseerd. De tracking is nu gestopt." : "Gefeliciteerd, u heeft de bestemming bereikt.", true);
            this.stop(); 
            return;
        }

        // Melding voor huidig punt
        AudioService.speak(missed ? wp.name + " overgeslagen." : wp.name + " bereikt.", true);
        
        // Directe aankondiging volgend punt
        const next = this.data.waypoints[this.state.currentWpIdx];
        if (next) {
            setTimeout(() => {
                AudioService.speak("Ga nu naar " + next.name);
            }, 2500);
        }
    }
};

Controller.init();
</script>
</body>
</html>
