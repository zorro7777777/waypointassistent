<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platina Engine v140 - Industrial Pro</title>

<style>
:root{
    --bg:#f0f2f1;
    --dark:#0f1416;
    --accent:#00ff00;
    --green:#00d1b2;
    --red:#ff3860;
    --panel:#1e272e;
}

body{
    font-family: system-ui, -apple-system, sans-serif;
    background:var(--bg);
    margin:0;
    padding:10px;
    color:#2c3e50;
}

.card{
    max-width:480px;
    margin:auto;
    background:#fff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.12);
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    background:var(--panel);
    color:#fff;
    padding:15px 10px;
    text-align:center;
}

.stats div{ font-size:.7rem; opacity:.7; text-transform: uppercase; }
.stats span{ display:block; font-size:1.1rem; font-weight:800; opacity:1; margin-top:3px; }

#console{
    background:var(--dark);
    color:#fff;
    padding:30px 25px;
    min-height:200px;
    position: relative;
}

#gps-status {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 0.65rem;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 4px;
    background: var(--green);
    color: var(--dark);
}

.main{
    font-size:2.4rem;
    font-weight:900;
    color:var(--accent);
    margin:10px 0;
}

.sub{ opacity:.7; font-size: 1.1rem; }

.controls { padding: 20px; }

button{
    width:100%;
    padding:18px;
    border:none;
    border-radius:12px;
    margin-top:10px;
    font-weight:700;
    cursor:pointer;
    font-size: 1rem;
    transition: 0.2s;
}

.start{ background:var(--green); color:#fff; }
.stop{ background:var(--red); color:#fff; display:none; }
button:disabled { background: #ccc; cursor: not-allowed; }

#wp-container {
    padding: 10px 20px 20px;
    border-top: 1px solid #eee;
}

#wp-list{
    max-height:150px;
    overflow:auto;
    font-size:.9rem;
}

.wp-item{
    display:flex;
    justify-content:space-between;
    padding:10px;
    border-bottom:1px solid #f9f9f9;
}

.passed { color: var(--green); font-weight: bold; background: #f0fff4; }
.missed { color: #aaa; text-decoration: line-through; }
</style>
</head>

<body>

<div class="card">
    <div class="stats">
        <div>Steps<span id="s-steps">0</span></div>
        <div>KM/H<span id="s-speed">0.0</span></div>
        <div>Kcal<span id="s-kcal">0</span></div>
        <div>Trip<span id="s-trip">0.00</span></div>
    </div>

    <div id="console">
        <div id="gps-status">SIGNAL READY</div>
        <div class="sub" id="target-label">GEEN ROUTE</div>
        <div class="main" id="target-dist">---</div>
        <div class="sub" id="progress-info">Laad een GPX bestand</div>
    </div>

    <div class="controls">
        <input type="file" id="file-in" accept=".gpx" style="font-size: 0.8rem;">
        
        <select id="mode" style="width:100%; padding:12px; margin-top:15px; border-radius:8px; border:1px solid #ddd;">
            <option value="wandelen">🚶 Wandelen</option>
            <option value="fietsen">🚲 Fietsen</option>
        </select>

        <button class="start" id="btn-start" disabled>▶ START BEGELEIDING</button>
        <button class="stop" id="btn-stop">🛑 STOP</button>
    </div>

    <div id="wp-container">
        <div style="font-size: 0.7rem; font-weight: bold; margin-bottom: 5px; opacity: 0.5;">WAYPOINTS</div>
        <div id="wp-list"></div>
    </div>
</div>

<script>
/** * PLATINA ENGINE v140 - INDUSTRIAL PRO
 * De meest robuuste versie voor veldgebruik.
 */
const VERSION = "v140_PRO";
const PROFILES = {
    wandelen: { min: 1.1, max: 12, tol: 40, met: 3.5 },
    fietsen: { min: 4.0, max: 65, tol: 80, met: 8.0 }
};

const state = {
    track: [], wp: [], cumDist: [],
    active: false, watchId: null,
    lastTick: 0, prevPos: null,
    maxDist: 0, lastTrackIdx: 0, currentWpIdx: 0,
    steps: 0, trip: 0, kcal: 0, speed: 0,
    lastSavedTrip: 0
};

const dom = {
    steps: document.getElementById("s-steps"),
    speed: document.getElementById("s-speed"),
    kcal: document.getElementById("s-kcal"),
    trip: document.getElementById("s-trip"),
    gps: document.getElementById("gps-status"),
    targetLabel: document.getElementById("target-label"),
    targetDist: document.getElementById("target-dist"),
    progress: document.getElementById("progress-info"),
    wpList: document.getElementById("wp-list"),
    fileIn: document.getElementById("file-in"),
    mode: document.getElementById("mode"),
    startBtn: document.getElementById("btn-start"),
    stopBtn: document.getElementById("btn-stop")
};

// --- CORE LOGICA ---

function getDist(a, b) {
    const R = 6371000;
    const dLat = (b.lat - a.lat) * Math.PI / 180;
    const dLon = (b.lon - a.lon) * Math.PI / 180;
    const x = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180) * Math.cos(b.lat*Math.PI/180) * Math.sin(dLon/2)**2;
    return 2 * R * Math.asin(Math.sqrt(x));
}

function findNear(p) {
    let best = { d: Infinity, i: state.lastTrackIdx };
    const searchRange = 250; // Zoekvenster voor batterijbesparing
    const start = Math.max(0, state.lastTrackIdx - 50);
    const end = Math.min(state.track.length, start + searchRange);

    for (let i = start; i < end; i++) {
        const d = getDist(p, state.track[i]);
        if (d < best.d) {
            // Forward-only constraint: voorkom terugspringen op de route
            if (state.cumDist[i] < state.maxDist - 60 && d > 20) continue;
            best = { d, i };
        }
    }
    return { ...best, pos: state.cumDist[best.i] };
}

// --- DATA HANDLING ---

function loadGPX(e) {
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");
            
            // Track punten
            let pts = [...xml.getElementsByTagName("trkpt")].map(p => ({
                lat: parseFloat(p.getAttribute("lat")),
                lon: parseFloat(p.getAttribute("lon"))
            }));

            // Memory Guard: Downsampling bij extreem grote bestanden
            if (pts.length > 15000) {
                pts = pts.filter((_, i) => i % 3 === 0);
            }
            state.track = pts;

            // Afstanden berekenen
            state.cumDist = [0];
            for (let i = 1; i < state.track.length; i++) {
                state.cumDist[i] = state.cumDist[i-1] + getDist(state.track[i-1], state.track[i]);
            }

            // Waypoints
            state.wp = [...xml.getElementsByTagName("wpt")].map(w => ({
                name: w.getElementsByTagName("name")[0]?.textContent || "Punt",
                lat: parseFloat(w.getAttribute("lat")),
                lon: parseFloat(w.getAttribute("lon")),
                status: 'pending'
            })).map(w => {
                const near = findNear(w);
                return { ...w, routePos: near.pos };
            }).sort((a, b) => a.routePos - b.routePos);

            // Voeg finish toe
            state.wp.push({ name: "FINISH", routePos: state.cumDist.at(-1), status: 'pending' });

            renderWpList();
            dom.startBtn.disabled = false;
            dom.targetLabel.innerText = "ROUTE GELADEN";
            dom.progress.innerText = pts.length + " punten in geheugen";
        } catch (err) {
            alert("Fout bij laden GPX: " + err.message);
        }
    };
    reader.readAsText(e.target.files[0]);
}

// --- ENGINE ---

function tick(p) {
    if (!state.active) return;

    const now = Date.now();
    // Time Clamp: voorkom sprongen als de browser pauzeert
    const dt = Math.min((now - state.lastTick) / 1000, 4.0);
    state.lastTick = now;
    if (dt < 0.8) return;

    let { latitude: lat, longitude: lon, accuracy, speed } = p.coords;
    const prof = PROFILES[dom.mode.value];

    // GPS Filter & Dead Reckoning
    if (accuracy > 55) {
        dom.gps.innerText = "ZWAK SIGNAAL";
        dom.gps.style.background = "orange";
        return; 
    }
    dom.gps.innerText = "GPS OK";
    dom.gps.style.background = "var(--green)";

    // Jump Reject
    if (state.prevPos) {
        if (getDist(state.prevPos, {lat, lon}) > 160) return;
        if (getDist(state.prevPos, {lat, lon}) < 1.0) return; // Drift filter
        
        // Simpele Kalman-smoothing
        lat = (lat * 0.8) + (state.prevPos.lat * 0.2);
        lon = (lon * 0.8) + (state.prevPos.lon * 0.2);
    }

    // Snelheid & Stats
    let spKmu = (speed !== null) ? speed * 3.6 : 0;
    if (speed === null && state.prevPos) {
        spKmu = (getDist(state.prevPos, {lat, lon}) / dt) * 3.6;
    }
    spKmu = Math.min(spKmu, prof.max + 5); // Speed clamp
    state.speed = spKmu;
    state.prevPos = { lat, lon };

    const R = findNear({lat, lon});
    state.lastTrackIdx = R.i;
    state.maxDist = Math.max(state.maxDist, R.pos);

    if (spKmu >= prof.min) {
        const dTick = (spKmu / 3.6) * dt;
        state.trip += dTick;
        state.steps += dTick / 0.67;
        state.kcal += ((prof.met * 3.5 * 85) / 12000) * dt; // Calorieën op basis van 85kg
    }

    // Waypoint Logic
    const nextWp = state.wp[state.currentWpIdx];
    if (nextWp) {
        const dToWp = getDist({lat, lon}, nextWp);
        // Bereikt? (binnen 25m en op de route)
        if (dToWp < 25 && Math.abs(state.maxDist - nextWp.routePos) < 60) {
            passWp(nextWp);
        } 
        // Gemist? (je bent al 50m voorbij het punt op de route)
        else if (state.maxDist > nextWp.routePos + 50) {
            passWp(nextWp, true);
        }
    }

    // Smart Save: alleen bij echte voortgang (batterij!)
    if (Math.abs(state.trip - state.lastSavedTrip) > 25) {
        saveState();
        state.lastSavedTrip = state.trip;
    }

    updateUI(nextWp, R.d);
}

function passWp(wp, missed = false) {
    wp.status = missed ? 'missed' : 'passed';
    state.currentWpIdx++;
    renderWpList();
    if (wp.name === "FINISH") stop();
}

function updateUI(nextWp, offRouteDist) {
    dom.steps.innerText = Math.round(state.steps);
    dom.speed.innerText = state.speed.toFixed(1);
    dom.kcal.innerText = Math.round(state.kcal);
    dom.trip.innerText = (state.trip / 1000).toFixed(2);

    if (nextWp) {
        dom.targetLabel.innerText = nextWp.name;
        dom.targetDist.innerText = Math.round(Math.max(0, nextWp.routePos - state.maxDist)) + "m";
        const prof = PROFILES[dom.mode.value];
        dom.progress.innerText = offRouteDist > prof.tol ? "⚠️ AFWIJKING ROUTE" : "Op koers";
        dom.progress.style.color = offRouteDist > prof.tol ? "var(--red)" : "white";
    }
}

function renderWpList() {
    dom.wpList.innerHTML = state.wp.map(w => `
        <div class="wp-item ${w.status}">
            <span>${w.name}</span>
            <span>${Math.round(w.routePos)}m</span>
        </div>
    `).join('');
}

function start() {
    if (!state.track.length) return;
    state.active = true;
    state.lastTick = Date.now();
    state.watchId = navigator.geolocation.watchPosition(tick, null, {
        enableHighAccuracy: true, timeout: 5000
    });
    dom.startBtn.style.display = "none";
    dom.stopBtn.style.display = "block";
}

function stop() {
    state.active = false;
    navigator.geolocation.clearWatch(state.watchId);
    dom.startBtn.style.display = "block";
    dom.stopBtn.style.display = "none";
    saveState();
}

function saveState() {
    localStorage.setItem('platina_engine_state', JSON.stringify({
        v: VERSION,
        steps: state.steps,
        trip: state.trip,
        kcal: state.kcal,
        maxDist: state.maxDist,
        currentWpIdx: state.currentWpIdx
    }));
}

dom.fileIn.onchange = loadGPX;
dom.startBtn.onclick = start;
dom.stopBtn.onclick = stop;
</script>

</body>
</html>
