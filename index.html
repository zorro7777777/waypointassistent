<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAYPOINTASSISTENT PRO V4.7</title>

<style>
:root {
    --bg-dark:#1a1a1a;
    --accent:#00bfff;
    --success:#27ae60;
    --warning:#f39c12;
    --danger:#e74c3c;
    --text:#2c3e50;
}

body{
    font-family:system-ui;
    margin:0;
    padding:6px;
    background:#f0f3f5;
    color:var(--text);
    font-size:13px;
}

.card{
    max-width:520px;
    margin:auto;
    background:#fff;
    padding:12px;
    border-radius:14px;
    box-shadow:0 8px 20px rgba(0,0,0,.12);
}

#console{
    background:var(--bg-dark);
    color:#00ff88;
    padding:12px;
    border-radius:10px;
    min-height:100px;
    font-family:monospace;
}

.row{display:flex;gap:8px;margin-top:10px}
button{
    flex:1;
    border:none;
    padding:12px;
    border-radius:8px;
    color:white;
    font-weight:bold;
}

.btn-start{background:var(--success)}
.btn-blue{background:var(--accent);flex:.6}
.btn-red{background:var(--danger);flex:.6}

.stat-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    text-align:center;
    margin:10px 0;
}

.stat-value{font-size:1.6rem;color:var(--accent);font-weight:800}
.stat-label{font-size:.7rem;opacity:.6}
</style>
</head>

<body>

<div class="card">

<h3>WAYPOINTASSISTENT <span style="color:var(--accent)">V4.7</span></h3>

<div class="stat-grid">
<div><div class="stat-label">Off</div><div id="off" class="stat-value">0m</div></div>
<div><div class="stat-label">KM/U</div><div id="spd" class="stat-value">0</div></div>
<div><div class="stat-label">Acc</div><div id="acc" class="stat-value">0</div></div>
</div>

<div id="console">
Laad GPX bestand...
</div>

<div class="row">
<button id="startBtn" class="btn-start" onclick="APP.start()">START</button>
<button class="btn-blue" onclick="UI.toggle()">⚙</button>
<button class="btn-red" onclick="APP.stop()">STOP</button>
</div>

<input type="file" id="gpx" style="margin-top:10px;width:100%">

</div>

<script>

const STATE = {
    IDLE:"IDLE",
    RUN:"RUN",
    PAUSE:"PAUSE",
    END:"END"
};

const CORE = {
    state:STATE.IDLE,
    watch:null,
    track:[],
    cum:[],
    wp:[],
    total:0,
    idx:0,

    sess:{
        last:0,
        speedEMA:0,
        dist:0,
        move:0,
        pause:0,
        kcal:0,
        lastLat:0,
        lastLon:0,
        off:false,
        lastSpeak:0
    }
};

// ---------------- LOGIC ----------------
const LOG = {

dist(a,b,c,d){
    const R=6371000,t=Math.PI/180;
    const x=(c-a)*t;
    const y=(d-b)*t;
    const s=Math.sin(x/2)**2 + Math.cos(a*t)*Math.cos(c*t)*Math.sin(y/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
},

ema(old,cur,alpha=0.25){
    return old + alpha*(cur-old);
},

speed(kmh){
    if(kmh<1) return 0;
    return kmh;
}

};

// ---------------- UI ----------------
const UI = {

update(p){

    if(!CORE.track.length) return;

    const s = CORE.sess;

    document.getElementById("spd").innerText = p.speed.toFixed(1);
    document.getElementById("acc").innerText = Math.round(p.acc);
    document.getElementById("off").innerText = Math.round(p.off)+"m";

    let wp = CORE.wp.find(w=>!w.done);

    if(wp){
        document.getElementById("console").innerHTML =
        `WP: ${wp.name}<br>Dist: ${Math.round(wp.pos - p.route)}m<br>ETA: ${p.eta}`;
    }

}

};

// ---------------- APP ----------------
const APP = {

init(){
    document.getElementById("gpx").onchange=(e)=>this.load(e);
},

load(e){
    let r=new FileReader();
    r.onload=(ev)=>{

        let xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

        let pts=[...xml.getElementsByTagName("trkpt")];

        CORE.track=pts.map(p=>({
            lat:+p.getAttribute("lat"),
            lon:+p.getAttribute("lon")
        }));

        CORE.cum=[0];

        for(let i=0;i<CORE.track.length-1;i++){
            CORE.cum[i+1]=CORE.cum[i]+LOG.dist(
                CORE.track[i].lat,CORE.track[i].lon,
                CORE.track[i+1].lat,CORE.track[i+1].lon
            );
        }

        CORE.total=CORE.cum.at(-1);

        CORE.wp=[...xml.getElementsByTagName("wpt")].map(w=>{
            let lat=+w.getAttribute("lat");
            let lon=+w.getAttribute("lon");

            let best=0,bd=1e9;

            CORE.track.forEach((t,i)=>{
                let d=LOG.dist(lat,lon,t.lat,t.lon);
                if(d<bd){bd=d;best=CORE.cum[i];}
            });

            return {
                name:w.querySelector("name")?.textContent||"WP",
                lat,lon,pos:best,done:false
            };
        });

        document.getElementById("console").innerText="GPX geladen ✔";
    };

    r.readAsText(e.target.files[0]);
},

start(){
    if(CORE.state===STATE.RUN) return;

    CORE.state=STATE.RUN;

    CORE.watch=navigator.geolocation.watchPosition(
        this.gps.bind(this),
        e=>console.warn("GPS error",e),
        {enableHighAccuracy:true,maximumAge:1000,timeout:10000}
    );
},

stop(){
    if(CORE.watch) navigator.geolocation.clearWatch(CORE.watch);
    CORE.state=STATE.END;
    speechSynthesis.cancel();
},

gps(p){

    let now=Date.now();
    let dt=CORE.sess.last? (now-CORE.sess.last)/1000 : 0;
    CORE.sess.last=now;

    let lat=p.coords.latitude;
    let lon=p.coords.longitude;
    let acc=p.coords.accuracy;
    let sp=(p.coords.speed||0)*3.6;

    CORE.sess.speedEMA=LOG.ema(CORE.sess.speedEMA,sp);

    let route=0,bd=9999;

    for(let i=0;i<CORE.track.length-1;i++){

        let d=LOG.dist(lat,lon,CORE.track[i].lat,CORE.track[i].lon);
        if(d<bd){
            bd=d;
            route=CORE.cum[i];
        }

    }

    if(sp>1 && sp<60){
        CORE.sess.move+=dt;
        CORE.sess.dist+=sp/3.6*dt;
    } else CORE.sess.pause+=dt;

    let wp=CORE.wp.find(w=>!w.done);

    let eta="--";

    if(wp && sp>2){
        let sec=(wp.pos-route)/(sp/3.6);
        if(sec>0 && isFinite(sec)){
            eta=Math.round(sec/60)+" min";
        }
    }

    if(wp && route>wp.pos){
        wp.done=true;
        this.speak("Waypoint "+wp.name);
    }

    UI.update({
        speed:CORE.sess.speedEMA,
        acc,
        off:bd,
        route,
        eta
    });

},

speak(t){
    let u=new SpeechSynthesisUtterance(t);
    u.lang="nl-NL";
    speechSynthesis.speak(u);
}

};

APP.init();

</script>

</body>
</html>
