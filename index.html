<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAYPOINTASSISTENT PRO</title>
    <style>
        /* --- VISUELE STYLING --- */
        body { font-family: sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }
        .card { max-width: 600px; margin: auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        
        /* Het zwarte 'dashboard' scherm */
        #info { 
            background: #1a1a1a; color: #00ff00; padding: 15px; border-radius: 8px; 
            font-family: monospace; margin: 10px 0; min-height: 480px; line-height: 1.3; 
            border-left: 5px solid #27ae60; font-size: 1.1rem; position: relative; 
        }
        
        .gear-icon { position: absolute; top: 10px; right: 10px; font-size: 1.2rem; cursor: pointer; opacity: 0.7; z-index: 10; }
        .highlight { color: #fff; font-weight: bold; font-size: 1.3rem; }
        .field-yellow { color: #ffff00; font-weight: bold; font-size: 0.95rem; display: block; margin-top: 2px; }
        .field-green { color: #00ff00; font-weight: bold; }
        
        /* Configuratie paneel (verborgen bij start) */
        .config-section { background: #ecf0f1; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #dcdde1; display: none; }
        
        /* Knoppen en layout */
        .row { display: flex; gap: 5px; align-items: center; margin-bottom: 8px; }
        button { padding: 12px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; flex: 1; }
        .start { background: #27ae60; flex: 2; } 
        .pause { background: #f39c12; flex: 2; } 
        .toggle-list { background: #3498db; flex: 0.4; }
        #resetBtn { background: #e74c3c; flex: 0.4; display: none; }
        .copy-btn { background: #34495e; padding: 8px; font-size: 0.75rem; margin-top: 10px; border: 1px solid #5d6d7e; width: 100%; color: #bdc3c7; }
        
        /* GPX upload styling */
        #gpxInput { width:100%; margin-bottom:10px; border:1px solid #ccc; padding:5px; border-radius:5px; }
        
        /* Tabel voor waypoints */
        table { width: 100%; border-collapse: collapse; font-size: 0.8rem; margin-top: 10px; }
        td { padding: 8px 0; border-bottom: 1px solid #f1f1f1; }
    </style>
</head>
<body>

<div class="card">
    <h1 style="text-align:center; font-size:1.1rem; margin:0 0 5px 0; color:#2c3e50;">WAYPOINTASSISTENT</h1>

    <div class="config-section" id="configArea">
        <div class="row">
            <select id="profile" onchange="updateProfile()" style="padding:4px; flex: 1;">
                <option value="wandelen">🚶 Wandelen</option>
                <option value="fietsen">🚲 Fietsen</option>
            </select>
            <div style="font-size: 0.8rem;">Gewicht: <input type="number" id="userWeight" style="width:40px" value="92">kg</div>
        </div>
        <label><input type="checkbox" id="audioToggle" checked> 🔊 Spraak inschakelen</label>
    </div>

    <input type="file" id="gpxInput" accept=".gpx">
    
    <div class="row">
        <button onclick="handleStartPause()" id="startBtn" class="start">▶ START</button>
        <button onclick="toggleTable()" class="toggle-list">📑</button>
        <button onclick="location.reload()" id="resetBtn">🔄</button>
    </div>
    
    <div id="info">
        <div class="gear-icon" onclick="toggleConfig()">⚙️</div>
        <div id="display-content">Systeem gereed. Upload een GPX bestand om te beginnen.</div>
    </div>

    <div id="tableCon" style="display:none;">
        <div style="font-size:0.75rem; font-weight:bold; padding:8px; background:#dfe6e9; border-radius:5px; text-align:center;" id="wp-summary">Geen route geladen</div>
        <table><tbody id="list"></tbody></table>
    </div>
</div>

<script>
/**
 * --- INSTELBARE PARAMETERS ---
 */
const PROFS = {
    wandelen: { ms: 0.5, max: 7, th: 0.67, radius: 12, unit: "Stappen" },
    fietsen:  { ms: 1.95, max: 45, th: 2.10, radius: 25, unit: "Omwentelingen" }
};

// --- HUIDIGE CONFIG ---
let CONFIG = { ...PROFS.wandelen };

// --- ROUTE STATE ---
let track = [];
let waypoints = [];
let cumDist = [];

// --- GPS STATE ---
let watchId = null;
let lastPos = null;
let maxRoutePos = 0;
let tripDist = 0;
let finished = false;

// --- SPORT METRICS ---
let sport = {
    steps: 0,
    kcal: 0,
    movingTime: 0,
    idleTime: 0,
    lastTick: null
};

// --- ROUTE FLAGS ---
let alertTime = 0;
let isOffRoute = false;
let isPaused = false;

// --- ETA CACHE ---
let lastEtaUpdate = 0;
let cachedArrival = "--:--";

// --- GPS FILTER STATE ---
let smoothLat = null;
let smoothLon = null;

const SMOOTHING_FACTOR = 0.35;
const ACCURACY_LIMIT = 25;

// --- SPEECH ENGINE ---
let speechQueue = [];
let isSpeaking = false;

function speak(text) {

    if (!document.getElementById('audioToggle')?.checked) return;

    const cleanText = String(text)
        .replaceAll("START", "Startpunt")
        .replaceAll("FINISH", "De Finish");

    speechQueue.push(cleanText);
    processQueue();
}

function processQueue() {

    if (isSpeaking || speechQueue.length === 0) return;

    isSpeaking = true;

    const msg = new SpeechSynthesisUtterance(speechQueue.shift());
    msg.lang = 'nl-NL';
    msg.rate = 0.95;

    msg.onend = () => {
        setTimeout(() => {
            isSpeaking = false;
            processQueue();
        }, 1200);
    };

    window.speechSynthesis.speak(msg);
}

// --- TIME FORMAT ---
function fmtT(s) {

    if (!Number.isFinite(s) || s < 0) return "00:00:00";

    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = Math.floor(s % 60);

    return (
        String(h).padStart(2, '0') + ":" +
        String(m).padStart(2, '0') + ":" +
        String(sec).padStart(2, '0')
    );
}

// --- HAVERSINE DISTANCE ---
function getDist(a, b, c, d) {

    const R = 6371000;

    const dLat = (c - a) * Math.PI / 180;
    const dLon = (d - b) * Math.PI / 180;

    const lat1 = a * Math.PI / 180;
    const lat2 = c * Math.PI / 180;

    const x =
        Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1) *
        Math.cos(lat2) *
        Math.sin(dLon / 2) ** 2;

    return 2 * R * Math.asin(Math.sqrt(x));
}

// Zoekt dichtstbijzijnde punt op de route voor ETA en Off-route checks
function getRInfo(lat, lon) {

    let bestDist = Infinity;
    let bestRoutePos = 0;

    const len = track.length;

    for (let i = 0; i < len; i++) {

        const t = track[i];

        const d = getDist(lat, lon, t.lat, t.lon);

        if (d < bestDist) {
            bestDist = d;
            bestRoutePos = cumDist[i];

            // kleine optimalisatie: perfecte match
            if (bestDist < 2) break;
        }
    }

    return {
        pos: bestRoutePos,
        off: bestDist
    };
}

// --- UI HANDLERS ---
function toggleConfig() {
    const el = document.getElementById('configArea');
    const reset = document.getElementById('resetBtn');
    const isHidden = (el.style.display === 'none' || el.style.display === '');
    el.style.display = isHidden ? 'block' : 'none';
    reset.style.display = isHidden ? 'block' : 'none';
}

function toggleTable() {
    const el = document.getElementById('tableCon');
    el.style.display = (el.style.display === 'none') ? 'block' : 'none';
}


// GPX PARSER
document.getElementById('gpxInput').onchange = e => {

    const file = e.target.files?.[0];
    if (!file) return;

    const r = new FileReader();

    r.onload = ev => {

        const xml = new DOMParser().parseFromString(ev.target.result, "text/xml");

        const pts = [...xml.getElementsByTagName('trkpt')];

        if (!pts.length) {
            speak("Geen track gevonden in GPX bestand.");
            return;
        }

        track = pts.map(p => ({
            lat: +p.getAttribute('lat'),
            lon: +p.getAttribute('lon')
        }));

        // -------------------------
        // ROUTE AFSTAND (cumulatief)
        // -------------------------
        cumDist = [0];

        for (let i = 1; i < track.length; i++) {
            cumDist[i] =
                cumDist[i - 1] +
                getDist(
                    track[i - 1].lat,
                    track[i - 1].lon,
                    track[i].lat,
                    track[i].lon
                );
        }

        // -------------------------
        // WAYPOINTS
        // -------------------------
        let tempWps = [...xml.getElementsByTagName('wpt')].map(w => ({
            name: w.getElementsByTagName('name')[0]?.textContent || "Punt",
            lat: +w.getAttribute('lat'),
            lon: +w.getAttribute('lon'),
            passed: false,
            missed: false,
            touched: false
        }));

        // START / FINISH altijd correct uit track
        tempWps.push({
            name: "START",
            lat: track[0].lat,
            lon: track[0].lon,
            passed: false,
            missed: false,
            touched: false
        });

        tempWps.push({
            name: "FINISH",
            lat: track.at(-1).lat,
            lon: track.at(-1).lon,
            passed: false,
            missed: false,
            touched: false
        });

        // -------------------------
        // ROUTE POSITION INDEXERING
        // -------------------------

        waypoints = tempWps.map(w => {

            const r = getRInfo(w.lat, w.lon);

            w.routePos = r.pos;
            w.offDistance = r.off;

            return w;
        });

        // sorteer op route volgorde
        waypoints.sort((a, b) => a.routePos - b.routePos);

        // -------------------------
        // RESET STATE (BELANGRIJK)
        // -------------------------
        maxRoutePos = 0;
        lastIndex = 0;
        lastPos = null;

        updateWPUI();

        const totalKm = (cumDist.at(-1) / 1000).toFixed(1);

        speak(`Route geladen. ${waypoints.length} punten over ${totalKm} kilometer.`);

        document.getElementById('display-content').innerText =
            "Route geladen. Klik op START.";

    };

    r.readAsText(file);
};

function updateWPUI() {

    const p = waypoints.filter(w => w.passed).length;
    const m = waypoints.filter(w => w.missed).length;

    document.getElementById('wp-summary').innerText =
        `✅ ${p} | ❌ ${m} | ⏳ ${waypoints.length - p - m}`;

    document.getElementById('list').innerHTML = waypoints.map(w => `
        <tr style="${
            w.passed
                ? 'color:#27ae60;font-weight:bold;'
                : (w.missed
                    ? 'color:#e74c3c;text-decoration:line-through;'
                    : '')
        }">
            <td style="width:25px">
                ${w.passed ? '✅' : (w.missed ? '❌' : '⏳')}
            </td>
            <td>${w.name}</td>
            <td style="text-align:right">${Math.round(w.routePos)}m</td>
        </tr>
    `).join('');
}

function handleStartPause() {
    const btn = document.getElementById('startBtn');
    if (!watchId) {
        startGPS();
        btn.innerText = "⏸ PAUZE"; btn.className = "pause";
        speak("Systeem actief. Ik wens jou een goede reis toe.");
    } else {
        isPaused = !isPaused;
        if (isPaused) {
            btn.innerText = "▶ HERVAT"; btn.className = "start";
            speak("Pauze.");
            sport.lastTick = null;
        } else {
            btn.innerText = "⏸ PAUZE"; btn.className = "pause";
            speak("Hervatting.");
            sport.lastTick = Date.now();
        }
    }
}

// --- CORE GPS LOOP ---
function startGPS() {
    if (watchId || !track.length) return;

    document.getElementById('gpxInput').style.display = 'none';

    if ('wakeLock' in navigator) {
        navigator.wakeLock.request('screen').catch(()=>{});
    }

    watchId = navigator.geolocation.watchPosition(p => {

        if (finished || isPaused) return;

        const { latitude: rawLat, longitude: rawLon, accuracy: acc, speed: s } = p.coords;
        const now = Date.now();
        const dt = sport.lastTick ? (now - sport.lastTick) / 1000 : 0;

        // 1. ACCURACY FILTER
        if (acc > ACCURACY_LIMIT) return;

        // 2. EMA SMOOTHING + JUMP FILTER
        if (smoothLat === null) {
            smoothLat = rawLat;
            smoothLon = rawLon;
        } else {
            const jumpDist = getDist(smoothLat, smoothLon, rawLat, rawLon);

            // voorkomt GPS spikes in stad
            if (dt > 0 && (jumpDist / dt) > 15) return;

            smoothLat = rawLat * SMOOTHING_FACTOR + smoothLat * (1 - SMOOTHING_FACTOR);
            smoothLon = rawLon * SMOOTHING_FACTOR + smoothLon * (1 - SMOOTHING_FACTOR);
        }

        // 3. BETROUWBARE SNELHEID (GPS + motion fallback)
        let gpsSpeed = (s || 0) * 3.6;

        let motionSpeed = 0;
        if (lastPos && dt > 0) {
            const d = getDist(lastPos.lat, lastPos.lon, smoothLat, smoothLon);
            motionSpeed = (d / dt) * 3.6;
        }

        const skmh = (gpsSpeed > 1 && gpsSpeed < 80) ? gpsSpeed : motionSpeed;

        // 4. ROUTE POSITION
        const R = getRInfo(smoothLat, smoothLon);
        if (R.pos > maxRoutePos) maxRoutePos = R.pos;

        // 5. OFF-ROUTE LOGIC (met context)
        if (R.off > 45 && now - alertTime > 25000) {

            const nextWp = waypoints.find(w => !w.passed && !w.missed);

            if (nextWp) {
                speak("Je bent " + Math.round(R.off) + " meter van de route. Draai terug richting de route.");
            } else {
                speak("Je bent " + Math.round(R.off) + " meter van de route afgeweken.");
            }

            alertTime = now;
            isOffRoute = true;

        } else if (isOffRoute && R.off < 10) {
            speak("Je bent terug op de route.");
            isOffRoute = false;
        }

        // 6. TRIP TRACKING
        const isMoving = skmh >= (CONFIG.ms * 3.6) && skmh <= CONFIG.max;
        const weight = parseFloat(document.getElementById('userWeight').value) || 92;

        const metVal =
            document.getElementById('profile').value === 'wandelen'
                ? (0.75 * skmh + 0.5)
                : (0.4 * skmh);

        if (lastPos) {
            const d = getDist(lastPos.lat, lastPos.lon, smoothLat, smoothLon);

            if (d > 0.6 && d < 35) {
                tripDist += d;
            }
        }

        lastPos = { lat: smoothLat, lon: smoothLon };

        if (isMoving) {
            sport.movingTime += dt;
            sport.steps += ((skmh / 3.6) * dt) / CONFIG.th;
            sport.kcal += (metVal * 3.5 * weight / 200) * (dt / 60);
        } else if (dt > 0) {
            sport.idleTime += dt;
        }

        // 7. WAYPOINT LOGIC (stabiel + anti-false miss)
        waypoints.forEach((w, i) => {

            if (w.passed || w.missed) return;

            const d = getDist(smoothLat, smoothLon, w.lat, w.lon);

            const dynamicRadius = Math.max(
                CONFIG.radius,
                Math.min(CONFIG.radius * 2.5, (acc || 10) * 1.2)
            );

            if (d <= dynamicRadius) w.touched = true;

            if (w.touched && R.pos >= w.routePos - CONFIG.radius) {

                w.passed = true;

                if (i === waypoints.length - 1) {
                    finished = true;
                    speak("Finish! Je bent op uw bestemming aangekomen.");
                    navigator.geolocation.clearWatch(watchId);
                } else {
                    speak(w.name);

                    const nxt = waypoints.find(nw => !nw.passed && !nw.missed);
                    if (nxt) speak("Het volgende waypoint is: " + nxt.name);
                }

                updateWPUI();
            }

            else if (
                maxRoutePos > w.routePos + CONFIG.radius + acc + 12 &&
                d > dynamicRadius
            ) {
                w.missed = true;
                speak("Waypoint gemist: " + w.name);
                updateWPUI();
            }
        });

        // 8. ETA + DISPLAY (ongewijzigd conceptueel)
        const next = waypoints.find(w => !w.passed && !w.missed);
        const avgV = R.pos > 20 ? (R.pos / 1000) / (sport.movingTime / 3600) : 0;

        if (now - lastEtaUpdate > 60000 || cachedArrival === "--:--") {

            const remaining = cumDist.at(-1) - R.pos;

            if (avgV > 0.5) {
                const arrival = new Date(now + (remaining / (avgV / 3.6)) * 1000);

                cachedArrival =
                    arrival.getHours().toString().padStart(2, '0') + ":" +
                    arrival.getMinutes().toString().padStart(2, '0');
            }

            lastEtaUpdate = now;
        }

        // 9. STATE UPDATE
        sport.lastTick = now;

    }, err => console.error(err), {
        enableHighAccuracy: true,
        maximumAge: 0,
        timeout: 10000
    });
}

        document.getElementById('display-content').innerHTML = `
            <b style="color:#ffff00">VOLGEND:</b><br>
            <span class="highlight" style="color:#00ff00;">${finished ? 'FINISH' : (next ? next.name : '---')}</span><br>
            <b>AFSTAND:</b> <span class="highlight">${(next && !finished) ? Math.max(0, Math.round(next.routePos - R.pos)) : 0}m</span><br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>${CONFIG.unit.toUpperCase()}:</b> <span class="field-green">${Math.round(sport.steps)}</span><br>
            <b>TRIP:</b> <span class="field-green">${(tripDist/1000).toFixed(3)} km</span><br>
            <b>BEWOGEN TIJD:</b> <span class="field-green">${fmtT(sport.movingTime)}</span><br>
            <b>PAUZE TIJD:</b> <span class="field-green">${fmtT(sport.idleTime)}</span><br>
            <b>AANKOMST:</b> <span class="field-green">${finished ? 'BEREIKT' : cachedArrival}</span><br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>SPEED:</b> ${skmh.toFixed(1)} km/u<br>
            <b>AVG SPEED:</b> ${avgV.toFixed(2)} km/u<br>
            <b>ENERGIE:</b> ${Math.round(sport.kcal)} kcal<br>
            <b>POWER:</b> ${metVal.toFixed(1)} MET<br>
            <hr style="border:0; border-top:1px solid #444; margin:5px 0;">
            <b>OFF-TRACK:</b> <span style="color:${R.off > 50 ? '#e74c3c' : '#00ff00'}">${Math.round(R.off)}m</span><br>
            <b>ACCURACY:</b> ${acc.toFixed(0)}m<br>
            <span class="field-yellow">LAT: ${smoothLat.toFixed(6)}</span>
            <span class="field-yellow">LON: ${smoothLon.toFixed(6)}</span>
            <button class="copy-btn" onclick="navigator.clipboard.writeText('${smoothLat.toFixed(6)},${smoothLon.toFixed(6)}')">📍 KOPIEER COÖRDINATEN</button>
        `;
        
        sport.lastTick = now; // Update tijdstempel voor de volgende meting
    }, err => console.error(err), { enableHighAccuracy: true, maximumAge: 0 });
}

function updateProfile() {
    const val = document.getElementById('profile').value;
    CONFIG = { ...PROFS[val] };
    speak(`Profiel ingesteld op ${val}.`);
}
</script>
</body>
</html>
