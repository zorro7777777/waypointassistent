<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strava PRO Engine v21.1 FIX</title>

<style>
body{font-family:Arial}
.version{color:#666;margin-bottom:10px}
table{border-spacing:3px}
td,th{border:2px double black;padding:6px}

.controls{display:flex;gap:10px;margin:10px 0}
button{flex:1;padding:12px;font-size:16px;border:none;border-radius:6px;color:white}

.startBtn{background:#2ecc71}
.stopBtn{background:#e74c3c}
.pauseBtn{background:#f39c12}
.resumeBtn{background:#2ecc71}
</style>
</head>

<body>

<h1>GPX Strava PRO Engine</h1>
<div class="version">v21.1 FIX + Stable Load + Table Fix</div>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
<button id="startBtn" class="startBtn">▶️ Start</button>
<button id="pauseBtn" class="pauseBtn" disabled>⏸️ Pauze</button>
</div>

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints</h2>
<table>
<thead>
<tr>
<th>Status</th>
<th>Naam</th>
<th>Segment (m)</th>
</tr>
</thead>
<tbody id="list"></tbody>
</table>

<script>

// ================= STATE =================
let track=[];
let waypoints=[];
let cumDist=[];

let watchId=null;
let active=false;
let paused=false;

let maxRoutePos=0;

// GPS smoothing
let buffer=[];

// warmup
let warmup=true;
let fixCount=0;

// metrics
let gpsTrip=0;
let lastLat=null;
let lastLon=null;
let lastTime=null;

// ================= CONFIG =================
const RADIUS=20;
const TRACK_TOL=7;

const STEP_LENGTH=0.67;
const USER_WEIGHT=75;

const BUFFER_SIZE=5;
const MAX_STEP_DISTANCE=30;
const MAX_SPEED_KMH=12;

// ================= DIST =================
function dist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
const x=Math.sin(dLat/2)**2 +
Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*
Math.sin(dLon/2)**2;
return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

// ================= POLYLINE =================
function buildPolyline(){
cumDist=[0];
for(let i=0;i<track.length-1;i++){
const d=dist(track[i].lat,track[i].lon,track[i+1].lat,track[i+1].lon);
cumDist[i+1]=(cumDist[i]||0)+d;
}
}

// ================= PROJECT =================
function projectOnRoute(lat,lon){
let bestDist=Infinity;
let bestPos=0;

for(let i=0;i<track.length;i++){
const d=dist(lat,lon,track[i].lat,track[i].lon);
if(d<bestDist){
bestDist=d;
bestPos=cumDist[i];
}
}
return bestPos;
}

// ================= DIST TO TRACK =================
function pointToSegment(px,py,ax,ay,bx,by){
const A=px-ax,B=py-ay,C=bx-ax,D=by-ay;
const dot=A*C+B*D;
const len=C*C+D*D;

let t=len===0?0:dot/len;
t=Math.max(0,Math.min(1,t));

const x=ax+t*C;
const y=ay+t*D;

return dist(px,py,x,y);
}

function minDistToTrack(lat,lon){
let best=Infinity;
for(let i=0;i<track.length-1;i++){
const d=pointToSegment(lat,lon,track[i].lat,track[i].lon,track[i+1].lat,track[i+1].lon);
if(d<best) best=d;
}
return best;
}

// ================= LOAD =================
document.getElementById('gpxFile').onchange=e=>{
const r=new FileReader();

r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");

// TRACK
track=[...xml.getElementsByTagName('trkpt')]
.map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));

// SAFETY CHECK
if(!track || track.length<2){
document.getElementById('info').innerHTML="❌ Ongeldige GPX";
return;
}

buildPolyline();

// RESET
maxRoutePos=0;
gpsTrip=0;
buffer=[];
lastLat=null;
lastLon=null;
lastTime=null;
warmup=true;
fixCount=0;

// WAYPOINTS
waypoints=[...xml.getElementsByTagName('wpt')]
.map(x=>({
name:x.getElementsByTagName('name')[0]?.textContent||"WP",
lat:+x.getAttribute('lat'),
lon:+x.getAttribute('lon'),
routePos:0,
passed:false,
missed:false,
segment:0
}));

// START + END
waypoints.unshift({
name:"Start",lat:track[0].lat,lon:track[0].lon,routePos:0,passed:true,missed:false,segment:0
});

waypoints.push({
name:"Einde",lat:track.at(-1).lat,lon:track.at(-1).lon,routePos:0,passed:false,missed:false,segment:0
});

// SORT
waypoints.forEach(w=>w.routePos=projectOnRoute(w.lat,w.lon));
waypoints.sort((a,b)=>a.routePos-b.routePos);

// SEGMENTS
for(let i=0;i<waypoints.length;i++){
if(i===0){waypoints[i].segment=0;continue;}
waypoints[i].segment=Math.max(0,waypoints[i].routePos-waypoints[i-1].routePos);
}

// FIXED UI UPDATE (NO CRASH)
document.getElementById('info').innerHTML=
`✅ GPX geladen<br>
📏 ${(cumDist.at(-1)/1000).toFixed(2)} km<br>
📌 Waypoints: ${waypoints.length}`;

render();
};

r.readAsText(e.target.files[0]);
};

// ================= GPS =================
function startTracking(){

if(watchId) return;

watchId=navigator.geolocation.watchPosition(p=>{

if(!active || paused) return;

const lat=p.coords.latitude;
const lon=p.coords.longitude;
const speed=(p.coords.speed||0)*3.6;
const now=p.timestamp||Date.now();

// ================= WARMUP =================
fixCount++;

if(fixCount<5){
document.getElementById('info').innerHTML=
`📡 GPS stabilisatie (${fixCount}/5)`;
return;
}

warmup=false;

// ================= ANTI JUMP =================
if(lastLat){
const stepDist=dist(lastLat,lastLon,lat,lon);
if(stepDist>MAX_STEP_DISTANCE) return;
}

if(speed>MAX_SPEED_KMH) return;

// ================= SMOOTHING =================
let d=0;
if(lastLat){
d=dist(lastLat,lastLon,lat,lon);
buffer.push(d);
if(buffer.length>BUFFER_SIZE) buffer.shift();
d=buffer.reduce((a,b)=>a+b,0)/buffer.length;
}
gpsTrip+=d;

const pos=projectOnRoute(lat,lon);
if(pos>maxRoutePos) maxRoutePos=pos;

// ================= WAYPOINT ENGINE =================
for(let w of waypoints){

if(w.passed||w.missed) continue;

const onTrack=minDistToTrack(w.lat,w.lon)<=TRACK_TOL;

if(!onTrack){w.missed=true;continue;}

if(pos>=w.routePos-RADIUS){w.passed=true;continue;}

if(maxRoutePos>w.routePos+RADIUS){w.missed=true;}
}

// ================= METRICS =================
let dt=lastTime?(now-lastTime)/1000:1;
lastTime=now;

const steps=gpsTrip/STEP_LENGTH;
const cadence=(steps/dt)*60;

const MET=speed<4?2:speed<5.5?3:speed<7?3.5:4.5;
const calories=(gpsTrip/1000)*USER_WEIGHT*MET;

lastLat=lat;
lastLon=lon;

// ================= UI =================
document.getElementById('info').innerHTML=`
📍 ${lat.toFixed(5)}, ${lon.toFixed(5)}<br>
📏 Track: ${(cumDist.at(-1)/1000).toFixed(2)} km<br>
🧭 Trip: ${(gpsTrip/1000).toFixed(2)} km<br>
🚶 ${speed.toFixed(2)} km/u<br>
👣 ${Math.round(steps)}<br>
🔄 ${Math.round(cadence)} spm<br>
🔥 ${Math.round(calories)} kcal
`;

render();

},console.error,{enableHighAccuracy:true});
}

function stopTracking(){
navigator.geolocation.clearWatch(watchId);
watchId=null;
active=false;
paused=false;
}

// ================= BUTTONS =================
const startBtn=document.getElementById('startBtn');
const pauseBtn=document.getElementById('pauseBtn');

startBtn.onclick=()=>{
if(!active){
active=true;
startTracking();
startBtn.textContent="⏹️ Stop";
startBtn.className="stopBtn";
pauseBtn.disabled=false;
}else{
stopTracking();
startBtn.textContent="▶️ Start";
startBtn.className="startBtn";
pauseBtn.disabled=true;
}
};

pauseBtn.onclick=()=>{
paused=!paused;
pauseBtn.textContent=paused?"▶️ Hervatten":"⏸️ Pauze";
pauseBtn.className=paused?"resumeBtn":"pauseBtn";
};

// ================= UI =================
function render(){
const l=document.getElementById('list');
l.innerHTML="";

waypoints.forEach(w=>{
let s="⏳";
if(w.passed) s="✅";
else if(w.missed) s="❌";

l.innerHTML+=`
<tr>
<td>${s}</td>
<td>${w.name}</td>
<td>${w.segment.toFixed(1)}</td>
</tr>`;
});
}

</script>

</body>
</html>
