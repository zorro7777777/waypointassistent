<!DOCTYPE html>

<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Engine v77.1 Stable Fix</title>

<style>
body { font-family: sans-serif; padding: 10px; background: #f0f3f5; color: #2c3e50; font-size: 14px; }

.card {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-bottom: 10px;
}

.stat-box {
    background: #fff;
    border: 1px solid #ddd;
    padding: 8px 2px;
    border-radius: 8px;
    text-align: center;
}

.stat-label {
    font-size: 0.6rem;
    color: #7f8c8d;
    text-transform: uppercase;
    display: block;
}

.stat-val {
    font-weight: bold;
    font-size: 0.95rem;
}

#info {
    background: #1a1a1a;
    color: #00ff00;
    padding: 15px;
    border-radius: 8px;
    font-family: monospace;
    margin: 10px 0;
    min-height: 200px;
    border-left: 5px solid #27ae60;
    font-size: 0.82rem;
    position: relative;
}

.gear-icon {
    position: absolute;
    top: 10px;
    right: 10px;
    cursor: pointer;
}

.config-section {
    background: #ecf0f1;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 10px;
    border: 1px solid #dcdde1;
}

.row {
    display: flex;
    gap: 5px;
    align-items: center;
    margin-bottom: 8px;
}

button {
    padding: 12px;
    border: none;
    border-radius: 8px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    flex: 1;
}

.start { background: #27ae60; flex: 2; }
.stop { background: #e74c3c; flex: 2; }
.toggle-list { background: #3498db; }
.reset { background: #e74c3c; flex: 1; }

#gpxInput {
    width:100%;
    margin-bottom:10px;
    border:1px solid #ccc;
    padding:5px;
    border-radius:5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
}

td {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
}
</style>

</head>

<body>

<div class="card">

<h2 style="text-align:center;">💿 GPX ENGINE v77.1 FIX</h2>

<div class="stats-grid">
    <div class="stat-box"><span class="stat-label">Stappen</span><span id="stat-steps">0</span></div>
    <div class="stat-box"><span class="stat-label">Cadans</span><span id="stat-cadence">0</span></div>
    <div class="stat-box"><span class="stat-label">Kcal</span><span id="stat-kcal">0</span></div>
    <div class="stat-box"><span class="stat-label">Trip Km</span><span id="stat-trip">0.00</span></div>
</div>

<div class="config-section">
    <label><input type="checkbox" id="audioToggle" checked> 🔊 Spraak</label>
    <label style="margin-left:10px;"><input type="checkbox" id="ultraToggle"> ⚡ Ultra</label>
</div>

<input type="file" id="gpxInput" accept=".gpx">

<div class="row">
    <button onclick="startGPS()" id="startBtn" class="start">▶ START</button>
    <button onclick="toggleTable()" class="toggle-list">📑 LIST</button>
    <button onclick="location.reload()" class="reset">🔄</button>
</div>

<div id="info">
<div class="gear-icon" onclick="toggleConfig()">⚙️</div>
<div id="display">Systeem standby</div>
</div>

<div id="tableCon">
<table><tbody id="list"></tbody></table>
</div>

</div>

<script>

let track=[], cumDist=[], waypoints=[];
let watchId=null;
let lastIndex=0;
let isPaused=false;
let autoPaused=false;
let stillTime=0;
let ultraMode=false;

let sport={movingTime:0,idleTime:0,lastTick:null};

const CONFIG={ms:1.2};

function speak(t){
if(!document.getElementById('audioToggle').checked) return;
const s=new SpeechSynthesisUtterance(t);
s.lang="nl-NL";
speechSynthesis.speak(s);
}

function getDist(a,b,c,d){
const R=6371000;
const dLat=(c-a)*Math.PI/180;
const dLon=(d-b)*Math.PI/180;
return 2*R*Math.asin(Math.sqrt(Math.sin(dLat/2)**2+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dLon/2)**2));
}

function getRInfo(lat,lon){

let start=Math.max(0,lastIndex-25);
let end=Math.min(track.length,lastIndex+25);

let best=lastIndex,bestD=999999;

for(let i=start;i<end;i++){
const d=getDist(lat,lon,track[i].lat,track[i].lon);
if(d<bestD){bestD=d;best=i;}
}

lastIndex=best;
return {pos:cumDist[best],off:bestD};
}

document.getElementById('gpxInput').onchange=e=>{
const file=e.target.files[0];
const r=new FileReader();

r.onload=ev=>{
const xml=new DOMParser().parseFromString(ev.target.result,"text/xml");
const pts=[...xml.getElementsByTagName('trkpt')];

track=pts.map(p=>({lat:+p.getAttribute('lat'),lon:+p.getAttribute('lon')}));

cumDist=[0];
for(let i=1;i<track.length;i++){
cumDist[i]=cumDist[i-1]+getDist(track[i-1].lat,track[i-1].lon,track[i].lat,track[i].lon);
}

document.getElementById('display').innerText="GPX geladen";
};

r.readAsText(file);
};

function startGPS(){

if(!track.length){
alert("Laad GPX eerst");
return;
}

// START WATCH
if(!watchId){

watchId=navigator.geolocation.watchPosition(p=>{

const now=Date.now();
const {latitude:lat,longitude:lon,speed:s}=p.coords;
const skmh=(s||0)*3.6;

const dt=sport.lastTick?(now-sport.lastTick)/1000:0;
sport.lastTick=now;

ultraMode=document.getElementById('ultraToggle').checked;

const R=getRInfo(lat,lon);
const moving=skmh>CONFIG.ms*3.6;

if(!moving) stillTime+=dt;
else stillTime=0;

if(!autoPaused && stillTime>5){autoPaused=true;speak("Auto pauze");}
if(autoPaused && moving){autoPaused=false;speak("Verder");}

const active=!isPaused&&!autoPaused&&moving;

if(active){
sport.movingTime+=dt;
}else if(!isPaused&&!autoPaused){
sport.idleTime+=dt;
}

document.getElementById('display').innerHTML=
"AFSTAND OFF: "+Math.round(R.off)+"m";

},err=>console.log(err),{enableHighAccuracy:true});

document.getElementById('startBtn').innerText="■ STOP";
return;
}

// TOGGLE PAUSE
isPaused=!isPaused;

document.getElementById('startBtn').innerText=isPaused?"▶ START":"■ STOP";

}

function toggleTable(){
const el=document.getElementById('tableCon');
el.style.display=el.style.display==="none"?"block":"none";
}

function toggleConfig(){
alert("config toggle");
}

</script>

</body>
</html>
