<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPX Wandel Tracker V4</title>

<style>
body { font-family: Arial; }

h1 { margin-bottom: 5px; }

.version {
    font-size: 14px;
    color: #666;
    margin-bottom: 10px;
}

.controls {
    display: flex;
    gap: 10px;
    margin: 10px 0;
}

button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    height: 50px;
    border: none;
    border-radius: 6px;
    color: white;
}

.start { background: #2ecc71; }
.stop { background: #e74c3c; }
.pause { background: #f39c12; }
.resume { background: #2ecc71; }

.passed { background: #c8f7c5; }
.skipped { background: #ffe1e1; }
.current { background: #fff3b0; }

/* waypoint styling */
td.name { color: blue; font-weight: bold; }
td.startName { color: green; font-weight: bold; }
td.endName { color: red; font-weight: bold; }

table { border-spacing: 3px; }
td, th { border: 2px double black; padding: 6px; }

</style>
</head>

<body>

<h1>GPX Wandel Tracker</h1>
<div class="version">Versie 4.0 (segment projection engine)</div>

<input type="file" id="gpxFile" accept=".gpx">

<div class="controls">
    <button id="startStopBtn" class="start">▶️ Start activiteit</button>
    <button id="pauseBtn" class="pause" disabled>⏸️ Pauze</button>
</div>

<h2>Status</h2>
<div id="info">Niet gestart</div>

<h2>Waypoints</h2>
<table>
<thead>
<tr>
<th>Status</th><th>Naam</th>
</tr>
</thead>
<tbody id="waypointsList"></tbody>
</table>

<script>

let trackpoints = [];
let waypoints = [];
let trackCumDist = [];

let lastPosition = null;
let tripDistance = 0;

let trackingActive = false;
let paused = false;
let watchId = null;

const tolerance = 15;
const skipTolerance = 50;

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI/180;
    const dLon = (lon2 - lon1) * Math.PI/180;

    const a = Math.sin(dLat/2)**2 +
        Math.cos(lat1*Math.PI/180) *
        Math.cos(lat2*Math.PI/180) *
        Math.sin(dLon/2)**2;

    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function buildTrackDistance() {
    trackCumDist = [0];
    for (let i = 1; i < trackpoints.length; i++) {
        const d = calculateDistance(
            trackpoints[i-1].lat, trackpoints[i-1].lon,
            trackpoints[i].lat, trackpoints[i].lon
        );
        trackCumDist[i] = trackCumDist[i-1] + d;
    }
}

function projectOnTrack(lat, lon) {
    let bestDist = Infinity;
    let bestIndex = 0;

    for (let i = 0; i < trackpoints.length; i++) {
        const d = calculateDistance(lat, lon, trackpoints[i].lat, trackpoints[i].lon);
        if (d < bestDist) {
            bestDist = d;
            bestIndex = i;
        }
    }

    return {
        index: bestIndex,
        dist: trackCumDist[bestIndex]
    };
}

// GPX load

document.getElementById('gpxFile').addEventListener('change', e => {

    const reader = new FileReader();

    reader.onload = evt => {
        const xml = new DOMParser().parseFromString(evt.target.result, "text/xml");

        trackpoints = Array.from(xml.getElementsByTagName('trkpt')).map(p => ({
            lat: parseFloat(p.getAttribute('lat')),
            lon: parseFloat(p.getAttribute('lon'))
        }));

        buildTrackDistance();

        const wpts = Array.from(xml.getElementsByTagName('wpt'));
        processWaypoints(wpts);
        updateWaypointsTable();
    };

    reader.readAsText(e.target.files[0]);
});

function processWaypoints(wpts) {

    let temp = [];

    wpts.forEach(wp => {
        temp.push({
            name: wp.getElementsByTagName('name')[0]?.textContent || "WP",
            lat: parseFloat(wp.getAttribute('lat')),
            lon: parseFloat(wp.getAttribute('lon'))
        });
    });

    temp.unshift({ name: "Start", lat: trackpoints[0].lat, lon: trackpoints[0].lon });
    temp.push({ name: "Einde", lat: trackpoints.at(-1).lat, lon: trackpoints.at(-1).lon });

    waypoints = temp.map(wp => {
        const proj = projectOnTrack(wp.lat, wp.lon);
        return {
            ...wp,
            rankDist: proj.dist,
            touched: false,
            status: "pending"
        };
    });

    waypoints.sort((a,b)=>a.rankDist-b.rankDist);
}

const startStopBtn = document.getElementById('startStopBtn');
const pauseBtn = document.getElementById('pauseBtn');

startStopBtn.onclick = () => {

    if (!trackingActive) {
        startTracking();
        trackingActive = true;
        startStopBtn.className = "stop";
        startStopBtn.textContent = "⏹️ Stop activiteit";
        pauseBtn.disabled = false;
    } else {
        stopTracking();
        trackingActive = false;
        startStopBtn.className = "start";
        startStopBtn.textContent = "▶️ Start activiteit";
        pauseBtn.disabled = true;
    }
};

pauseBtn.onclick = () => {
    paused = !paused;
    pauseBtn.className = paused ? "resume" : "pause";
    pauseBtn.textContent = paused ? "▶️ Hervatten" : "⏸️ Pauze";
    if (!paused) lastPosition = null;
};

function startTracking() {

    watchId = navigator.geolocation.watchPosition(pos => {

        if (!trackingActive || paused) return;

        const { latitude, longitude } = pos.coords;

        if (lastPosition) {
            const d = calculateDistance(lastPosition.lat, lastPosition.lon, latitude, longitude);
            if (d > 3) tripDistance += d;
        }
        lastPosition = { lat: latitude, lon: longitude };

        const proj = projectOnTrack(latitude, longitude);

        updateWaypoints(proj.dist);
        updateUI(proj, latitude, longitude);

    }, console.error, { enableHighAccuracy:true });
}

function stopTracking() {
    navigator.geolocation.clearWatch(watchId);

    tripDistance = 0;
    lastPosition = null;

    waypoints.forEach(w => {
        w.touched = false;
        w.status = "pending";
    });

    updateWaypointsTable();
    document.getElementById('info').innerHTML = "Gestopt";
}

function updateWaypoints(currentDist) {

    waypoints.forEach(wp => {

        const near = Math.abs(currentDist - wp.rankDist) < tolerance;
        if (near) wp.touched = true;

        if (wp.touched && currentDist >= wp.rankDist - tolerance) {
            wp.status = "passed";
        }

        if (!wp.touched && currentDist > wp.rankDist + skipTolerance) {
            wp.status = "skipped";
        }
    });
}

function updateWaypointsTable() {

    const list = document.getElementById('waypointsList');
    list.innerHTML = '';

    waypoints.forEach(wp => {

        let sym = "⏳", cls = "";
        if (wp.status === "passed") { sym = "✅"; cls = "passed"; }
        if (wp.status === "skipped") { sym = "⚠️"; cls = "skipped"; }

        let nameClass = "name";
        if (wp.name === "Start") nameClass = "startName";
        if (wp.name === "Einde") nameClass = "endName";

        const row = document.createElement('tr');
        row.className = cls;

        row.innerHTML = `<td>${sym}</td><td class="${nameClass}">${wp.name}</td>`;
        list.appendChild(row);
    });
}

function updateUI(proj, lat, lon) {

    const remaining = waypoints.filter(w => w.status !== "passed").length;

    document.getElementById('info').innerHTML = `
    📍 ${lat.toFixed(6)}, ${lon.toFixed(6)}<br>
    🧭 Afstand op track: ${proj.dist.toFixed(1)} m<br>
    🧭 Trip GPS: ${(tripDistance/1000).toFixed(2)} km<br>
    📌 Resterend: ${remaining}<br>
    Status: ${paused ? "⏸️ Pauze" : "▶️ Actief"}
    `;
}

</script>

</body>
</html>
